// Simpan instance ke dalam objek global agar mudah di-destroy saat ganti bulan
let kumpulanGrafik = { hadir: null, sakit: null, izin: null, alpa: null };

function buatGrafikTunggal(canvasId, labelDataset, dataArray, labelsHari, warnaGaris, warnaIsi, tipeChart = 'line') {
  const canvasElement = document.getElementById(canvasId);
  if (!canvasElement) return;

  const ctx = canvasElement.getContext('2d');
  const isDark = document.documentElement.classList.contains('dark');
  const textColor = isDark ? '#9ca3af' : '#4b5563';
  const gridColor = isDark ? '#374151' : '#f3f4f6';

  // Hancurkan grafik lama jika ada di memori canvas terkait
  const tipeKunci = canvasId.replace('chart', '').replace('Mandiri', '').toLowerCase();
  if (kumpulanGrafik[tipeKunci]) {
    kumpulanGrafik[tipeKunci].destroy();
  }

  kumpulanGrafik[tipeKunci] = new Chart(ctx, {
    type: tipeChart,
    data: {
      labels: labelsHari,
      datasets: [{
        label: labelDataset,
        data: dataArray,
        borderColor: warnaGaris,
        backgroundColor: warnaIsi,
        borderWidth: 2,
        tension: 0.1,
        fill: tipeChart === 'line' ? false : true,
        borderRadius: tipeChart === 'bar' ? 4 : 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }, // Kita hilangkan legend kotak karena judul sudah mewakili
        tooltip: { mode: 'index', intersect: false }
      },
      scales: {
        x: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10 } } },
        y: { 
          grid: { color: gridColor }, 
          ticks: { color: textColor, stepSize: tipeKunci === 'hadir' ? 50 : 1 },
          min: 0
        }
      }
    }
  });
}

// Fungsi utama pemrosesan data (Hanya mengambil hari aktif sekolah)
function loadData4GrafikMandiri(bulanValue) {
  const [tahun, bulan] = bulanValue.split('-');
  const jumlahHari = new Date(tahun, bulan, 0).getDate();

  const labelsHariAktif = [];
  const dataHadir = [];
  const dataSakit = [];
  const dataIzin = [];
  const dataAlpa = [];
  const dataBelumDiabsen = []; // <-- Array baru untuk menampung data siswa yang belum absen

  const dataSumber = (typeof DB !== 'undefined' && DB.kehadiran) ? DB.kehadiran : [];
  const totalSiswaSekolah = (typeof DB !== 'undefined' && DB.siswa) ? DB.siswa.length : 0;

  for (let i = 1; i <= jumlahHari; i++) {
    const tglDuaDigit = String(i).padStart(2, '0');
    const blnDuaDigit = String(bulan).padStart(2, '0');
    const formatTanggalMurni = `${tahun}-${blnDuaDigit}-${tglDuaDigit}`;

    // Filter data presensi pada tanggal spesifik ini
    const dataHariIni = dataSumber.filter(item => item && item.tanggal === formatTanggalMurni);

    // HANYA TAMPILKAN TANGGAL JIKA HARI TERSEBUT SUDAH MASUK HARI AKTIF (Mulai tgl 7 dst)
    if (dataHariIni.length > 0) {
      labelsHariAktif.push(`Tgl ${i}`);

      let totalHadir = 0;
      let totalSakit = 0;
      let totalIzin = 0;
      let totalAlpa = 0;

      dataHariIni.forEach(p => {
        const status = p.status ? p.status.toLowerCase().trim() : '';
        if (status === 'hadir' || status === 'h') totalHadir++;
        else if (status === 'sakit' || status === 's') totalSakit++;
        else if (status === 'izin' || status === 'i') totalIzin++;
        else if (status === 'alpa' || status === 'a' || status === 'alpha') totalAlpa++;
      });

      // 💡 HITUNG DATA BELUM DIABSEN
      // Jumlah baris masuk dari sekretaris dikurangi total siswa sekolah
      const totalSudahDiabsen = totalHadir + totalSakit + totalIzin + totalAlpa;
      let belumDiabsen = Math.max(0, totalSiswaSekolah - totalSudahDiabsen);

      // Jika di hari tersebut sekretaris sama sekali belum menginput siapa pun, 
      // maka seluruh siswa sekolah masuk kategori "Belum Diabsen" dan Hadir menjadi 0
      if (totalSudahDiabsen === 0) {
        belumDiabsen = totalSiswaSekolah;
        totalHadir = 0;
      }

      dataHadir.push(totalHadir);
      dataSakit.push(totalSakit);
      dataIzin.push(totalIzin);
      dataAlpa.push(totalAlpa);
      dataBelumDiabsen.push(belumDiabsen);
    }
  }

  if (labelsHariAktif.length === 0) {
    labelsHariAktif.push("Belum ada data");
    dataHadir.push(0); dataSakit.push(0); dataIzin.push(0); dataAlpa.push(0); dataBelumDiabsen.push(0);
  }

  // Render 5 Grafik Mandiri secara realtime
  buatGrafikTunggal('chartHadirMandiri', 'Hadir', dataHadir, labelsHariAktif, '#10b981', 'transparent', 'line');
  buatGrafikTunggal('chartSakitMandiri', 'Sakit', dataSakit, labelsHariAktif, '#3b82f6', '#3b82f6', 'bar');
  buatGrafikTunggal('chartIzinMandiri', 'Izin', dataIzin, labelsHariAktif, '#eab308', '#eab308', 'bar');
  buatGrafikTunggal('chartAlpaMandiri', 'Alpa', dataAlpa, labelsHariAktif, '#ef4444', '#ef4444', 'bar');
  
  // Tambahkan pemicu gambar untuk grafik kelima (Belum Diabsen) berwarna Abu-abu / Gray
  buatGrafikTunggal('chartBelumDiabsenMandiri', 'Belum Diabsen', dataBelumDiabsen, labelsHariAktif, '#9ca3af', '#9ca3af', 'bar');
}

function loadDataGrafikPerBulan(bulanValue) {
  const [tahun, bulan] = bulanValue.split('-');
  const jumlahHari = new Date(tahun, bulan, 0).getDate();

  const labelsHari = [];
  const arrayHadir = [];
  const arraySakit = [];
  const arrayIzin = [];
  const arrayAlpa = [];

  // Loop menggenerate data per hari dalam satu bulan penuh
  for (let i = 1; i <= jumlahHari; i++) {
    labelsHari.push(`${i}`);
    
    // 💡 Dummy Data Generator (Silakan mapping ke database real jika sudah siap)
    arrayHadir.push(Math.floor(Math.random() * (1550 - 1500 + 1)) + 1500);
    arraySakit.push(Math.floor(Math.random() * 5));
    arrayIzin.push(Math.floor(Math.random() * 4));
    arrayAlpa.push(Math.floor(Math.random() * 8));
  }

  // Akumulasikan total data bulan bersangkutan
  const totalHadir = arrayHadir.reduce((a, b) => a + b, 0);
  const totalSakit = arraySakit.reduce((a, b) => a + b, 0);
  const totalIzin = arrayIzin.reduce((a, b) => a + b, 0);
  const totalAlpa = arrayAlpa.reduce((a, b) => a + b, 0);
  const grandTotal = totalHadir + totalSakit + totalIzin + totalAlpa;

  // Render balik kalkulasi total ke kotak data di atasnya
  document.getElementById('box-hadir').innerText = totalHadir;
  document.getElementById('box-sakit').innerText = totalSakit;
  document.getElementById('box-izin').innerText = totalIzin;
  document.getElementById('box-alpa').innerText = totalAlpa;

  document.getElementById('box-hadir-persen').innerText = ((totalHadir / grandTotal) * 100).toFixed(1) + '%';
  document.getElementById('box-sakit-persen').innerText = ((totalSakit / grandTotal) * 100).toFixed(1) + '%';
  document.getElementById('box-izin-persen').innerText = ((totalIzin / grandTotal) * 100).toFixed(1) + '%';
  document.getElementById('box-alpa-persen').innerText = ((totalAlpa / grandTotal) * 100).toFixed(1) + '%';

  // Gambar grafik dengan koordinat baru
  updateAtauBuildChart(labelsHari, arrayHadir, arraySakit, arrayIzin, arrayAlpa);
}

function renderTopSiswaAlpa() {
  // 🔥 KUNCI UTAMA: Jika data kehadiran kosong (setelah reset), paksa tampilan bersih 0 (Tanpa Alpa)
  if (!DB.kehadiran || !Array.isArray(DB.kehadiran) || DB.kehadiran.length === 0) {
    const container = document.getElementById('topAlpaContainer') || document.getElementById('mainContent');
    // Jika fungsi ini mengembalikan string HTML:
    return `<div class="p-4 text-center text-sm text-gray-500 bg-gray-50 dark:bg-gray-900/50 rounded-xl border border-dashed">Tidak ada data ketidakhadiran (Alpa: 0)</div>`;
  }

  // 1. Kumpulkan data alpa secara dinamis dengan mencocokkan ID siswa ke master DB.siswa
  const hitungAlpa = {};

  DB.kehadiran.forEach(h => {
    // Hanya proses data yang status absennya adalah 'Alpa' (atau 'A')
    if (String(h.status).trim().toLowerCase() === 'alpa' || String(h.status).trim().toUpperCase() === 'A') {
      const sId = String(h.siswaId).trim();
      hitungAlpa[sId] = (hitungAlpa[sId] || 0) + 1;
    }
  });

  // 2. Petakan hasil hitungan ke dalam struktur objek profil siswa lengkap
  let ranking = Object.keys(hitungAlpa).map(sId => {
    // Cari data profil siswa asli di master DB.siswa
    const siswaObj = (DB.siswa || []).find(s => String(s.id).trim() === sId);
    
    // Jika siswa tidak ada, kembalikan null untuk ditapis/dibuang nanti
    if (!siswaObj) return null;

    return {
      nama: siswaObj.nama,
      kelas: siswaObj.kelas,
      alpa: hitungAlpa[sId]
    };
  });

  // 🔍 BARU: Bersihkan data yatim (null) agar tidak tampil di tabel statistik kesiswaan
  ranking = ranking.filter(item => item !== null);

  // 3. Urutkan dari jumlah Alpa yang paling banyak/tertinggi
  ranking.sort((a, b) => b.alpa - a.alpa);

  // 4. Render output ke dalam struktur tabel visual dashboard kesiswaan
  // (Pertahankan sisa baris kode di bawahnya milik Anda seperti <table>... hingga penutup return `...`)
  return `
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
    <div class="bg-red-600 text-white px-4 py-3 font-bold flex items-center gap-2">
      <span>🚨</span> Top Siswa Alpa (Kumulatif)

    <table class="w-full text-sm">
      <thead class="bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs font-semibold">
        <tr>
          <th class="p-3 text-center w-16">No</th>
          <th class="p-3 text-left">Nama Lengkap / Rombel</th>
          <th class="p-3 text-center w-24">Total Alpa</th>
        </tr>

      <tbody>
        ${ranking.length > 0 ? ranking.slice(0, 10).map((r, i) => `
          <tr class="border-b border-gray-100 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-50/50">
            <td class="p-3 text-center font-bold">
              ${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}

async function tambahJadwalKesiswaan(event) {
  if (event) event.preventDefault(); // Mencegah reload halaman

  console.log("1. Proses simpan dimulai...");

  const tgl = document.getElementById('inputTglJadwal')?.value;
  const nama = document.getElementById('inputNamaJadwal')?.value.trim();
  const status = document.getElementById('inputStatusJadwal')?.value;

  if (!tgl || !nama) {
    tampilkanNotifikasi('Tanggal dan Nama Agenda wajib diisi!', 'error');
    return;
  }

  const newJadwal = {
    id: 'JDW_' + Date.now(),
    tanggal: tgl,
    namaKegiatan: nama,
    status: status,
    createdAt: new Date().toISOString()
  };

  if (!Array.isArray(DB.jadwalKesiswaan)) DB.jadwalKesiswaan = [];
  DB.jadwalKesiswaan.push(newJadwal);

  console.log("2. Menjalankan simpanDataKeStorage...");
  
  let berhasil = false;
  try {
    berhasil = await simpanDataKeStorage('jadwalKesiswaan');
  } catch (err) {
    console.error("Error pada simpanDataKeStorage:", err);
  }

  console.log("3. Hasil simpan:", berhasil);

  if (berhasil) {
    document.getElementById('formJadwalKesiswaan')?.reset();
    tampilkanNotifikasi('Agenda berhasil disimpan!', 'success');
    renderJadwalKesiswaan();
  } else {
    tampilkanNotifikasi('Gagal menyimpan agenda!', 'error');
  }
}

function tampilkanNotifikasi(pesan, tipe = 'info') {
  // 1. Jika ada fungsi showToast bawaan project yang berjalan, pakai itu
  if (typeof showToast === 'function') {
    try {
      showToast(pesan, tipe);
      return;
    } catch (e) {
      console.warn("showToast bawaan error, beralih ke UI bawaan:", e);
    }
  }

  // 2. Jika tidak ada, buat Toast UI Melayang Otomatis
  let container = document.getElementById('custom-toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'custom-toast-container';
    container.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;';
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  const bgColor = tipe === 'error' ? '#ef4444' : (tipe === 'success' ? '#10b981' : '#3b82f6');

  toast.style.cssText = `
    background-color: ${bgColor};
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    font-weight: 600;
    font-size: 14px;
    font-family: sans-serif;
    transition: all 0.3s ease;
    opacity: 0;
    transform: translateY(-10px);
    pointer-events: auto;
  `;
  toast.innerText = pesan;
  container.appendChild(toast);

  // Animasi Muncul
  requestAnimationFrame(() => {
    toast.style.opacity = '1';
    toast.style.transform = 'translateY(0)';
  });

  // Hilang Otomatis setelah 3 detik
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-10px)';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// B. RENDER KALENDER (Mengambil dari state DB lokal yang tersinkron)
async function renderJadwalKesiswaan() {
  const filterTahun = document.getElementById('filterTahunJadwal')?.value || new Date().getFullYear();
  const filterBulan = document.getElementById('filterBulanJadwal')?.value || (new Date().getMonth() + 1);

  const namaBulanList = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
  const displayHeader = document.getElementById('displayBulanTahun');
  if (displayHeader) displayHeader.innerText = `${namaBulanList[filterBulan - 1]} ${filterTahun}`;

  const tglAkhirBulan = new Date(filterTahun, filterBulan, 0).getDate();
  if (document.getElementById('displayTglAwal')) document.getElementById('displayTglAwal').innerText = `1/${filterBulan}/${filterTahun}`;
  if (document.getElementById('displayTglAkhir')) document.getElementById('displayTglAkhir').innerText = `${tglAkhirBulan}/${filterBulan}/${filterTahun}`;

  // Menggunakan data dari DB lokal
  let listJadwal = DB.jadwalKesiswaan || [];

  // Load Catatan
  loadCatatanKesiswaan(filterTahun, filterBulan);

  // Render Grid Kalender
  const container = document.getElementById('gridKalenderKesiswaan');
  if (!container) return;

  container.innerHTML = '';

  const firstDayIndex = new Date(filterTahun, filterBulan - 1, 1).getDay(); 
  const startingDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1; 

  for (let x = 0; x < startingDay; x++) {
    container.innerHTML += `<div class="bg-gray-100 dark:bg-gray-800/40 rounded-lg min-h-[90px] p-1 border border-dashed border-gray-200 dark:border-gray-700"></div>`;
  }

  for (let d = 1; d <= tglAkhirBulan; d++) {
    const formatTgl = `${filterTahun}-${String(filterBulan).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const agendaHariIni = listJadwal.filter(j => j && j.tanggal === formatTgl);

    let htmlAgenda = agendaHariIni.map(a => {
      let colorClass = 'bg-teal-100 text-teal-800 dark:bg-teal-900/50 dark:text-teal-300';
      if (a.status === 'Wajib') colorClass = 'bg-red-100 text-red-800 dark:bg-red-900/50 dark:text-red-300';
      if (a.status === 'Rutin') colorClass = 'bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-300';

      return `
        <div class="text-[10px] p-1 rounded font-semibold ${colorClass} flex justify-between items-center group mb-1">
          <span class="truncate">${a.namaKegiatan}</span>
          <button onclick="hapusJadwalKesiswaan('${a.id}')" class="text-red-500 hover:text-red-700 opacity-0 group-hover:opacity-100 transition-opacity ml-1 font-bold">×</button>
        </div>
      `;
    }).join('');

    container.innerHTML += `
      <div class="bg-white dark:bg-gray-800 rounded-lg min-h-[90px] p-1.5 border border-gray-100 dark:border-gray-700 flex flex-col justify-between">
        <div class="font-bold text-xs text-gray-700 dark:text-gray-300 mb-1">${d}</div>
        <div class="flex-1 overflow-y-auto max-h-[70px] space-y-1">${htmlAgenda}</div>
      </div>
    `;
  }
}

    renderJadwalKesiswaan();

}

// 2. FUNGSI UTAMA RENDER KALENDER (OTOMATIS TAMPIL BERDASARKAN BULAN/TAHUN SAAT INI)
function renderJadwalKesiswaan() {
  const now = new Date();
  
  const elBulan = document.getElementById('filterBulanJadwal');
  const elTahun = document.getElementById('filterTahunJadwal');

  if (elBulan && !elBulan.value) elBulan.value = now.getMonth() + 1;
  if (elTahun && !elTahun.value) elTahun.value = now.getFullYear();

  const bulan = parseInt(elBulan?.value || (now.getMonth() + 1));
  const tahun = parseInt(elTahun?.value || now.getFullYear());

  const namaBulanList = [
    "JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI", 
    "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DESEMBER"
  ];

  const jumlahHari = new Date(tahun, bulan, 0).getDate();
  const padMon = String(bulan).padStart(2, '0');
  const prefixTgl = `${tahun}-${padMon}-`;

  // Update Header Display
  const displayBulanTahun = document.getElementById('displayBulanTahun');
  if (displayBulanTahun) displayBulanTahun.innerText = `${namaBulanList[bulan - 1]} ${tahun}`;

  const displayTglAwal = document.getElementById('displayTglAwal');
  if (displayTglAwal) displayTglAwal.innerText = `1/${bulan}/${tahun}`;

  const displayTglAkhir = document.getElementById('displayTglAkhir');
  if (displayTglAkhir) displayTglAkhir.innerText = `${jumlahHari}/${bulan}/${tahun}`;

  // Load Catatan Kesiswaan
  const keyCatatan = `${tahun}-${padMon}`;
  const elCatatan = document.getElementById('catatanKesiswaan');
  if (elCatatan) {
    elCatatan.value = window.DB.catatanKesiswaan[keyCatatan] || '';
  }

  // Grouping Data
  const jadwalMap = new Map();
  (window.DB.jadwalKesiswaan || []).forEach(j => {
    if (j.tanggal && j.tanggal.startsWith(prefixTgl)) {
      if (!jadwalMap.has(j.tanggal)) jadwalMap.set(j.tanggal, []);
      jadwalMap.get(j.tanggal).push(j);
    }
  });

  // Offset Hari Pertama (Senin = 0, Minggu = 6)
  let dayOfWeek = new Date(tahun, bulan - 1, 1).getDay();
  let offset = (dayOfWeek === 0) ? 6 : dayOfWeek - 1; 

  const gridKalender = document.getElementById('gridKalenderKesiswaan');
  if (!gridKalender) return;

  let htmlGrid = '';

  // Slot Kosong Sebelum Tanggal 1
  for (let i = 0; i < offset; i++) {
    htmlGrid += `
      <div class="bg-gray-100 dark:bg-gray-800/40 min-h-[100px] h-auto rounded border border-gray-200/50 dark:border-gray-800"></div>
    `;
  }

  // Render Tanggal 1 s/d Akhir Bulan
  for (let d = 1; d <= jumlahHari; d++) {
    const padDay = String(d).padStart(2, '0');
    const formatTgl = `${prefixTgl}${padDay}`;
    const listJadwalHariIni = jadwalMap.get(formatTgl) || [];

    htmlGrid += `
      <!-- Kotak Tanggal Menggunakan min-h-[100px] h-auto Agar Fleksibel Bertambah Tinggi -->
      <div class="bg-white dark:bg-gray-800 min-h-[100px] h-auto rounded border border-gray-200 dark:border-gray-700 flex flex-col justify-start shadow-sm hover:border-teal-400 transition-all">
        <!-- Peach Header Tanggal -->
        <div class="bg-amber-200 dark:bg-amber-800/60 text-amber-900 dark:text-amber-100 font-extrabold text-xs px-2 py-0.5 border-b border-amber-300 dark:border-amber-700 flex justify-between items-center">
          <span>${d}</span>
          ${listJadwalHariIni.length > 0 ? `<span class="bg-teal-600 text-white rounded-full text-[9px] px-1.5 py-0.2">${listJadwalHariIni.length}</span>` : ''}
        </div>

        <!-- Container Isi Agenda (Tinggi Menyesuaikan Isi Teks) -->
        <div class="p-1 space-y-1 flex-1">
          ${listJadwalHariIni.map(j => {
            let colorBadge = 'bg-teal-100 text-teal-800 border-teal-300 dark:bg-teal-950 dark:text-teal-300';
            if (j.status === 'Wajib') colorBadge = 'bg-rose-100 text-rose-800 border-rose-300 dark:bg-rose-950 dark:text-rose-300';
            else if (j.status === 'Opsional') colorBadge = 'bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-950 dark:text-emerald-300';

            return `
              <div class="text-[10px] p-1.5 rounded border ${colorBadge} font-medium relative group flex justify-between items-start leading-snug">
                <!-- Teks Menjadi break-words & whitespace-normal Agar Melipat Otomatis -->
                <span class="break-words whitespace-normal w-full pr-1 font-semibold" title="${j.kegiatan}">${j.kegiatan}</span>
                <button type="button" onclick="hapusJadwalKesiswaan('${j.id}')" class="text-rose-500 font-bold hover:text-rose-700 hidden group-hover:inline-block ml-1 flex-shrink-0">✕</button>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  // Slot Kosong Setelah Akhir Bulan
  const totalSlots = offset + jumlahHari;
  const sisaSlot = (7 - (totalSlots % 7)) % 7;
  for (let i = 0; i < sisaSlot; i++) {
    htmlGrid += `
      <div class="bg-gray-100 dark:bg-gray-800/40 min-h-[100px] h-auto rounded border border-gray-200/50 dark:border-gray-800"></div>
    `;
  }

  gridKalender.innerHTML = htmlGrid;
}

// 3. FUNGSI TAMBAH JADWAL (SIMPAN PERMANEN)
function tambahJadwalKesiswaan(e) {
  if (e) e.preventDefault();

  const tgl = document.getElementById('inputTglJadwal')?.value;
  const kegiatan = document.getElementById('inputNamaJadwal')?.value.trim();
  const status = document.getElementById('inputStatusJadwal')?.value || 'Rutin';

  if (!tgl || !kegiatan) {
    alert("Mohon isi tanggal dan nama agenda!");
    return;
  }

  const itemBaru = {
    id: 'JDW_' + Date.now(),
    tanggal: tgl,
    kegiatan: kegiatan,
    status: status
  };

  window.DB.jadwalKesiswaan.push(itemBaru);
  simpanKeStorage(); // Simpan Permanen

  // Arahkan kalender otomatis ke bulan & tahun dari jadwal yang baru diinput
  const [thn, bln] = tgl.split('-');
  const elBulan = document.getElementById('filterBulanJadwal');
  const elTahun = document.getElementById('filterTahunJadwal');

  if (elBulan) elBulan.value = parseInt(bln);
  if (elTahun) elTahun.value = thn;

  // Reset Input Text
  document.getElementById('inputNamaJadwal').value = '';

  // Render Ulang Tampilan Kalender
  renderJadwalKesiswaan();
}

// 4. FUNGSI HAPUS JADWAL (SIMPAN PERMANEN)
function hapusJadwalKesiswaan(id) {
  if (confirm('Apakah Anda yakin ingin menghapus agenda ini?')) {
    window.DB.jadwalKesiswaan = window.DB.jadwalKesiswaan.filter(j => j.id !== id);
    simpanKeStorage(); // Simpan Permanen
    renderJadwalKesiswaan();
  }
}

// 5. FUNGSI SIMPAN CATATAN KESISWAAN (SIMPAN PERMANEN)
function simpanCatatanKesiswaan() {
  const elBulan = document.getElementById('filterBulanJadwal');
  const elTahun = document.getElementById('filterTahunJadwal');
  const now = new Date();

  const bulan = parseInt(elBulan?.value || (now.getMonth() + 1));
  const tahun = parseInt(elTahun?.value || now.getFullYear());
  const padMon = String(bulan).padStart(2, '0');
  const keyCatatan = `${tahun}-${padMon}`;

  const isiCatatan = document.getElementById('catatanKesiswaan')?.value || '';
  window.DB.catatanKesiswaan[keyCatatan] = isiCatatan;

  simpanKeStorage(); // Simpan Permanen
}

function generateRaporBulanan() {
  const bulan = parseInt(document.getElementById('filterBulanRapor')?.value || (new Date().getMonth() + 1));
  const tahun = parseInt(document.getElementById('filterTahunRapor')?.value || new Date().getFullYear());

  const padMon = String(bulan).padStart(2, '0');
  const prefixTgl = `${tahun}-${padMon}-`;
  const jumlahHari = new Date(tahun, bulan, 0).getDate();

  // --- 1. PRE-INDEXING DATA LIBUR (SET O(1)) ---
  const daftarLiburSet = new Set(
    (DB.libur || []).map(l => {
      let tglStr = String(l.tanggal || l.tgl || '').trim();
      if (tglStr.includes('-')) {
        const p = tglStr.split('-');
        if (p.length === 3) tglStr = `${p[0]}-${p[1].padStart(2, '0')}-${p[2].padStart(2, '0')}`;
      }
      return tglStr;
    })
  );

  // --- 2. HITUNG HARI EFEKTIF BULAN INI ---
  const hariEfektifList = [];
  for (let d = 1; d <= jumlahHari; d++) {
    const padDay = String(d).padStart(2, '0');
    const formatTgl = `${prefixTgl}${padDay}`;
    const isMinggu = new Date(tahun, bulan - 1, d).getDay() === 0;

    if (!isMinggu && !daftarLiburSet.has(formatTgl)) {
      hariEfektifList.push(formatTgl);
    }
  }

  // --- 3. PRE-INDEXING DATA PRESENSI, PELANGGARAN & KREDIT POIN (MAP O(1)) ---
  const kehadiranMap = new Map();
  (DB.kehadiran || []).forEach(k => {
    if (k.tanggal && k.tanggal.startsWith(prefixTgl)) {
      const key = `${String(k.siswaId).trim()}_${k.tanggal}`;
      kehadiranMap.set(key, String(k.status || '').toLowerCase());
    }
  });

  const pelanggaranMap = new Map();
  (DB.pelanggaran || []).forEach(p => {
    if (p.tanggal && p.tanggal.startsWith(prefixTgl)) {
      const sId = String(p.siswaId).trim();
      if (!pelanggaranMap.has(sId)) pelanggaranMap.set(sId, []);
      pelanggaranMap.get(sId).push(parseInt(p.poin || p.poinPelanggaran || 0));
    }
  });

  const kreditPoinMap = new Map();
  (DB.kreditPoin || []).forEach(kp => {
    if (kp.tanggal && kp.tanggal.startsWith(prefixTgl)) {
      const sId = String(kp.siswaId).trim();
      const currentPoin = kreditPoinMap.get(sId) || 0;
      kreditPoinMap.set(sId, currentPoin + parseInt(kp.poin || 0));
    }
  });

  const daftarSiswa = DB.siswa || [];
  const rekapKelasMap = {};

  // --- 4. PEMROSESAN DATA PER SISWA ---
  const rekapSiswa = daftarSiswa.map(siswa => {
    const siswaIdStr = String(siswa.id).trim();
    const kelas = siswa.kelas || 'Tanpa Kelas';

    if (!rekapKelasMap[kelas]) {
      rekapKelasMap[kelas] = {
        kelas,
        totalSiswa: 0,
        totalHadir: 0,
        totalAbsenEntri: 0,
        totalEkspektasiSlot: 0,
        totalKasusPelanggaran: 0,
        totalPoinPelanggaranKelas: 0
      };
    }
    rekapKelasMap[kelas].totalSiswa++;

    // Pelanggaran & Kredit Poin
    const listPelanggaran = pelanggaranMap.get(siswaIdStr) || [];
    const totalPoinPelanggaran = listPelanggaran.reduce((sum, p) => sum + p, 0);
    const totalKreditPoin = kreditPoinMap.get(siswaIdStr) || 0;

    rekapKelasMap[kelas].totalKasusPelanggaran += listPelanggaran.length;
    rekapKelasMap[kelas].totalPoinPelanggaranKelas += totalPoinPelanggaran;

    // Hitung Presensi
    let totalHadirSiswa = 0;
    let totalAlpa = 0, totalSakit = 0, totalIzin = 0;
    let totalHariEkspektasiSiswa = 0;

    for (let i = 0; i < hariEfektifList.length; i++) {
      const formatTgl = hariEfektifList[i];
      if (siswa.tglMasuk && formatTgl < siswa.tglMasuk) continue;

      totalHariEkspektasiSiswa++;
      rekapKelasMap[kelas].totalEkspektasiSlot++;

      const status = kehadiranMap.get(`${siswaIdStr}_${formatTgl}`);
      if (status !== undefined) {
        rekapKelasMap[kelas].totalAbsenEntri++;
        if (status === 'h' || status === 'hadir') {
          totalHadirSiswa++;
          rekapKelasMap[kelas].totalHadir++;
        } else if (status === 'a' || status === 'alpa' || status === 'alfa') totalAlpa++;
        else if (status === 's' || status === 'sakit') totalSakit++;
        else if (status === 'i' || status === 'izin') totalIzin++;
      }
    }

    const persentaseHadirSiswa = totalHariEkspektasiSiswa > 0 
      ? parseFloat(((totalHadirSiswa / totalHariEkspektasiSiswa) * 100).toFixed(1)) 
      : 0;

    // HITUNG POIN KETIDAKHADIRAN & SKOR BERSIH PATOKAN UTAMA
    const poinKetidakhadiran = (totalAlpa * 10) + (totalIzin * 2) + (totalSakit * 1);
    
    // FORMULA PATOKAN UTAMA: Kredit Poin - Pelanggaran - Poin Ketidakhadiran
    const netSkorBersih = totalKreditPoin - totalPoinPelanggaran - poinKetidakhadiran;

    const kreditPoinDasar = parseInt(siswa.kreditPoin || siswa.poin || 100);
    const skorAkhir = kreditPoinDasar + netSkorBersih;

    return {
      ...siswa,
      kreditPoinDasar,
      totalKreditPoin,
      totalPoinPelanggaran,
      poinKetidakhadiran,
      netSkorBersih, // Formula Utama Baru
      skorAkhir,
      totalAlpa,
      persentaseHadirSiswa,
      totalKasusPelanggaran: listPelanggaran.length
    };
  });

  // --- 5. OLAHKAN REKAP KELAS ---
  const rekapKelas = Object.values(rekapKelasMap).map(k => {
    const isLengkap = k.totalAbsenEntri === k.totalEkspektasiSlot;
    const isValid = k.totalSiswa > 0 && k.totalEkspektasiSlot > 0 && isLengkap;
    const persentaseHadir = k.totalEkspektasiSlot > 0 
      ? parseFloat(((k.totalHadir / k.totalEkspektasiSlot) * 100).toFixed(1)) 
      : 0;

    return { ...k, persentaseHadir, isValid };
  }).sort((a, b) => a.kelas.localeCompare(b.kelas));

  // --- 6. RENDER TABEL 1: PERSENTASE KEHADIRAN KELAS ---
  const sortedKehadiranKelas = [...rekapKelas].sort((a, b) => b.persentaseHadir - a.persentaseHadir);
  const elBodyKehadiran = document.getElementById('bodyTabelKehadiranKelas');
  if (elBodyKehadiran) {
    elBodyKehadiran.innerHTML = sortedKehadiranKelas.map((k, idx) => `
      <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/30">
        <td class="p-2.5 text-center font-bold ${idx < 3 ? 'text-amber-500' : 'text-gray-400'}">${idx + 1}</td>
        <td class="p-2.5 font-bold text-gray-800 dark:text-gray-200">${k.kelas}</td>
        <td class="p-2.5 text-center font-semibold text-emerald-600">${k.persentaseHadir}%</td>
        <td class="p-2.5 text-center">
          ${k.isValid 
            ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-400">Valid</span>`
            : `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700 dark:bg-rose-950/50 dark:text-rose-400" title="Absen belum lengkap">Tidak Valid</span>`
          }
        </td>
      </tr>
    `).join('') || `<tr><td colspan="4" class="p-4 text-center text-gray-400">Belum ada data.</td></tr>`;
  }

  // --- 7. RENDER TABEL 2: PELANGGARAN KELAS ---
  const sortedPelanggaranKelas = [...rekapKelas].sort((a, b) => a.totalKasusPelanggaran - b.totalKasusPelanggaran);
  const elBodyPelanggaran = document.getElementById('bodyTabelPelanggaranKelas');
  if (elBodyPelanggaran) {
    elBodyPelanggaran.innerHTML = sortedPelanggaranKelas.map((k, idx) => `
      <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/30">
        <td class="p-2.5 text-center font-bold ${idx < 3 ? 'text-blue-500' : 'text-gray-400'}">${idx + 1}</td>
        <td class="p-2.5 font-bold text-gray-800 dark:text-gray-200">${k.kelas}</td>
        <td class="p-2.5 text-center font-bold text-gray-700 dark:text-gray-300">${k.totalKasusPelanggaran} Kasus</td>
        <td class="p-2.5 text-center font-semibold text-rose-600">-${k.totalPoinPelanggaranKelas} Pts</td>
      </tr>
    `).join('') || `<tr><td colspan="4" class="p-4 text-center text-gray-400">Belum ada data.</td></tr>`;
  }

  // --- 8. LOGIKA PEMERINGKATAN PATOKAN UTAMA BARU ---
  const daftarKandidatDisiplin = [...rekapSiswa].sort((a, b) => {
    // 1. PATOKAN UTAMA: Net Skor Bersih (Kredit Poin - Pelanggaran - Ketidakhadiran)
    if (b.netSkorBersih !== a.netSkorBersih) {
      return b.netSkorBersih - a.netSkorBersih;
    }
    // 2. PEMUTUS SERI 1: Persentase Kehadiran
    if (b.persentaseHadirSiswa !== a.persentaseHadirSiswa) {
      return b.persentaseHadirSiswa - a.persentaseHadirSiswa;
    }
    // 3. PEMUTUS SERI 2: Abjad Nama
    return (a.nama || '').localeCompare(b.nama || '');
  });

  // --- 9. RENDER WIDGET SISWA TERBAIK BULAN INI (TOP 3) ---
  const top3Siswa = daftarKandidatDisiplin.slice(0, 3);
  const elWidgetTerbaik = document.getElementById('widgetSiswaTerbaik');

  if (elWidgetTerbaik) {
    if (top3Siswa.length > 0) {
      elWidgetTerbaik.innerHTML = top3Siswa.map((siswa, idx) => {
        const warnaBadge = idx === 0 ? 'bg-amber-500' : idx === 1 ? 'bg-slate-400' : 'bg-amber-700';
        const mahkota = idx === 0 ? '👑 Siswa Terbaik #1' : `#${idx + 1} Terbaik`;

function getRankingBestStudent() {
  const ranking = [];
  const siswaList = DB.siswa || [];
  const kehadiranList = DB.kehadiran || [];

  // 1. OPTIMASI 1: Hitung hari aktif SEKALI saja di luar loop
  const hariAktif = getTotalHariAktif();

  // 2. OPTIMASI 2: Grouping data kehadiran berdasarkan siswaId (Hash Map)
  // Ini mengubah pencarian dari O(N * M) menjadi O(M) yang jauh lebih cepat
  const absensiMap = {};
  kehadiranList.forEach(k => {
    if (!k.siswaId) return;
    const id = String(k.siswaId);
    
    if (!absensiMap[id]) {
      absensiMap[id] = { sakit: 0, izin: 0, alpa: 0 };
    }

    const st = String(k.status || '').toLowerCase().trim();
    if (['alpa', 'a'].includes(st)) absensiMap[id].alpa++;
    else if (['izin', 'i'].includes(st)) absensiMap[id].izin++;
    else if (['sakit', 's'].includes(st)) absensiMap[id].sakit++;
  });

  // 3. LOOPING SISWA (Sekarang proses di dalamnya O(1) / instan)
  siswaList.forEach(siswa => {
    const hasil = hitungPoinSiswa(siswa.id);
    const totalKredit = hasil.totalKredit || 0;
    const totalPelanggaran = hasil.totalPelanggaran || 0;

    // Ambil data absensi yang sudah dikelompokkan
    const absen = absensiMap[String(siswa.id)] || { sakit: 0, izin: 0, alpa: 0 };
    const totalSakit = absen.sakit;
    const totalIzin = absen.izin;
    const totalAlpa = absen.alpa;

    // Hitung Poin Ketidakhadiran
    const poinKetidakhadiran = (totalAlpa * 10) + (totalIzin * 2) + (totalSakit * 1);

    // FORMULA UTAMA
    const sisaPoin = totalKredit - totalPelanggaran - poinKetidakhadiran;

    // Hitung Kehadiran Riil & Persentase Kehadiran
    const tidakHadir = totalSakit + totalIzin + totalAlpa;
    const hadir = Math.max(0, hariAktif - tidakHadir);
    const persenHadir = hariAktif > 0 ? ((hadir / hariAktif) * 100) : 100;

    ranking.push({
      siswa,
      totalKredit,
      totalPelanggaran,
      totalSakit,
      totalIzin,
      totalAlpa,
      poinKetidakhadiran,
      sisaPoin,
      persenHadir
    });
  });

  // Pemeringkatan
  ranking.sort((a, b) => {
    if (b.sisaPoin !== a.sisaPoin) return b.sisaPoin - a.sisaPoin;
    if (b.persenHadir !== a.persenHadir) return b.persenHadir - a.persenHadir;
    return (a.siswa.nama || '').localeCompare(b.siswa.nama || '');
  });

  return ranking;
}

function idrRenderChartKelas() {
  const ctx = document.getElementById('chartRankingKelas');
  if(!ctx) return;

  // 1. Ambil daftar semua kelas secara dinamis dari database sekolah
  let listKelas = [];
  if (DB.kelas && DB.kelas.length > 0) {
    listKelas = DB.kelas.map(k => String(k).trim());
  } 
  
  // Gabungkan dengan kelas yang ada di data siswa untuk memastikan X ATPH pasti masuk
  if (DB.siswa && DB.siswa.length > 0) {
    const kelasDariSiswa = DB.siswa.map(s => String(s.kelas).trim());
    listKelas = [...new Set([...listKelas, ...kelasDariSiswa])];
  }

  // Jika masih kosong total, gunakan fallback
  if (listKelas.length === 0) {
    listKelas = ['X TKJ 1', 'X TKJ 2', 'XI RPL 1', 'XII MM 1', 'X ATPH'];
  }

  // Urutkan kelas agar rapi (X, XI, XII)
  listKelas.sort();

  // 2. Hitung persentase kehadiran masing-masing kelas secara presisi
  const dataPersen = listKelas.map(k => {
    // Cari semua siswa yang terdaftar di kelas ini
    const siswaDiKelas = (DB.siswa || []).filter(s => 
      String(s.kelas).trim().toLowerCase() === k.toLowerCase()
    );

    // Jika kelas tidak memiliki siswa sama sekali, set chart ke 100% (kosong bersih)
    if (siswaDiKelas.length === 0) return 100;

    // Kumpulkan semua ID siswa di kelas ini
    const daftarIdSiswa = siswaDiKelas.map(s => String(s.id));

    // AMBIL SEMUA LOG ABSENSI BERDASARKAN ID SISWA YANG ADA DI KELAS INI (JAUH LEBIH AMAN DAN AKURAT)
    const logAbsenKelas = (DB.kehadiran || []).filter(h => 
      daftarIdSiswa.includes(String(h.siswaId))
    );
    
    // Jika siswa di kelas ini benar-benar belum pernah diabsen sama sekali oleh sekretaris
    if (logAbsenKelas.length === 0) return 100; 
    
    // Hitung baris yang berstatus HADIR (atau otomatis terisi default 'hadir' di sistem baru Anda)
    const totalHadir = logAbsenKelas.filter(h => {
      const st = String(h.status || '').toUpperCase().trim();
      // Hanya anggap hadir jika statusnya kosong (belum diabsen/default) atau eksplisit berisi HADIR/H
      return st === '' || ['HADIR', 'H', 'MASUK', 'M'].includes(st);
    }).length;

    // Hitung persentase secara aman (pembulatan terdekat) berbanding total log absensi yang masuk
    return Math.min(100, Math.round((totalHadir / logAbsenKelas.length) * 100));
  });

  // 3. Render ulang Chart Batang Kehadiran (Chart.js)
  if (window.charts && window.charts['chartRankingKelas']) {
    window.charts['chartRankingKelas'].destroy();
  }
  if (!window.charts) window.charts = {};

  window.charts['chartRankingKelas'] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: listKelas,
      datasets: [{
        label: 'Persentase Kehadiran (%)',
        data: dataPersen,
        backgroundColor: '#3b82f6',
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { 
        y: { 
          min: 0, 
          max: 100,
          ticks: { callback: function(value) { return value + '%'; } }
        } 
      },
      plugins: { legend: { display: false } }
    }
  });

  // 4. Hitung akumulasi poin kasus pelanggaran per kelas untuk papan peringkat
  const rankKelas = listKelas.map(k => {
    const siswaDiKelas = (DB.siswa || [])
      .filter(s => String(s.kelas).trim().toLowerCase() === k.toLowerCase())
      .map(s => s.id);
    
    const totalPoin = (DB.pelanggaran || []).filter(p => siswaDiKelas.includes(p.siswaId)).reduce((acc, curr) => {
      const idAturan = curr.jenisId || curr.tatatertibId;
      const aturan = (DB.tatatertib || []).find(t => String(t.id).trim() === String(idAturan).trim() || String(t.kode).trim() === String(idAturan).trim());
      return acc + (aturan ? (Number(aturan.poin) || 0) : 0);
    }, 0);
    
    return { namaKelas: k, poin: totalPoin };
  }).sort((a,b) => a.poin - b.poin);

  // 5. Render list ke elemen HTML
  const containerList = document.getElementById('listKelasDisiplin');
  if(containerList) {
    if (rankKelas.length > 0) {
      containerList.innerHTML = rankKelas.map((rk, idx) => {
        let lencana = `<span class="text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300">${idx+1}</span>`;
        if (idx === 0) lencana = '<span class="text-lg">🥇</span>';
        if (idx === 1) lencana = '<span class="text-lg">🥈</span>';
        if (idx === 2) lencana = '<span class="text-lg">🥉</span>';

        return `
          <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700/40 rounded-xl border border-gray-100/50 dark:border-gray-600/30">
            <div class="flex items-center gap-3">
              ${lencana}
              <span class="font-semibold text-sm text-gray-800 dark:text-gray-200">${rk.namaKelas}</span>
            </div>
            <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${rk.poin > 30 ? 'bg-red-50 text-red-600 dark:bg-red-900/20' : 'bg-emerald-50 text-emerald-600 dark:bg-emerald-900/20'}">
              ${rk.poin} Poin Kasus
            </span>
          </div>
        `;
      }).join('');
    } else {
      containerList.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">Belum ada kelas terdaftar</p>`;
    }
  }
}

function idrRenderChartPelanggaran() {
  const ctx = document.getElementById('chartPiePelanggaran');
  if(!ctx) return;

  // 1. Hitung top pelanggaran berdasarkan aturan kesiswaan sekolah
  const hitungAturan = {};
  if (DB.pelanggaran && Array.isArray(DB.pelanggaran)) {
    DB.pelanggaran.forEach(p => {
      // PERBAIKAN: Ambil jenisId terlebih dahulu, jika kosong baru cari tatatertibId
      const idAturanAktif = p.jenisId || p.tatatertibId || 'T00';
      hitungAturan[idAturanAktif] = (hitungAturan[idAturanAktif] || 0) + 1;
    });
  }

  // 2. Petakan ID hasil hitung ke data master DB.tatatertib
  const aturanTerurut = Object.keys(hitungAturan).map(id => {
    // Pencocokan fleksibel berdasarkan id angka maupun kode string kriteria kesiswaan
    const aturanObj = (DB.tatatertib || []).find(t => 
      String(t.id).trim() === String(id).trim() || 
      String(t.kode).trim() === String(id).trim()
    );
    
    return {
      deskripsi: aturanObj ? aturanObj.deskripsi : 'Pelanggaran Lainnya / Kasus Khusus',
      kode: aturanObj ? aturanObj.kode : 'Umum',
      jumlah: hitungAturan[id]
    };
  }).sort((a,b) => b.jumlah - a.jumlah); // Urutkan dari kasus terbanyak

  // 3. Render tabel top 5 aturan ke dalam HTML dashboard
  const tableBody = document.getElementById('tableTopAturan');
  if(tableBody) {
    if (aturanTerurut.length > 0) {
      tableBody.innerHTML = aturanTerurut.slice(0, 5).map(at => `
        <tr class="border-b dark:border-gray-700 text-xs">
          <td class="p-3 font-medium text-gray-700 dark:text-gray-300">
            <span class="font-mono text-primary-500 font-bold mr-1">[${at.kode}]</span> ${at.deskripsi}
          </td>
          <td class="p-3 text-center font-bold text-gray-600 dark:text-gray-200">${at.jumlah} Kali</td>
        </tr>
      `).join('');
    } else {
      tableBody.innerHTML = `<tr><td colspan="2" class="p-4 text-center text-xs text-gray-400">Belum ada data kasus pelanggaran tercatat</td></tr>`;
    }
  }

  // 4. Siapkan data visual untuk diagram lingkaran Chart.js
  const labelsPie = aturanTerurut.slice(0, 4).map(a => a.deskripsi);
  const dataPie = aturanTerurut.slice(0, 4).map(a => a.jumlah);
  
  if(aturanTerurut.length > 4) {
    labelsPie.push('Lain-lain');
    const sisaKasus = aturanTerurut.slice(4).reduce((acc, curr) => acc + curr.jumlah, 0);
    dataPie.push(sisaKasus);
  }

  // Bersihkan chart lama jika sudah ada instansinya agar tidak tumpang tindih
  if (charts['chartPiePelanggaran']) {
    charts['chartPiePelanggaran'].destroy();
  }

  charts['chartPiePelanggaran'] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labelsPie.length > 0 ? labelsPie : ['Belum Ada Kasus'],
      datasets: [{
        data: dataPie.length > 0 ? dataPie : [0],
        backgroundColor: ['#ef4444', '#f97316', '#eab308', '#3b82f6', '#94a3b8']
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { 
        legend: { 
          position: 'bottom', 
          labels: { boxWidth: 12, font: { size: 10 } } 
        } 
      }
    }
  });
}

    pesanKonfirmasi = "⚠️ PERINGATAN BESAR!\nApakah Anda yakin ingin mengganti PERIODE PEMBELAJARAN BARU?\nTindakan ini akan MENGHAPUS TOTAL seluruh data absensi dan pelanggaran di database pusat.";
  }

  if (!confirm(pesanKonfirmasi)) return;
  if (!confirm("Pastikan Anda telah mengunduh berkas JSON sebagai cadangan resmi sekolah sebelum melanjutkan reset data. Lanjutkan?")) return;

  try {
    // 1. Deteksi objek database Firebase secara akurat
    let targetDb = null;
    if (typeof database !== 'undefined') {
      targetDb = database;
    } else if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
      targetDb = window.firebase.apps[0].database();
    }

    if (tipe === 'semester') {
      // Kosongkan memori variabel lokal di browser
      DB.kehadiran = [];
      if (DB.absensi) DB.absensi = [];
      
      if (DB.siswa && Array.isArray(DB.siswa)) {
        DB.siswa.forEach(s => {
          s.alpa = 0; s.sakit = 0; s.izin = 0; s.totalAbsen = 0; s.poinAbsen = 0;
        });
      }

      // 🔥 TEMBAK LANGSUNG KE FOLDER LUAR FIREBASE (Bukan kesiswaan_cloud)
      if (targetDb) {
        // Menghapus folder 'kehadiran' yang berdiri mandiri di luar
        targetDb.ref('kehadiran').remove()
          .then(() => console.log("Folder 'kehadiran' di luar berhasil dihapus total."))
          .catch(e => console.error("Gagal menghapus folder luar:", e));
          
        // Bersihkan juga backup poin kesiswaan jika tersimpan di luar/dalam
        targetDb.ref('siswaPoinBackup').remove().catch(() => {});
        targetDb.ref('kesiswaan_cloud/siswaPoinBackup').remove().catch(() => {});
      }
      
      addAuditLog('Reset Kehadiran Semester Baru');
      if (typeof showToast === 'function') showToast('Folder Kehadiran di Firebase luar berhasil dibersihkan!', 'success');

    } else if (tipe === 'periode-baru') {
      // Skenario Reset Total (Tahun Ajaran Baru)
      DB.kehadiran = [];
      if (DB.absensi) DB.absensi = [];
      DB.pelanggaran = [];

      if (DB.siswa && Array.isArray(DB.siswa)) {
        DB.siswa.forEach(s => {
          s.poin = 0; s.poinAbsen = 0; s.poinPelanggaranDasar = 0; s.poinPenebusan = 0;
          s.totalPelanggaran = 0; s.totalAbsen = 0; s.alpa = 0; s.sakit = 0; s.izin = 0;
        });
      }

      // 🔥 HAPUS KEDUA FOLDER: Yang di luar maupun yang kesiswaan_cloud
      if (targetDb) {
        targetDb.ref('kehadiran').remove().catch(() => {});
        targetDb.ref('kesiswaan_cloud/pelanggaran').remove().catch(() => {});
        targetDb.ref('kesiswaan_cloud/siswaPoinBackup').remove().catch(() => {});
        targetDb.ref('siswaPoinBackup').remove().catch(() => {});
      }

      addAuditLog('Reset Total Ganti Periode Pembelajaran');
      if (typeof showToast === 'function') showToast('Seluruh database pusat berhasil di-reset total!', 'success');
    }

    // 2. Sinkronisasikan sisa struktur data kesiswaan lokal ke Firebase
    if (typeof simpanDataKeStorage === 'function') {
      simpanDataKeStorage();
    }

    // Paksa browser menghancurkan sisa cache dan melakukan reload bersih dari server setelah 2.5 detik
    setTimeout(() => {
      window.location.href = window.location.origin + window.location.pathname + '?refresh=' + Date.now();
    }, 2500);

  } catch (error) {
    alert("Terjadi kendala teknis saat berkomunikasi dengan Firebase: " + error.message);
  }
}

// 🔥 FUNGSI UTAMA INTEGRASI WHATSAPP GATEWAY (FONNTE)
function kirimWhatsAppOrangTua(nomorWa, pesan) {
  const TOKEN_FONNTE = "yMnQDwYrMRsNBgW6as1x"; 

  if (!nomorWa) {
    console.log("Gagal kirim WA: Nomor HP tidak ditemukan.");
    return;
  }

  // Bersihkan format nomor agar hanya angka dan diawali dengan 62
  let nomorBersih = String(nomorWa).replace(/[^0-9]/g, '');
  if (nomorBersih.startsWith('0')) {
    nomorBersih = '62' + nomorBersih.slice(1);
  }

  // Lakukan request ke server Fonnte tanpa memicu toast per nomor
  fetch('https://api.fonnte.com/send', {
    method: 'POST',
    headers: {
      'Authorization': TOKEN_FONNTE,
      'Content-Type': 'application/x-www-form-urlencoded'
    },
    body: new URLSearchParams({
      'target': nomorBersih,
      'message': pesan,
      'countryCode': '62'
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.status) {
      console.log(`WhatsApp berhasil dikirim ke ${nomorBersih}`);
    } else {
      console.error('Fonnte Error:', data.reason);
    }
  })
  .catch(error => {
    console.error('Gagal mengirim WhatsApp:', error);
  });
}

// 🔔 FUNGSI KIRIM NOTIFIKASI WA MANUAL UNTUK WALI KELAS
// ========================================================
async function kirimNotifBimbinganKeWalasManual() {
  const hariIni = new Date().toISOString().split('T')[0];

  // 1. Dapatkan daftar siswa yang butuh penanganan (Poin >= 15 & Belum Ditangani)
  const listBimbingan = dapatkanDataBimbinganSemua();
  const siswaButuhPenanganan = listBimbingan.filter(d => !d.sudahDitangani && d.totalPoin >= 15);

  if (siswaButuhPenanganan.length === 0) {
    if (typeof showToast === 'function') showToast('Tidak ada siswa yang memerlukan bimbingan saat ini.', 'info');
    return;
  }

  // 2. Kelompokkan siswa berdasarkan Kelas
  const siswaPerKelas = {};
  siswaButuhPenanganan.forEach(d => {
    if (!siswaPerKelas[d.kelas]) siswaPerKelas[d.kelas] = [];
    siswaPerKelas[d.kelas].push(d);
  });

  const daftarKelas = Object.keys(siswaPerKelas);
  let totalWalasTerkirim = 0;

  if (typeof showToast === 'function') {
    showToast(`Memulai pengiriman pesan ke ${daftarKelas.length} Wali Kelas...`, 'info');
  }

  const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

  // 3. Looping Pengiriman per Kelas
  for (let i = 0; i < daftarKelas.length; i++) {
    const namaKelas = daftarKelas[i];
    const daftarSiswa = siswaPerKelas[namaKelas];

    const walas = (DB.users || []).find(u => 
      u.role === 'walas' && 
      String(u.kelasBinaan || '').toLowerCase().trim() === String(namaKelas).toLowerCase().trim()
    );

    if (walas && walas.noWa) {
      const daftarTeksSiswa = daftarSiswa.map(s => {
        let emojiStatus = '🟡';
        if (s.totalPoin >= 50) emojiStatus = '🔴';
        else if (s.totalPoin >= 25) emojiStatus = '🟠';

        return `${emojiStatus} ${s.nama} - ${s.totalPoin} Poin`;
      }).join('\n');

      const teksPesan = 
        `🔔 Bimbingan Kesiswaan Hari Ini\n\n` +
        `Yth. Wali Kelas *${namaKelas}*,\n` +
        `terdapat *${daftarSiswa.length} siswa* yang memerlukan tindak lanjut hari ini.\n\n` +
        `${daftarTeksSiswa}\n\n` +
        `Silahkan buka sistem untuk melihat detail dan melakukan konfirmasi bimbingan\n\n` +
        `https://kesiswaan-smkn1mpg.vercel.app`;

      kirimWhatsAppOrangTua(walas.noWa, teksPesan);
      totalWalasTerkirim++;

      daftarSiswa.forEach(s => {
        const siswaObj = (DB.siswa || []).find(so => String(so.id) === String(s.idSiswa));
        if (siswaObj) siswaObj.lastNotifWalasDate = hariIni;
      });

      if (i < daftarKelas.length - 1) {
        await delay(5000); 
      }
    }
  }

  // Simpan data di latar belakang tanpa memicu toast sync/kehadiran berlebih
  if (typeof simpanKehadiranDanSync === 'function') {
    simpanKehadiranDanSync();
  }

  // Single Toast Notifikasi Ringkas di Akhir
  if (typeof showToast === 'function') {
    showToast(`Berhasil! Notifikasi WA terkirim ke ${totalWalasTerkirim} Wali Kelas.`, 'success');
  }
}

// ========================================================
// 🔄 HELPER PERBAIKAN: HITUNG REKAP POIN PRESISI
// Total Poin = (Poin Pelanggaran + Poin Ketidakhadiran) - Total Remisi / Pemulihan
// ========================================================
function dapatkanDataBimbinganSemua() {
  return (DB.siswa || []).map(s => {
    let totalPelanggaran = 0;
    let totalAbsen = 0;
    let totalRemisiPoin = 0;

    // 1. HITUNG POIN PELANGGARAN
    if (DB.pelanggaran) {
      DB.pelanggaran.forEach(p => {
        if (String(p.siswaId) === String(s.id) || String(p.idSiswa) === String(s.id)) {
          const tt = DB.tatatertib && DB.tatatertib.length > 0 
            ? DB.tatatertib.find(x => x.id == p.jenisId || x.kode == p.jenisId) 
            : null;
          totalPelanggaran += tt ? parseInt(tt.poin) : (parseInt(p.poin) || 0);
        }
      });
    }

    // 2. HITUNG POIN KETIDAKHADIRAN (ALPA: 3, IZIN: 1, SAKIT: 0.5)
    if (DB.kehadiran) {
      const logSiswa = DB.kehadiran.filter(k => 
        String(k.siswaId || '') === String(s.id) || 
        String(k.idSiswa || '') === String(s.id) ||
        (s.nisn && String(k.nisn || '') === String(s.nisn))
      );
      
      let alpa = 0, izin = 0, sakit = 0;
      logSiswa.forEach(k => {
        const st = String(k.status || "").toUpperCase().trim();
        if (st === 'A' || st === 'ALFA' || st === 'ALPA') alpa++;
        else if (st === 'I' || st === 'IZIN') izin++;
        else if (st === 'S' || st === 'SAKIT') sakit++;
      });

      totalAbsen = (alpa * 3) + (izin * 1) + (sakit * 0.5);
    }

    // 3. HITUNG TOTAL REMISI / PENEBUSAN POIN (PEMULIHAN)
    // Memeriksa DB.penebusan_poin maupun DB.remisi
    if (DB.penebusan_poin) {
      DB.penebusan_poin.forEach(p => {
        if (String(p.siswaId) === String(s.id) || String(p.idSiswa) === String(s.id)) {
          totalRemisiPoin += (Number(p.poinPemulihan || p.poin || p.jumlahPoin) || 0);
        }
      });
    }

    if (DB.remisi) {
      DB.remisi.forEach(r => {
        if (String(r.siswaId) === String(s.id) || String(r.idSiswa) === String(s.id)) {
          totalRemisiPoin += (Number(r.poin || r.poinPemulihan) || 0);
        }
      });
    }

    // 4. REKAP POIN AKHIR (Murni Pelanggaran + Absen - Remisi)
    const kotorPoin = totalPelanggaran + totalAbsen;
    let poinAktifMutlak = kotorPoin - totalRemisiPoin;
    if (poinAktifMutlak < 0) poinAktifMutlak = 0;

    // 5. PENENTUAN STATUS BIMBINGAN / PENANGANAN
    const statusInfo = typeof dapatkanStatusBimbingan === 'function' ? dapatkanStatusBimbingan(poinAktifMutlak) : null;
    const riwayatSelesai = (DB.riwayatTindakan || []).filter(r => 
      String(r.siswaId) === String(s.id) && r.levelTeks === (statusInfo ? statusInfo.teks : '')
    );

    return {
      idSiswa: s.id,
      nama: s.nama,
      kelas: s.kelas,
      poinPelanggaran: totalPelanggaran,
      poinAbsen: totalAbsen,
      poinRemisi: totalRemisiPoin,
      totalPoin: poinAktifMutlak, // Poin bersih setelah remisi
      sudahDitangani: riwayatSelesai.length > 0
    };
  });
}

// Fungsi simpan identitas siswa versi tampilan lama yang disinkronkan ke Firebase
function simpanIdentitasSiswa() {
  const siswaId = document.getElementById('mdlSiswaId').value;
  if (!siswaId) {
    showToast('ID Siswa tidak valid', 'error');
    return;
  }

  const tempatLahir = document.getElementById('mdlTempatLahir').value.trim();
  const tanggalLahir = document.getElementById('mdlTanggalLahir').value;
  const alamat = document.getElementById('mdlAlamat').value.trim();
  const foto = document.getElementById("mdlBase64Foto").value;

  // PASTIKAN tetap berupa Array
  if (!DB.kelengkapanData || !Array.isArray(DB.kelengkapanData)) {
    DB.kelengkapanData = [];
  }
  
  const payloadData = {
    siswaId: siswaId,
    tempatLahir: tempatLahir,
    tanggalLahir: tanggalLahir,
    alamat: alamat,
    foto: foto,
    updatedAt: new Date().toISOString()
  };

  // Cari index di array lokal
  const indexData = DB.kelengkapanData.findIndex(d => String(d.siswaId) === String(siswaId));
  
  if (indexData > -1) {
    DB.kelengkapanData[indexData] = payloadData;
  } else {
    DB.kelengkapanData.push(payloadData);
  }

  showToast('Sedang menyinkronkan data...', 'info');

  // SIMPAN KE FIREBASE SEBAGAI ARRAY/LIST (Gunakan struktur array utuh)
  // Ini akan memperbarui seluruh node kelengkapanData sebagai array di Firebase
  const dbRef = firebase.database().ref('kesiswaan_cloud/kelengkapanData'); 
  
  dbRef.set(DB.kelengkapanData)
    .then(() => {
      showToast('Data Tersimpan ke Firebase!', 'success');
      tutupModalIdentitas();
      renderInputDataPelajar(); 
      if (typeof addAuditLog === 'function') {
        addAuditLog('Update Identitas Siswa ID: ' + siswaId);
      }
    })
    .catch((err) => {
      console.error(err);
      showToast('Gagal menyimpan ke Firebase', 'error');
    });
}

// =========================================================================
function unduhTemplateExcelPelajar() {
  const kelasDipilih = document.getElementById('excelFilterKelas').value;
  let listSiswa = DB.siswa || [];

  if (kelasDipilih) {
    listSiswa = listSiswa.filter(s => String(s.kelas) === String(kelasDipilih));
  }

  if (listSiswa.length === 0) {
    alert("Tidak ada data siswa untuk kelas yang dipilih!");
    return;
  }

  // Format baris kolom data pembentuk Excel
  const dataExcel = listSiswa.map(s => {
    // Ubah format tanggal dari YYYY-MM-DD (Database) menjadi DD-MM-YYYY (Excel)
    let tglLahirExcel = "";
    if (s.tanggalLahir) {
      const parts = s.tanggalLahir.split("-");
      if (parts.length === 3) {
        tglLahirExcel = `${parts[2]}-${parts[1]}-${parts[0]}`; // Menjadi DD-MM-YYYY
      } else {
        tglLahirExcel = s.tanggalLahir;
      }
    }

    return {
      "ID_SISWA": s.id, // Kunci utama penyelarasan data (JANGAN DIUBAH)
      "NAMA SISWA": s.nama,
      "KELAS": s.kelas || '',
      "NISN": s.nisn || '',
      "TEMPAT LAHIR": s.tempatLahir || '',
      "TANGGAL LAHIR (Contoh: 25-05-2008)": tglLahirExcel,
      "ALAMAT TINGGAL": s.alamat || '',
      "PAS FOTO 3x4 (Isi dengan URL/Link)": s.pasFoto || ''
    };
  });

  // Proses Build Workbook menggunakan SheetJS
  const worksheet = XLSX.utils.json_to_sheet(dataExcel);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Template_Pelajar");

  // Atur lebar kolom agar rapi saat dibuka di Excel
  worksheet["!cols"] = [
    { wch: 12 }, { wch: 30 }, { wch: 10 }, { wch: 15 }, { wch: 18 }, { wch: 35 }, { wch: 35 }, { wch: 40 }
  ];

  // Eksekusi Download File ke komputer user
  const namaFile = kelasDipilih ? `Template_Kartu_Pelajar_Kelas_${kelasDipilih}.xlsx` : `Template_Kartu_Pelajar_Semua_Kelas.xlsx`;
  XLSX.writeFile(workbook, namaFile);
}

// =========================================================================
// LOGIKA CODES: ENGINE PARSING / IMPORT MASSAL EXCEL KEMBALI KE DB
// =========================================================================
function bacaFileExcelPelajar(input) {
  if (!input.files || !input.files[0]) return;

  const file = input.files[0];
  const reader = new FileReader();

  reader.onload = async function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      // Agar tanggal tidak terbaca sebagai nomor seri Excel (seperti 44000), kita paksa baca sebagai text string murni (raw: false)
      const workbook = XLSX.read(data, { type: 'array', cellDates: true, dateNF: 'dd-mm-yyyy' });
      
      const namaSheet = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[namaSheet];
      
      const rowsJson = XLSX.utils.sheet_to_json(worksheet, { raw: false });

      if (rowsJson.length === 0) {
        alert("File Excel kosong atau format tidak sesuai!");
        return;
      }

      let totalTerupdate = 0;

      rowsJson.forEach(row => {
        const idSiswaExcel = row["ID_SISWA"];
        if (!idSiswaExcel) return;

        const siswa = DB.siswa.find(s => String(s.id) === String(idSiswaExcel));
        if (siswa) {
          const tLahir = row["TEMPAT LAHIR"] !== undefined ? String(row["TEMPAT LAHIR"]).trim() : siswa.tempatLahir;
          const almt = row["ALAMAT TINGGAL"] !== undefined ? String(row["ALAMAT TINGGAL"]).trim() : siswa.alamat;
          
          // Ambil Foto jika diisi
          const urlFoto = row["PAS FOTO 3x4 (Isi dengan URL/Link)"];
          if (urlFoto !== undefined && urlFoto.trim() !== '') {
            siswa.pasFoto = String(urlFoto).trim();
          }

          // Proses kembalikan Tanggal dari Excel (DD-MM-YYYY) ke Database Web (YYYY-MM-DD)
          let inputTglExcel = row["TANGGAL LAHIR (Contoh: 25-05-2008)"];
          let tglLahirDB = siswa.tanggalLahir;
          
          if (inputTglExcel !== undefined && inputTglExcel !== '') {
            let strTgl = String(inputTglExcel).trim();
            // Jika ada format garis miring dari Excel (DD/MM/YYYY), ubah ke strip
            strTgl = strTgl.replace(/\//g, '-'); 
            
            if (strTgl.includes("-")) {
              const parts = strTgl.split("-");
              // Jika formatnya benar DD-MM-YYYY (bagian pertama adalah hari / max 2 digit)
              if (parts.length === 3 && parts[0].length <= 2) {
                // Susun ulang menjadi YYYY-MM-DD
                tglLahirDB = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
              } else {
                tglLahirDB = strTgl; // Fallback jika formatnya ternyata sudah YYYY-MM-DD
              }
            } else {
              tglLahirDB = strTgl;
            }
          }

          // Simpan ke object siswa
          siswa.tempatLahir = tLahir;
          siswa.tanggalLahir = tglLahirDB;
          siswa.alamat = almt;
          
          totalTerupdate++;
        }
      });

      if (totalTerupdate > 0) {
        if (typeof simpanDataKeStorage === "function") {
          await simpanDataKeStorage("siswa");
        } else if (typeof simpanKeFirebase === "function") {
          await simpanKeFirebase();
        }

        alert(`Berhasil mengimpor massal! ${totalTerupdate} data biodata siswa terupdate.`);
        renderInputDataPelajar(); // Refresh tabel view
      } else {
        alert("Tidak ada kecocokan ID Siswa. Periksa kembali file template Anda.");
      }

    } catch (err) {
      console.error(err);
      alert("Gagal memproses file Excel. Pastikan Anda menggunakan file Template yang diunduh.");
    }
    
    input.value = ''; // Reset input file picker
  };

  reader.readAsArrayBuffer(file);
}

// FUNGSI EKSPOR KARTU PELAJAR KE CORELDRAW (FIXED & FULL COREL COMPATIBLE)
// =========================================================================

function downloadCorelDrawSVG(filterKelas = "SEMUA") {
  let daftarSiswa = [];
  if (!filterKelas || filterKelas.toUpperCase() === "SEMUA") {
    daftarSiswa = DB.siswa || [];
  } else {
    daftarSiswa = (DB.siswa || []).filter(s => (s.kelas || '').toUpperCase() === filterKelas.toUpperCase());
  }

  if (daftarSiswa.length === 0) {
    alert("Tidak ada data siswa untuk kelas yang dipilih!");
    return;
  }

  const escapeXml = (str) => {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;');
  };

  const namaKepsek = escapeXml(DB.identitas?.kepsek || "Joko Sarwono, S.Pd.");
  const nipKepsek = escapeXml(DB.identitas?.nipKepsek || "196610161991031010");
  const logoProv = escapeXml(DB.identitas?.logoProvinsi || "https://via.placeholder.com/100?text=PROV");
  const logoSekolah = escapeXml(DB.identitas?.logoSekolah || "https://via.placeholder.com/100?text=LOGO");
  const capStempel = escapeXml(DB.identitas?.capSekolah || "");
  const ttdKepsek = escapeXml(DB.identitas?.ttdKepsek || "");

  const toTitleCase = (str) => {
    if (!str || str === '-') return '-';
    return str.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  };

  const formatTanggalLahirIndonesia = (tglStr) => {
    if (!tglStr || tglStr === '-') return '-';
    const parts = tglStr.split('-');
    if (parts.length === 3 && parts[0].length === 4) {
      const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const idxBulan = parseInt(parts[1], 10) - 1;
      if (idxBulan >= 0 && idxBulan < 12) return `${parseInt(parts[2], 10)} ${namaBulan[idxBulan]} ${parts[0]}`;
    }
    return tglStr;
  };

  const KARTU_PER_HALAMAN = 5;
  const totalHalaman = Math.ceil(daftarSiswa.length / KARTU_PER_HALAMAN);

  // LOOPING PER HALAMAN A4 SUPAYA CORELDRAW TIDAK ERROR/CRASH
  for (let pageIdx = 0; pageIdx < totalHalaman; pageIdx++) {

function aksiBukaJendelaCetak(siswaId) {
  // 1. Ambil data siswa tunggal
  const siswa = DB.siswa.find(s => String(s.id) === String(siswaId));
  if (!siswa) {
    alert("Data siswa tidak ditemukan!");
    return;
  }

  const kData = (DB.kelengkapanData || []).find(d => String(d.siswaId) === String(siswa.id));

  // 2. Ambil Konfigurasi dari Data Identitas Global
  const namaKepsek = DB.identitas?.kepsek || "Nama Kepala Sekolah, M.Pd.";
  const nipKepsek = DB.identitas?.nipKepsek || "NIP. 198203112009031002";
  const logoProvinsiBase64 = DB.identitas?.logoProvinsi || "https://via.placeholder.com/100?text=PROV"; 
  const logoSekolahBase64 = DB.identitas?.logoSekolah || "https://via.placeholder.com/100?text=LOGO"; 
  const capStempelBase64 = DB.identitas?.capSekolah || ""; 
  const ttdKepsekBase64 = DB.identitas?.ttdKepsek || ""; 

  // Fungsi pembantu Title Case
  const toTitleCase = (str) => {
    if (!str || str === '-') return '-';
    return str
      .toLowerCase()
      .split(' ')
      .map(word => word.charAt(0).toUpperCase() + word.slice(1))
      .join(' ');
  };

  // Fungsi pembantu format tanggal lahir Indonesia
  const formatTanggalLahirIndonesia = (tglStr) => {
    if (!tglStr || tglStr === '-') return '-';
    const parts = tglStr.split('-');
    if (parts.length === 3 && parts[0].length === 4) {
      const tahun = parts[0];
      const bulan = parts[1];
      const tanggal = parseInt(parts[2], 10);
      const namaBulan = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      const idxBulan = parseInt(bulan, 10) - 1;
      if (idxBulan >= 0 && idxBulan < 12) return `${tanggal} ${namaBulan[idxBulan]} ${tahun}`;
    }
    return tglStr;
  };

  // Format data siswa
  const kls = (siswa.kelas || '').toUpperCase();
  const tahunSekarang = new Date().getFullYear();
  let tahunLulus = tahunSekarang;
  if (kls.includes('XII'))      tahunLulus += 1;
  else if (kls.includes('XI'))  tahunLulus += 2;
  else if (kls.includes('X'))   tahunLulus += 3;
  else                          tahunLulus += 3;

  const fotoSiswa = kData && kData.foto ? kData.foto : (siswa.pasFoto || siswa.foto || "https://via.placeholder.com/150?text=No+Foto");
  const alamatRaw = kData && kData.alamat ? kData.alamat : (siswa.alamat || '-');
  const alamat = toTitleCase(alamatRaw);

  const tglLahirTerformat = formatTanggalLahirIndonesia(kData && kData.tanggalLahir ? kData.tanggalLahir : siswa.tanggalLahir);
  const tempatLahirRaw = kData && kData.tempatLahir ? kData.tempatLahir : (siswa.tempatLahir || '-');
  const tempatLahir = toTitleCase(tempatLahirRaw);
  const ttl = tempatLahir + ', ' + tglLahirTerformat;

  const jkMentah = (siswa.jk || siswa.jenisKelamin || '').toUpperCase();
  const jkTerformat = jkMentah === 'L' ? 'Laki-laki' : (jkMentah === 'P' ? 'Perempuan' : '-');

  let jurusan = "-";
  if (kls.includes("TKJ"))        jurusan = "Teknik Komputer dan Jaringan";
  else if (kls.includes("AKL")) jurusan = "Akuntansi dan Keuangan Lembaga";
  else if (kls.includes("BDP")) jurusan = "Pemasaran";
  else if (kls.includes("ATPH")) jurusan = "Agribisnis Tanaman Pangan dan Hortikultura";
  else                            jurusan = kls;

  // 3. Buka jendela cetak baru
  const win = window.open('', '_blank');
  
  win.document.write(`

@media print {
    html, body {
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    .btn-print-action {
        display: none !important;
    }

    .bingkai-kartu {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    .kartu-id {
        box-shadow: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    .pembatas-tengah::before {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
}

function aksiBukaJendelaCetakMassal(filterKelas = "SEMUA") {

    return;
  }

  const logoSekolahBase64 = DB.identitas?.logoSekolah || "https://via.placeholder.com/100?text=LOGO"; 
  const capStempelBase64 = DB.identitas?.capSekolah || ""; 
  const ttdKepsekBase64 = DB.identitas?.ttdKepsek || ""; 

  // Helper: Title Case
  const toTitleCase = (str) => {
    if (!str || str === '-') return '-';
    return str
      .toLowerCase()
      .split(' ')
      .map(word => word.charAt(0).toUpperCase() + word.slice(1))
      .join(' ');
  };

  // Helper: Format Tanggal Lahir Indonesia
  const formatTanggalLahirIndonesia = (tglStr) => {
    if (!tglStr || tglStr === '-') return '-';
    const parts = tglStr.split('-');
    if (parts.length === 3 && parts[0].length === 4) {
      const tahun = parts[0];
      const bulan = parts[1];
      const tanggal = parseInt(parts[2], 10);
      const namaBulan = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      const idxBulan = parseInt(bulan, 10) - 1;
      if (idxBulan >= 0 && idxBulan < 12) return `${tanggal} ${namaBulan[idxBulan]} ${tahun}`;
    }
    return tglStr;
  };

  // 3. Susun HTML untuk setiap halaman (5 kartu per halaman A4)
  const KARTU_PER_HALAMAN = 5;
  const halamanList = [];

  for (let i = 0; i < daftarSiswa.length; i += KARTU_PER_HALAMAN) {

      const kls = (siswa.kelas || '').toUpperCase();

      else if (kls.includes('XI'))  tahunLulus += 2;
      else if (kls.includes('X'))   tahunLulus += 3;
      else                          tahunLulus += 3;

      const kData = (DB.kelengkapanData || []).find(d => String(d.siswaId) === String(siswa.id));

      const fotoSiswa = kData && kData.foto ? kData.foto : (siswa.pasFoto || siswa.foto || "https://via.placeholder.com/150?text=No+Foto");
      const alamatRaw = kData && kData.alamat ? kData.alamat : (siswa.alamat || '-');
      const alamat = toTitleCase(alamatRaw);

      const tglLahirTerformat = formatTanggalLahirIndonesia(kData && kData.tanggalLahir ? kData.tanggalLahir : siswa.tanggalLahir);
      const tempatLahirRaw = kData && kData.tempatLahir ? kData.tempatLahir : (siswa.tempatLahir || '-');

function getTanggalHariIni() {
    const sekarang = new Date();

    const bulan = String(sekarang.getMonth() + 1).padStart(2, "0");
    const hari = String(sekarang.getDate()).padStart(2, "0");

    return `${tahun}-${bulan}-${hari}`;
}

async function downloadFotoSiswaZip() {
  if (typeof JSZip === 'undefined' || typeof saveAs === 'undefined') {
    alert("Pustaka JSZip atau FileSaver belum dimuat!");
    return;
  }

  const zip = new JSZip();
  const folderFoto = zip.folder("Foto_Buku_Induk");
  const isSekretaris = currentUser && (currentUser.role === 'sekretaris' || currentUser.role === 'sekre');
  const myKelas = currentUser ? (currentUser.kelas || '') : '';
  const kelas = isSekretaris ? myKelas : (document.getElementById('filterKelasInduk')?.value || '');

  let list = [...(DB.siswa || [])];
  if (kelas) {
    list = list.filter(s => String(s.kelas || '').trim().toLowerCase() === kelas.trim().toLowerCase());
  }

  let count = 0;
  const btn = document.getElementById('btnDownloadZip');
  if (btn) btn.innerText = "⏳ Memproses...";

  for (const s of list) {
    const kData = (DB.kelengkapanData || []).find(k => String(k.siswaId) === String(s.id)) || {};
    const foto = kData.foto || s.pasFoto || '';

    if (foto) {
      try {
        let blob;
        if (foto.startsWith('data:image')) {
          // Tangani format Base64
          const arr = foto.split(',');
          const mime = arr[0].match(/:(.*?);/)[1];
          const bstr = atob(arr[1]);
          let n = bstr.length;
          const u8arr = new Uint8Array(n);
          while (n--) u8arr[n] = bstr.charCodeAt(n);
          blob = new Blob([u8arr], { type: mime });
        } else {
          // Tangani format URL
          const response = await fetch(foto);
          blob = await response.blob();
        }

        const cleanNama = (s.nama || 'Siswa').replace(/[^a-zA-Z0-9]/g, '_');
        const ext = blob.type.split('/')[1] || 'jpg';
        folderFoto.file(`${s.nisn || s.id}_${cleanNama}.${ext}`, blob);
        count++;
      } catch (err) {
        console.error(`Gagal mengunduh foto ${s.nama}:`, err);
      }
    }
  }

  if (count === 0) {
    alert("Tidak ada foto siswa yang tersedia untuk diunduh!");
    if (btn) btn.innerHTML = '<i data-lucide="download" class="w-3.5 h-3.5"></i> Download Foto ZIP';
    return;
  }

  zip.generateAsync({ type: "blob" }).then(function (content) {
    saveAs(content, `Foto_Siswa_${kelas || 'Semua'}.zip`);
    if (btn) btn.innerHTML = '<i data-lucide="download" class="w-3.5 h-3.5"></i> Download Foto ZIP';
  });
}

function filterDataIndukSiswa() {
  const search = (document.getElementById('searchInduk')?.value || '').toLowerCase().trim();
  const body = document.getElementById('bodyDataInduk');

  if (!body) return;

  const isSekretaris = currentUser && (currentUser.role === 'sekretaris' || currentUser.role === 'sekre');
  const myKelas = currentUser ? (currentUser.kelas || '') : '';

  // 1. Ambil nilai filter kelas
  const kelas = isSekretaris ? myKelas : (document.getElementById('filterKelasInduk')?.value || '');

  let list = [...(DB.siswa || [])];

  // 2. Filter berdasarkan Kelas
  if (kelas) {
    list = list.filter(s => String(s.kelas || '').trim().toLowerCase() === kelas.trim().toLowerCase());
  }

  // 3. Filter berdasarkan Pencarian
  if (search) {
    list = list.filter(s => 
      String(s.nama || '').toLowerCase().includes(search) || 
      String(s.nisn || '').toLowerCase().includes(search)
    );
  }

  if (list.length === 0) {
    body.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400 italic">Data siswa tidak ditemukan.</td></tr>`;
    return;
  }

  body.innerHTML = list.map((s, idx) => {
    const kData = (DB.kelengkapanData || []).find(k => String(k.siswaId) === String(s.id)) || {};
    const foto = kData.foto || s.pasFoto || '';
    const lengkap = !!(kData.tempatLahir && kData.tanggalLahir && kData.alamat);

    return `
      <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/30 transition">
        <td class="p-3 text-center font-mono text-xs">${idx + 1}</td>
        <td class="p-3">
          ${foto ? 
            `<img src="${foto}" class="w-8 h-10 object-cover rounded border shadow-sm">` : 
            `<div class="w-8 h-10 bg-gray-200 dark:bg-gray-700 rounded flex items-center justify-center text-[10px] text-gray-400">No Img</div>`
          }
        </td>
        <td class="p-3 font-medium text-gray-900 dark:text-white">${s.nama || '-'}</td>
        <td class="p-3 font-mono text-xs">${s.nisn || '-'}</td>
        <td class="p-3">${s.kelas || '-'}</td>
        <td class="p-3 text-center">
          ${lengkap ? 
            `<span class="px-2.5 py-1 text-[11px] font-semibold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400 rounded-full">Lengkap</span>` : 
            `<span class="px-2.5 py-1 text-[11px] font-semibold bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400 rounded-full">Belum Lengkap</span>`
          }
        </td>
        <td class="p-3 text-center">
          <button 
            onclick="previewBukuInduk('${s.id}')" 
            class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 mx-auto transition shadow-sm"
          >
            <i data-lucide="printer" class="w-3.5 h-3.5"></i> Preview / Cetak
          </button>
        </td>
      </tr>
    `;
  }).join('');

  if (typeof lucide !== 'undefined') lucide.createIcons();
}
