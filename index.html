// Mengecek apakah seluruh node sudah selesai dimuat

  FirebaseState.ready =
    Object.values(FirebaseState.loaded).every(v => v === true);

  if (FirebaseState.ready) {
    console.log("✅ Firebase siap digunakan");
  }

  return FirebaseState.ready;
}

// Menandai sebuah node selesai dimuat
function nodeLoaded(node) {

  if (!(node in FirebaseState.loaded)) return;

  FirebaseState.loaded[node] = true;

  cekFirebaseReady();

}

function loadNode(nodeName, callback) {

  getNode(nodeName).on("value", (snapshot) => {

    let data = snapshot.val();

    callback(data);

    nodeLoaded(nodeName);

  }, (err) => {

    console.error("Gagal memuat node:", nodeName, err);

  });

}

function hitungUlangSemuaPoin() {

  if (!Array.isArray(DB.siswa)) return;

  DB.siswa.forEach(s => {

    const logAbsenSiswa = (DB.kehadiran || []).filter(
      k => String(k.siswaId) === String(s.id)
    );

    const skt = logAbsenSiswa.filter(k =>
      ['sakit', 's', 'SAKIT'].includes(String(k.status).trim())
    ).length;

    const izn = logAbsenSiswa.filter(k =>
      ['izin', 'i', 'IZIN'].includes(String(k.status).trim())
    ).length;

    const alp = logAbsenSiswa.filter(k =>
      ['alpa', 'a', 'ALPA'].includes(String(k.status).trim())
    ).length;

    const poinKetidakhadiran =
      (alp * 3) +
      (izn * 1) +
      (skt * 0.5);

    let poinTataTertib = 0;

    (DB.pelanggaran || []).forEach(p => {

      if (
        String(p.siswaId) !== String(s.id) &&
        String(p.idSiswa) !== String(s.id)
      ) return;

      const tt = (DB.tatatertib || []).find(x =>
        String(x.id) === String(p.jenisId) ||
        String(x.kode) === String(p.jenisId) ||
        String(x.id) === String(p.tatatertibId)
      );

      poinTataTertib += tt
        ? (parseInt(tt.poin) || 0)
        : (parseInt(p.poin) || parseInt(p.skor) || 0);

    });

    let poinPenebusan = 0;

    (DB.penebusan_poin || []).forEach(p => {

      if (String(p.siswaId) !== String(s.id)) return;

      poinPenebusan += parseInt(p.poinPemulihan) || 0;

    });

    s.poinAbsen = poinKetidakhadiran;
    s.poinPelanggaranDasar = poinTataTertib;
    s.poinPenebusan = poinPenebusan;

    s.poin = Math.max(
      0,
      poinKetidakhadiran +
      poinTataTertib -
      poinPenebusan
    );

  });

}


// ====================================================
// HELPER SANITASI & PARSER FIREBASE
// ====================================================
function sanitizeFirebaseData(data) {
  if (data === undefined || data === null) return null;
  if (typeof data !== 'object') return data;

  if (Array.isArray(data)) {
    return data.map(sanitizeFirebaseData).filter(item => item !== null);
  }

  const clean = {};
  for (const key of Object.keys(data)) {
    const safeKey = key.replace(/[.$#\[\]\/]/g, '_');
    const value = data[key];
    if (value !== undefined && value !== null) {
      clean[safeKey] = sanitizeFirebaseData(value);
    }
  }
  return clean;
}

function parseFirebaseData(data) {
  if (!data) return [];
  if (Array.isArray(data)) {
    return data.filter(item => item !== null && item !== undefined);
  }
  if (typeof data === 'object') {
    return Object.keys(data).map(key => {
      const val = data[key];
      if (typeof val === 'object' && val !== null) {
        return { id: val.id || key, ...val };
      }
      return val;
    }).filter(Boolean);
  }
  return [];
}

async function simpanDataKeStorage(node) {
  try {
    if (!node) {
      console.log("🔄 [Storage] Memproses simpan SELURUH data DB secara berurutan...");
      if (typeof DB === 'undefined' || !DB) return false;

      const daftarNode = [
        'users', 'siswa', 'kelas', 'tatatertib', 'pelanggaran', 'kehadiran',
        'hariAktif', 'kreditPoin', 'kreditPoinMaster', 'riwayatTindakan',
        'penebusan_poin', 'bimbingan', 'kelengkapanData', 'auditLog',
        'identitas', 'libur', 'jadwalKesiswaan', 'catatanKesiswaan'
      ];

      for (const key of daftarNode) {
        if (DB[key] !== undefined) {
          await simpanDataKeStorage(key); 
        }
      }
      
      console.log("🚀 ✅ SELURUH database berhasil dikirim ke Cloud!");
      return true;
    }

    if (typeof DB === 'undefined' || DB[node] === undefined) {
      console.warn(`⚠️ [Storage Warning] Node '${node}' tidak ditemukan di DB.`);
      return false;
    }

    console.log(`[Storage] Memproses simpan node: '${node}'...`);
    const cleanData = sanitizeFirebaseData(DB[node]);

    try {
      localStorage.setItem(node, JSON.stringify(cleanData));
    } catch (e) {
      console.warn(`[Storage Warning] LocalStorage penuh untuk [${node}].`);
    }

    let targetDb = null;
    if (typeof database !== 'undefined') {
      targetDb = database;
    } else if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
      targetDb = window.firebase.apps[0].database();
    }

    if (targetDb) {
      await targetDb.ref("kesiswaan_cloud/" + node).set(cleanData);
      console.log(`✅ [Firebase Direct] Node '${node}' BERHASIL disimpan ke Cloud.`);
      return true;
    }

    return true;

  } catch (error) {
    console.error(`❌ [Firebase Error] Gagal simpan node '${node}':`, error.message || error);
    return true; 
  }
}

async function importDatabaseDariJSON(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const fileInput = event.target;
  const file = fileInput && fileInput.files ? fileInput.files[0] : null;
  if (!file) return;

  if (!confirm("⚠️ PERINGATAN: Mengimport data baru akan MENIMPA seluruh data aktif saat ini. Lanjutkan?")) {
    fileInput.value = '';
    return;
  }

  window.isImporting = true;

  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const dataTerimport = JSON.parse(e.target.result);
      const source = dataTerimport.data || dataTerimport;

      if (!source.siswa || !source.kehadiran) {
        throw new Error("Struktur file backup tidak valid atau tidak dikenali.");
      }

      if (typeof DB !== 'undefined') {
        Object.assign(DB, source);
      }

      // Tunggu hingga seluruh node benar-benar selesai diunggah ke Firebase
      await simpanDataKeStorage();

      if (typeof addAuditLog === 'function') addAuditLog('Import Database');
      if (typeof showToast === 'function') showToast('Database berhasil dipulihkan!', 'success');

    } catch (error) {
      alert("Gagal memproses file JSON: " + error.message);
      console.error("Import Error Detail:", error);
    } finally {
      window.isImporting = false;
      if (fileInput) fileInput.value = '';

      // Render ulang UI tanpa melakukan reload browser (tanpa window.location.reload)
      if (typeof renderPage === 'function') {
        renderPage(currentPage || 'dashboard');
      }
    }
  };

  reader.readAsText(file);
}

function muatSemuaDataDariDatabase() {
  console.log("Mengaktifkan mode Sinkronisasi Penuh & Proteksi Data Realtime Firebase...");

  let targetDb = null;
  if (typeof database !== 'undefined') {
    targetDb = database;
  } else if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
    targetDb = window.firebase.apps[0].database();
  }

  const daftarAkunDemo = [
    { id: 1, username: 'admin', password: '45dqNLkN', role: 'admin', name: 'Admin Kesiswaan Utama' },
  ];

  if (targetDb) {
    console.log("Membuka jalur sinkronisasi aktivitas data Realtime Firebase...");

    targetDb.ref('kesiswaan_cloud').on('value', (snapshot) => {
      // 🔒 PROTEKSI IMPOR: Abaikan pembaruan otomatis jika Impor JSON berlangsung
      if (window.isImporting) {
        console.log("⏳ [Firebase] Mengabaikan sync cloud karena sedang memproses Impor JSON...");
        return;
      }

      const cloudData = snapshot.val();
      if (cloudData) {
        console.log("Aktivitas data dari Firebase Berhasil Diterima!");

        const safeArray = (data) => {
          if (!data) return [];
          if (Array.isArray(data)) return data.filter(Boolean);
          if (typeof data === 'object') return Object.values(data).filter(Boolean);
          return [];
        };

        // 1. MUAT DATA MASTER & TRANSAKSI
        DB.users = safeArray(cloudData.users);
        DB.siswa = safeArray(cloudData.siswa).filter(s => s && (s.nama || s.name) && s.id);
        DB.kelas = safeArray(cloudData.kelas);
        DB.pelanggaran = safeArray(cloudData.pelanggaran).filter(p => p && (p.siswaId || p.idSiswa));
        DB.tatatertib = safeArray(cloudData.tatatertib);
        DB.kelengkapanData = safeArray(cloudData.kelengkapanData);
        DB.kreditPoin = safeArray(cloudData.kreditPoin);
        DB.kreditPoinMaster = safeArray(cloudData.kreditPoinMaster);
        DB.penebusan_poin = safeArray(cloudData.penebusan_poin);
        DB.riwayatTindakan = safeArray(cloudData.riwayatTindakan);
        DB.auditLog = safeArray(cloudData.auditLog);
        DB.identitas = cloudData.identitas || DB.identitas;
        DB.hariAktif = cloudData.hariAktif || [];
        DB.libur = safeArray(cloudData.libur);
        DB.jadwalKesiswaan = safeArray(cloudData.jadwalKesiswaan);
        DB.catatanKesiswaan = cloudData.catatanKesiswaan || {};

        // 2. LOAD DATA KEHADIRAN (PATCH AMAN: EKSTRAKSI HYBRID UNTUK INDEKS FIREBASE 17608)
        if (cloudData.kehadiran) {
          const rawKehadiran = cloudData.kehadiran;
          const tempKehadiran = [];

          const ekstrak = (node, keyParent = "") => {
            if (!node) return;
            if (Array.isArray(node)) {
              node.forEach(item => ekstrak(item, keyParent));
            } else if (typeof node === 'object') {
              if (node.siswaId || node.idSiswa || node.status) {
                const itemAbsen = { ...node };

                // Pengaman Tanggal: Jika tidak ada atribut tanggal, amankan dari keyParent yang valid
                if (!itemAbsen.tanggal && itemAbsen.tgl) {
                  itemAbsen.tanggal = itemAbsen.tgl;
                } else if (!itemAbsen.tanggal && keyParent.includes('_')) {
                  itemAbsen.tanggal = keyParent.split('_')[0];
                }

                tempKehadiran.push(itemAbsen);
              } else {
                Object.keys(node).forEach(k => ekstrak(node[k], k));
              }
            }
          };

          ekstrak(rawKehadiran);

          // PENGAMAN DEDUPLIKASI: Hanya memperbarui DB.kehadiran jika data hasil ekstraksi tidak kosong
          if (tempKehadiran.length > 0) {
            const mapUnik = new Map();
            tempKehadiran.forEach(item => {
              const sId = String(item.siswaId || item.idSiswa || '').trim();
              const tgl = String(item.tanggal || '').trim();

              if (sId && tgl) {
                mapUnik.set(`${sId}_${tgl}`, item);
              } else if (item.status) {
                mapUnik.set(item.id || Math.random().toString(), item);
              }
            });

            DB.kehadiran = Array.from(mapUnik.values());
          }
        }

        // 3. AKUN DEMO
        if (typeof daftarAkunDemo !== 'undefined' && Array.isArray(daftarAkunDemo)) {
          daftarAkunDemo.forEach(akun => {
            if (!DB.users.some(x => x.username === akun.username)) {
              DB.users.push(akun);
            }
          });
        }

        // 4. KALKULASI MATEMATIKA REALTIME POIN SISWA
        if (DB.siswa.length > 0) {
          DB.siswa.forEach(s => {
            const logAbsenSiswa = DB.kehadiran.filter(k => k && String(k.siswaId || k.idSiswa) === String(s.id));
            const skt = logAbsenSiswa.filter(k => ['sakit', 's', 'SAKIT'].includes(String(k.status).trim())).length;
            const izn = logAbsenSiswa.filter(k => ['izin', 'i', 'IZIN'].includes(String(k.status).trim())).length;
            const alp = logAbsenSiswa.filter(k => ['alpa', 'a', 'ALPA'].includes(String(k.status).trim())).length;
            const poinKetidakhadiran = (alp * 3) + (izn * 1) + (skt * 0.5);

            let poinTataTertib = 0;
            const pelanggaranSiswa = DB.pelanggaran.filter(p => p && (String(p.siswaId) === String(s.id) || String(p.idSiswa) === String(s.id)));
            pelanggaranSiswa.forEach(p => {
              const tt = DB.tatatertib.find(x => x && (
                String(x.id) === String(p.jenisId) || 
                String(x.kode) === String(p.jenisId) || 
                String(x.id) === String(p.tatatertibId)
              ));
              const poinFinal = tt ? (parseInt(tt.poin) || 0) : (parseInt(p.poin) || parseInt(p.skor) || 0);
              poinTataTertib += poinFinal;
            });

            let totalPoinPenebusan = 0;
            const penebusanSiswa = DB.penebusan_poin.filter(p => p && String(p.siswaId) === String(s.id));
            penebusanSiswa.forEach(p => {
              totalPoinPenebusan += (parseInt(p.poinPemulihan) || 0);
            });

            s.poinPelanggaranDasar = poinTataTertib;
            s.poinAbsen = poinKetidakhadiran;
            s.poinPenebusan = totalPoinPenebusan;
            const totalPoinKotor = poinTataTertib + poinKetidakhadiran;
            s.poin = Math.max(0, totalPoinKotor - totalPoinPenebusan);
          });
        }

        // 5. RENDER HALAMAN UTAMA SECARA AMAN
        const halamanInput = [
          "input-pelanggaran",
          "kehadiran",
          "input-kredit-poin",
          "admin-kredit-poin",
          "bimbingan-kesiswaan",
          "input-data-pelajar"
        ];

        const activePage = currentPage || 'dashboard';
        if (typeof renderPage === "function" && !halamanInput.includes(activePage)) {
          renderPage(activePage);
        }

        if (typeof renderJadwalKesiswaan === "function") {
          renderJadwalKesiswaan();
        }
      }
    });
  } else {
    if (!Array.isArray(DB.users)) DB.users = typeof daftarAkunDemo !== 'undefined' ? [...daftarAkunDemo] : [];
    if (typeof renderPage === 'function') renderPage(currentPage || 'dashboard');
  }
}

          <p class="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest px-4">
            == ${i.label} ==
          </p>
        </div>
      `;
    }

    return `
      <button onclick="navigateTo('${i.id}')" id="nav-${i.id}" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 text-sm rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700" title="${i.label}">
        <i data-lucide="${i.icon}" class="w-4 h-4 flex-shrink-0"></i>
        <span class="sidebar-label">${i.label}</span>
      </button>
    `;
  }).join('');

  if (window.lucide) lucide.createIcons();
}

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  renderPage(page);
  
  const sb = document.getElementById('sidebar');
  if (window.innerWidth < 1024 && sb && !sb.classList.contains('-translate-x-full')) {
    toggleSidebar();
  }
}

function toggleMinimizeSidebar() {
  if (window.innerWidth < 1024) return;

  const sb = document.getElementById('sidebar');
  const header = document.getElementById('sidebarHeader');
  const minimizeBtn = document.getElementById('minimizeBtn');
  const isMinimized = sb.classList.contains('sidebar-minimized');

  if (isMinimized) {
    sb.classList.remove('sidebar-minimized', 'w-16');
    sb.classList.add('w-64');
    if (header) header.classList.remove('hidden');
    if (minimizeBtn?.querySelector('i')) minimizeBtn.querySelector('i').setAttribute('data-lucide', 'chevron-left');
    document.querySelectorAll('.sidebar-label').forEach(el => el.classList.remove('hidden'));
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('justify-center', 'px-2'));
    localStorage.setItem('sidebar-minimized', 'false');
  } else {
    sb.classList.add('sidebar-minimized', 'w-16');
    sb.classList.remove('w-64');
    if (header) header.classList.add('hidden');
    if (minimizeBtn?.querySelector('i')) minimizeBtn.querySelector('i').setAttribute('data-lucide', 'chevron-right');
    document.querySelectorAll('.sidebar-label').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.add('justify-center', 'px-2'));
    localStorage.setItem('sidebar-minimized', 'true');
  }
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (!sb) return;

  const isHidden = sb.classList.contains('-translate-x-full');

  if (window.innerWidth < 1024) {
    sb.classList.remove('sidebar-minimized', 'w-16');
    sb.classList.add('w-64');
    const header = document.getElementById('sidebarHeader');
    if (header) header.classList.remove('hidden');
    document.querySelectorAll('.sidebar-label').forEach(el => el.classList.remove('hidden'));
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('justify-center', 'px-2'));
  }

  if (isHidden) {
    sb.classList.remove('-translate-x-full');
    if (overlay) overlay.classList.remove('hidden');
  } else {
    sb.classList.add('-translate-x-full');
    if (overlay) overlay.classList.add('hidden');
  }
}

window.addEventListener('resize', () => {
  const sb = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (!sb) return;

  if (window.innerWidth < 1024) {
    sb.classList.add('-translate-x-full');
    sb.classList.remove('sidebar-minimized', 'w-16');
    sb.classList.add('w-64');
    if (overlay) overlay.classList.add('hidden');
  } else {
    sb.classList.remove('-translate-x-full');
    const wasMinimized = localStorage.getItem('sidebar-minimized') === 'true';
    if (wasMinimized) {
      sb.classList.add('sidebar-minimized', 'w-16');
      sb.classList.remove('w-64');
    }
  }
});

function toggleDark() {
  document.documentElement.classList.toggle('dark');

}

  const search = elSearch ? elSearch.value.toLowerCase().trim() : '';

  let data = (DB.pelanggaran || [])
    .filter(p => p && p.guru === (currentUser ? currentUser.name : ''))
    .map(p => {
      // Ambil data siswa berbasis ID (String/Number) atau Nama
      const s = (DB.siswa || []).find(x => x && (
        String(x.id) === String(p.siswaId) || 
        String(x.id) === String(p.idSiswa) ||
        (x.nama && p.namaSiswa && x.nama.trim().toLowerCase() === p.namaSiswa.trim().toLowerCase())

        String(x.kode) === String(p.jenisId) || 
        String(x.id) === String(p.tatatertibId)
      ));

      return s ? {

        nisn: s.nisn || '-',
        kelas: s.kelas || '-',

        jenis: tt ? (tt.deskripsi || tt.jenis || tt.nama) : (p.jenisLog || p.pelanggaran || 'Pelanggaran Manual Guru'),
        poin: tt ? (parseInt(tt.poin) || 0) : (parseInt(p.poin) || parseInt(p.skor) || 0)

// 3. FUNGSI FILTER & KALKULASI REKAP SISWA
// ===================================================================
function jalankanFilterRekapSiswa() {
  const elKelas = document.getElementById('filterKelasRekap');
  const elSearch = document.getElementById('searchSiswaRekap');

  const filterKelas = elKelas ? elKelas.value : '';
  const kataKunci = elSearch ? elSearch.value.toLowerCase().trim() : '';

  let rekapSiswa = (DB.siswa || []).map(s => {
    if (!s) return null;

    const namaSiswaAsli = String(s.nama || s.name || "").trim().toLowerCase();

    // Filter list pelanggaran milik siswa ini
    const listPelanggaran = (DB.pelanggaran || []).filter(p => {
      if (!p) return false;
      const matchId = (p.siswaId && String(p.siswaId) === String(s.id)) || (p.idSiswa && String(p.idSiswa) === String(s.id));
      const namaPelanggaran = String(p.namaSiswa || p.nama || p.nama_siswa || "").trim().toLowerCase();
      const matchNama = namaSiswaAsli !== "" && namaPelanggaran === namaSiswaAsli;
      return matchId || matchNama;
    });

    let totalPoin = 0;
    listPelanggaran.forEach(p => {
      const tt = (DB.tatatertib || []).find(x => x && (
        String(x.id) === String(p.jenisId) || 
        String(x.kode) === String(p.jenisId) || 
        String(x.id) === String(p.tatatertibId)
      ));
      const poinFinal = tt ? (parseInt(tt.poin) || 0) : (parseInt(p.poin) || parseInt(p.skor) || 0);
      totalPoin += poinFinal;
    });

    return {
      id: s.id,
      nama: s.nama || s.name || 'Tanpa Nama',
      nisn: s.nisn || '-',
      kelas: s.kelas || '-',
      jumlahKasus: listPelanggaran.length,
      totalPoin: totalPoin
    };
  }).filter(Boolean);

  if (filterKelas) {
    rekapSiswa = rekapSiswa.filter(r => r.kelas === filterKelas);
  }

  if (kataKunci) {
    rekapSiswa = rekapSiswa.filter(r => r.nama.toLowerCase().includes(kataKunci) || String(r.nisn).includes(kataKunci));
  }

  rekapSiswa.sort((a, b) => b.totalPoin - a.totalPoin);

  const tbody = document.getElementById('bodyRekapPelanggaranSiswa');
  if (!tbody) return;

  if (rekapSiswa.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-gray-400 italic">Tidak ada data rekapitulasi siswa yang sesuai filter.</td></tr>`;
    return;
  }

  tbody.innerHTML = rekapSiswa.map((r, index) => {
    let warnaPoin = 'text-gray-700 dark:text-gray-300 font-semibold';
    if (r.totalPoin >= 75) warnaPoin = 'text-red-600 dark:text-red-400 font-bold';
    else if (r.totalPoin >= 40) warnaPoin = 'text-amber-600 dark:text-amber-400 font-bold';

    return `
      <tr class="hover:bg-gray-50/50 dark:hover:bg-gray-700/20 transition">
        <td class="py-3.5 px-6 text-center font-medium text-gray-400">${index + 1}</td>
        <td class="py-3.5 px-6 font-bold text-gray-900 dark:text-white">${r.nama}</td>
        <td class="py-3.5 px-6 font-mono text-xs text-gray-500">${r.nisn}</td>
        <td class="py-3.5 px-6 text-center"><span class="px-2.5 py-1 bg-gray-100 dark:bg-gray-700 rounded-lg text-xs font-medium">${r.kelas}</span></td>
        <td class="py-3.5 px-6 text-center font-medium text-gray-600 dark:text-gray-400">${r.jumlahKasus} Kali</td>
        <td class="py-3.5 px-6 text-center ${warnaPoin}">${r.totalPoin} Pts</td>
        <td class="py-3.5 px-6 text-center">
          <button onclick="lihatDetailPelanggaranSiswa('${r.id}')" 
            class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 dark:bg-blue-900/30 dark:hover:bg-blue-900/50 text-blue-600 dark:text-blue-400 text-xs font-semibold rounded-xl transition flex items-center gap-1 mx-auto">
            🔍 Detail
          </button>
        </td>
      </tr>
    `;
  }).join('');
}

function lihatDetailPelanggaranSiswa(siswaId) {
  const siswa = (DB.siswa || []).find(s => s && String(s.id) === String(siswaId));
  if (!siswa) return;

  const modal = document.getElementById('modalDetailSiswa');
  const elNama = document.getElementById('modalNamaSiswa');
  const elInfo = document.getElementById('modalInfoSiswa');
  const tbody = document.getElementById('bodyDetailPelanggaranSiswa');

  if (elNama) elNama.textContent = `Detail Riwayat: ${siswa.nama || siswa.name}`;
  if (elInfo) elInfo.textContent = `NISN: ${siswa.nisn || '-'} | Kelas: ${siswa.kelas || '-'}`;

  const namaSiswaAsli = String(siswa.nama || siswa.name || "").trim().toLowerCase();

  // Cek apakah user saat ini adalah Admin
  const userRole = typeof currentUser !== 'undefined' && currentUser.role ? currentUser.role.toLowerCase() : '';
  const isAdmin = userRole === 'admin' || userRole === 'superadmin';

  // Perbarui Header Tabel jika ada elemen <thead> khusus detail siswa

function cetakRekapPelanggaranPerKelas() {
  // 1. Dapatkan daftar kelas unik terurut
  const daftarKelas = [...new Set((DB.siswa || []).map(s => s.kelas))].sort();
  
  if (daftarKelas.length === 0) {
    alert("Belum ada data siswa untuk dicetak!");
    return;
  }

  const namaSekolah = DB.identitas?.namaSekolah || "SMK NEGERI 1 MEPANGA";
  const alamatSekolah = DB.identitas?.alamat || "Kabupaten Parigi Moutong";

  // 2. Bangun HTML halaman print preview
  let htmlKontenCetak = "";

  daftarKelas.forEach((namaKelas) => {
    // Ambil siswa yang berada di kelas ini
    let siswaDiKelas = (DB.siswa || []).filter(s => s.kelas === namaKelas);

    // Hitung total poin akumulasi untuk masing-masing siswa di kelas ini
    let dataKompilasiSiswa = siswaDiKelas.map(s => {
      const listPelanggaran = (DB.pelanggaran || []).filter(p => {
        return String(p.siswaId) === String(s.id) || String(p.idSiswa) === String(s.id);
      });

      let totalPoin = 0;
      listPelanggaran.forEach(p => {
        const tt = DB.tatatertib.find(x => String(x.id) === String(p.jenisId) || String(x.kode) === String(p.jenisId) || String(x.id) === String(p.tatatertibId));
        const poinFinal = tt ? (parseInt(tt.poin) || 0) : (parseInt(p.poin) || parseInt(p.skor) || 0);
        totalPoin += poinFinal;
      });

      return { nama: s.nama, kelas: s.kelas, totalPoin: totalPoin };
    });

    // Urutkan berdasarkan nama siswa secara alfabetis (atau berdasarkan poin tertinggi: b.totalPoin - a.totalPoin)
    dataKompilasiSiswa.sort((a, b) => a.nama.localeCompare(b.nama));

    // Bangun satu tabel khusus kelas ini
    htmlKontenCetak += `
      <div class="halaman-kelas" style="page-break-after: always; margin-bottom: 40px;">
        <h3 style="font-size: 14px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; border-bottom: 2px solid #000; padding-bottom: 4px;">
          DAFTAR REKAPITULASI POIN PELANGGARAN - KELAS: ${namaKelas}
        </h3>
        <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
          <thead>
            <tr>
              <th style="border: 1px solid #000; padding: 6px; text-align: center; font-weight: bold; background-color: #f2f2f2; width: 8%;">No</th>
              <th style="border: 1px solid #000; padding: 6px; text-align: left; font-weight: bold; background-color: #f2f2f2; width: 52%;">NAMA SISWA</th>
              <th style="border: 1px solid #000; padding: 6px; text-align: center; font-weight: bold; background-color: #f2f2f2; width: 20%;">KELAS</th>
              <th style="border: 1px solid #000; padding: 6px; text-align: center; font-weight: bold; background-color: #f2f2f2; width: 20%;">TOTAL POIN</th>
            </tr>
          </thead>
          <tbody>
            ${dataKompilasiSiswa.map((s, index) => `
              <tr>
                <td style="border: 1px solid #000; padding: 6px; text-align: center;">${index + 1}</td>
                <td style="border: 1px solid #000; padding: 6px; font-weight: bold;">${s.nama}</td>
                <td style="border: 1px solid #000; padding: 6px; text-align: center;">${s.kelas}</td>
                <td style="border: 1px solid #000; padding: 6px; text-align: center; font-weight: bold; ${s.totalPoin > 0 ? 'color: red;' : ''}">${s.totalPoin} Pts</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  });

  // 3. Gabungkan struktur penuh dokumen cetak dengan KOP Sekolah standar resmi Anda
  const dokumenFinal = `
    <!DOCTYPE html>
    <html>
    <head>
      <title>Cetak Rekap Pelanggaran Per Kelas</title>
      <style>
        body { font-family: sans-serif; margin: 20px; color: #000; background-color: #fff; }
        .kop { text-align: center; margin-bottom: 15px; }
        .kop h1 { font-size: 18px; font-weight: 900; margin: 0; text-transform: uppercase; }
        .kop h2 { font-size: 13px; font-weight: bold; margin: 0; text-transform: uppercase; }
        .kop p { font-size: 10px; font-style: italic; margin: 3px 0 0 0; }
        .garis { border-bottom: 4px double black; margin-top: 5px; margin-bottom: 20px; }
        .editor-box { background: #f8fafc; padding: 10px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .editor-box button { background: #2563eb; color: #fff; border: none; padding: 6px 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        @media print {
          .no-print { display: none !important; }
          body { margin: 10px; }
          .halaman-kelas { page-break-after: always; }
        }
      </style>
    </head>
    <body>
      <div class="editor-box no-print">
        <button onclick="window.print()">Cetak Dokumen Sekarang</button>
        <button style="background: #64748b;" onclick="window.close()">Tutup Halaman</button>
      </div>
      
      <div class="kop">
        <h2>PEMERINTAH PROVINSI SULAWESI TENGAH</h2>
        <h1>${namaSekolah}</h1>
        <p>Alamat : ${alamatSekolah}</p>
      </div>
      <div class="garis"></div>

      ${htmlKontenCetak}
    </body>
    </html>
  `;

  // 4. Eksekusi buka jendela pop-up print browser baru
  const jendelaprint = window.open('', '_blank');
  if (jendelaprint) {
    jendelaprint.document.write(dokumenFinal);
    jendelaprint.document.close();
  } else {
    alert("Gagal mencetak rekap! Pop-up browser Anda terblokir, mohon izinkan akses pop-up sistem.");
  }
}

function renderRekapKreditPoin() {
  const mc = document.getElementById('mainContent');
  if (!mc) return;

  // 1. Ambil daftar semua kelas unik dari DB.kelas atau DB.siswa
  const daftarKelas = Array.from(new Set([
    ...(DB.kelas || []).map(k => typeof k === 'object' ? k.nama || k.name : k),
    ...(DB.siswa || []).map(s => s.kelas)
  ])).filter(Boolean).sort();

// 2. Olah & kalkulasi data semua siswa (Sinkron dengan Bimbingan Kesiswaan)
  let data = (DB.siswa || []).map(siswa => {
    // A. Kredit Poin Prestasi
    const kredit = (DB.kreditPoin || []).filter(k => String(k.siswaId) === String(siswa.id));
    const totalKredit = kredit.reduce((a, b) => a + (parseInt(b.poin) || 0), 0);
    
    // B. Total Poin Pelanggaran Tata Tertib
    let poinPelanggaranTT = 0;
    if (DB.pelanggaran) {
      DB.pelanggaran.forEach(p => {
        if (String(p.siswaId || p.idSiswa) === String(siswa.id)) {
          const tt = DB.tatatertib && DB.tatatertib.length > 0 ? DB.tatatertib.find(x => x.id == p.jenisId || x.kode == p.jenisId) : null;
          poinPelanggaranTT += tt ? (parseInt(tt.poin) || 0) : (parseInt(p.poin) || 0);
        }
      });
    }

    // C. Total Poin Ketidakhadiran (Absensi: Alpa x 3, Izin x 1, Sakit x 0.5)
    let totalPoinAbsen = 0;
    let totalHariAlpa = 0;
    if (DB.kehadiran) {
      const logSiswa = DB.kehadiran.filter(k => 
        String(k.siswaId || k.idSiswa || '') === String(siswa.id) ||
        (siswa.nisn && String(k.nisn || '') === String(siswa.nisn))
      );
      
      let alpa = 0, izin = 0, sakit = 0;
      logSiswa.forEach(k => {
        const st = String(k.status || "").toUpperCase().trim();
        if (st === 'A' || st === 'ALFA' || st === 'ALPA') alpa++;
        else if (st === 'I' || st === 'IZIN') izin++;
        else if (st === 'S' || st === 'SAKIT') sakit++;
      });
      
      totalHariAlpa = alpa;
      totalPoinAbsen = (alpa * 3) + (izin * 1) + (sakit * 0.5);
    }

    // D. Total Remisi / Penebusan Poin
    const sourcePenebusan = DB.penebusanPoin || DB.penebusan_poin || [];
    const listPenebusan = Array.isArray(sourcePenebusan) 
      ? sourcePenebusan 
      : Object.keys(sourcePenebusan).map(k => ({ idPenebusan: k, ...sourcePenebusan[k] }));

    let totalPenebusan = 0;
    listPenebusan.forEach(p => {
      if (String(p.siswaId || p.idSiswa) === String(siswa.id)) {
        totalPenebusan += (Number(p.poinPemulihan || p.poin) || 0);
      }
    });

    // E. Total Poin Pelanggaran Bersih
    let totalKotorPelanggaran = poinPelanggaranTT + totalPoinAbsen;
    let totalPelanggaran = totalKotorPelanggaran - totalPenebusan;
    if (totalPelanggaran < 0) totalPelanggaran = 0;

    // F. Total Skor Akhir (Murni: Kredit - Pelanggaran Bersih)
    const totalAkhir = totalKredit - totalPelanggaran;

    return {
      ...siswa,
      totalKredit,
      totalPelanggaran,
      totalAbsen: totalHariAlpa,
      totalAkhir
    };
  });

  // 3. Terapkan Filter Kelas
  if (filterKelasRekap !== 'ALL') {
    data = data.filter(s => String(s.kelas).trim() === String(filterKelasRekap).trim());
  }

  // 4. Terapkan Sorting Sisa Poin
  data.sort((a, b) => {
    if (sortPoinRekap === 'ASC') {
      return a.totalAkhir - b.totalAkhir; // Sisa Poin Terendah -> Tertinggi
    } else {
      return b.totalAkhir - a.totalAkhir; // Sisa Poin Tertinggi -> Terendah
    }
  });

  mc.innerHTML = `

// FUNGSI HANDLER UNTUK MERUBAH FILTER TERSEBUT
// =========================================================================
function ubahFilterKelasRekap(val) {
  filterKelasRekap = val;
  renderRekapKreditPoin();
}

function ubahSortPoinRekap(val) {
  sortPoinRekap = val;
  renderRekapKreditPoin();
}

function resetFilterRekap() {
  filterKelasRekap = 'ALL';
  sortPoinRekap = 'ASC';
  renderRekapKreditPoin();
}

function previewKreditPoin(siswaId) {
  showModalPreviewKredit(siswaId);
}


// =========================================================================
// FUNGSI UTAMA MODAL PREVIEW DENGAN FITUR RINCIAN & HAPUS DATA KREDIT/PELANGGARAN
// =========================================================================

function showModalPreviewKredit(siswaId) {
  const siswa = DB.siswa.find(s => String(s.id) === String(siswaId));

  if (!siswa) {
    if (typeof showToast === 'function') showToast('Data siswa tidak ditemukan', 'danger');
    else alert('Data siswa tidak ditemukan');
    return;
  }

  // Hapus modal lama jika ada
  const existingModal = document.getElementById('modalPreviewKredit');
  if (existingModal) existingModal.remove();

  // 1. AMBIL DATA KREDIT (POSITIF) DAN PELANGGARAN (NEGATIF)
  const kredit = (DB.kreditPoin || []).filter(k => String(k.siswaId) === String(siswaId));
  const pelanggaran = (DB.pelanggaran || []).filter(p => String(p.siswaId) === String(siswaId));
  
  const hasil = typeof hitungPoinSiswa === 'function' ? hitungPoinSiswa(siswaId) : { totalKredit: 0, totalPelanggaran: 0, sisaPoin: 100 };

  const totalKredit = hasil.totalKredit || kredit.reduce((a, b) => a + (parseInt(b.poin) || 0), 0);
  const totalPelanggaran = hasil.totalPelanggaran || pelanggaran.reduce((a, b) => a + (parseInt(b.poin) || 0), 0);
  const sisaPoin = hasil.sisaPoin !== undefined ? hasil.sisaPoin : (totalKredit - totalPelanggaran);

  // 2. DATA KEHADIRAN & HARI AKTIF
  const logSiswa = (DB.kehadiran || []).filter(k => {
    const idDariAbsen = k.siswaId || k.id_siswa || k.siswa_id;
    return String(idDariAbsen) === String(siswaId);
  });

  const izin = logSiswa.filter(k => ['IZIN', 'I'].includes(String(k.status || '').toUpperCase().trim())).length;
  const sakit = logSiswa.filter(k => ['SAKIT', 'S'].includes(String(k.status || '').toUpperCase().trim())).length;
  const alpa = logSiswa.filter(k => ['ALPA', 'ALFA', 'A'].includes(String(k.status || '').toUpperCase().trim())).length;

  let hariAktifBelajar = logSiswa.length; 
  const hariAktifSekolah = typeof hitungHariAktifSekolah === 'function' ? hitungHariAktifSekolah() : 0;
  
  const totalTidakHadir = izin + sakit + alpa;
  let totalHadir = 0;
  let persentaseKehadiran = "0.0";

  if (hariAktifBelajar > 0) {
    totalHadir = Math.max(0, hariAktifBelajar - totalTidakHadir);
    persentaseKehadiran = ((totalHadir / hariAktifBelajar) * 100).toFixed(1);
  } else if (hariAktifSekolah > 0) {
    totalHadir = hariAktifSekolah;
    hariAktifBelajar = hariAktifSekolah; 
    persentaseKehadiran = "100.0";
  }
    
  // 3. LOGIKA STATUS
  let statusText = 'SISWA DALAM KATEGORI AMAN';
  let statusColor = 'text-green-600 bg-green-50 border-green-200 dark:bg-green-950/20 dark:border-green-900/50 dark:text-green-400';

  if (sisaPoin <= -100) {
    statusText = '🚨 KRITIS (TERANCAM DO)';
    statusColor = 'text-red-700 bg-red-100 border-red-300 dark:bg-red-950/40 dark:border-red-900 dark:text-red-400';
  } else if (sisaPoin <= -75) {
    statusText = '⚠️ BIMBINGAN WAKASIS (SP 2)';
    statusColor = 'text-red-600 bg-red-50 border-red-200 dark:bg-red-950/20 dark:border-red-900/50 dark:text-red-400';
  } else if (sisaPoin <= -50) {
    statusText = 'REKOMENDASI BK';
    statusColor = 'text-orange-600 bg-orange-50 border-orange-200 dark:bg-amber-950/20 dark:border-amber-900/50 dark:text-amber-400';
  } else if (sisaPoin <= -25) {
    statusText = 'BIMBINGAN WALI KELAS (T2: KUNJUNGAN RUMAH)';
    statusColor = 'text-yellow-600 bg-yellow-50 border-yellow-200 dark:bg-yellow-950/20 dark:border-yellow-900/50 dark:text-yellow-400';
  } else if (sisaPoin <= -15) {
    statusText = 'BIMBINGAN WALI KELAS (TAHAP 1)';
    statusColor = 'text-yellow-600 bg-yellow-50 border-yellow-100 dark:bg-yellow-950/10 dark:border-yellow-900/30 dark:text-yellow-400';
  }

  // 4. GENERATE BARIS TABEL CETAK PRINT OUT
  const riwayatKreditPrint = kredit.length === 0
    ? `<tr><td colspan="5" style="text-align:center; padding:12px; color:#94a3b8; font-style:italic;">Belum ada catatan riwayat penghargaan / poin positif.</td></tr>`
    : kredit.map((k, i) => `
      <tr style="border-b: 1px solid #e2e8f0; font-size:12px;">
        <td style="padding:8px; text-align:center;">${i + 1}</td>
        <td style="padding:8px; font-family:monospace; color:#475569;">${k.tanggal || '-'}</td>
        <td style="padding:8px; font-weight:bold;">${k.namaKredit || '-'}</td>

        <td style="padding:8px; text-align:right; font-weight:bold; color:#16a34a;">+${k.poin}</td>
      </tr>`).join('');

  const riwayatPelanggaranPrint = pelanggaran.length === 0
    ? `<tr><td colspan="5" style="text-align:center; padding:12px; color:#94a3b8; font-style:italic;">Bersih dari pelanggaran. Siswa berperilaku sangat baik.</td></tr>`

      <tr style="border-b: 1px solid #e2e8f0; font-size:12px;">
        <td style="padding:8px; text-align:center;">${i + 1}</td>
        <td style="padding:8px; font-family:monospace; color:#475569;">${p.tanggal || '-'}</td>
        <td style="padding:8px; font-weight:bold; color:#b91c1c;">${p.namaPelanggaran || p.jenisPelanggaran || '-'}</td>
        <td style="padding:8px; color:#64748b;">${p.keterangan || p.deskripsi || '-'}</td>
        <td style="padding:8px; text-align:right; font-weight:bold; color:#dc2626;">-${p.poin}</td>
      </tr>`).join('');

  // STRUKTUR HTML PRINT
  window.printTargetContent = `

        .kop-text { text-align: center; flex-grow: 1; }

        .doc-title { text-align: center; font-size: 16px; font-weight: bold; text-decoration: underline; text-transform: uppercase; margin: 15px 0 5px 0; }
        .doc-sub { text-align: center; font-size: 11px; color: #475569; margin: 0 0 25px 0; }
        .meta-table { width: 100%; margin-bottom: 20px; font-size: 13px; }
        .meta-table td { padding: 4px 0; }

        .card-val { font-size: 20px; font-weight: bold; margin-top: 4px; }

        table.data-table { width: 100%; border-collapse: collapse; margin-top: 5px; }

        table.data-table td { border: 1px solid #e2e8f0; padding: 8px; }
        .ttd-section { margin-top: 50px; display: flex; justify-content: space-between; font-size: 13px; page-break-inside: avoid; }
        .ttd-box { text-align: center; width: 220px; }
        .ttd-space { height: 75px; }
      </style>
    </head>
    <body>
      <div class="kop-surat">
        <div class="kop-text">
          <p class="kop-lembaga">PEMERINTAH PROVINSI SULAWESI TENGAH<br>DINAS PENDIDIKAN DAN KEBUDAYAAN</p>
          <h2 class="kop-sekolah">SMK NEGERI 1 MEPANGA</h2>

// FUNGSI HAPUS ENTRY KREDIT POIN / PELANGGARAN (SINKRON FIREBASE & MEMORI)
// =========================================================================
function hapusEntryKreditPoin(entryId, siswaId, tipe) {
  if (!confirm("Apakah Anda yakin ingin menghapus data rincian poin ini secara permanen?")) return;

  // 1. FILTER DATA DI MEMORI LOKAL (RAM)
  if (tipe === 'kredit') {
    if (Array.isArray(DB.kreditPoin)) {
      DB.kreditPoin = DB.kreditPoin.filter(item => {
        const idItem = item.id || item._id;
        return String(idItem) !== String(entryId);
      });
    }
  } else if (tipe === 'pelanggaran') {
    if (Array.isArray(DB.pelanggaran)) {
      DB.pelanggaran = DB.pelanggaran.filter(item => {
        const idItem = item.id || item._id;
        return String(idItem) !== String(entryId);
      });
    }
  }

  // 2. SIMPAN / KIRIM PERUBAHAN KE FIREBASE CLOUD (SOLUSI UTAMA)
  let targetDb = null;
  if (typeof database !== 'undefined') {
    targetDb = database;
  } else if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
    targetDb = window.firebase.apps[0].database();
  }

  if (targetDb) {
    // Tentukan path mana yang akan diupdate di Firebase
    const pathTarget = (tipe === 'kredit') ? 'kesiswaan_cloud/kreditPoin' : 'kesiswaan_cloud/pelanggaran';
    const dataTerbaru = (tipe === 'kredit') ? DB.kreditPoin : DB.pelanggaran;

    // Tulis ulang array terbaru ke Firebase agar data yang terhapus benar-benar hilang dari Cloud
    targetDb.ref(pathTarget).set(dataTerbaru)
      .then(() => {
        console.log("Berhasil menghapus data dari Firebase!");
      })
      .catch((error) => {
        console.error("Gagal memperbarui Firebase:", error);
      });
  }

  // 3. BACKUP KE LOCALSTORAGE
  try {
    localStorage.setItem('DB', JSON.stringify(DB));
  } catch (e) {
    console.error("Gagal simpan localStorage", e);
  }

  // 4. NOTIFIKASI & REFRESH TAMPILAN
  if (typeof showToast === 'function') {
    showToast('Data berhasil dihapus permanen dari Cloud & Lokal', 'success');
  }

  // Reload Modal & Rekap Poin
  if (typeof showModalPreviewKredit === 'function') {
    showModalPreviewKredit(siswaId);
  }
  if (typeof renderRekapKreditPoin === 'function') {
    renderRekapKreditPoin();
  }
}

function generateSuratCP() {
  const sid = document.getElementById('cariSiswaCP') ? document.getElementById('cariSiswaCP').value : null;
  if (!sid) {
    if (typeof showToast === 'function') showToast('Pilih siswa terlebih dahulu', 'error');
    else alert('Pilih siswa terlebih dahulu');
    return;
  }

  const s = (DB.siswa || []).find(x => String(x.id) === String(sid));
  if (!s) {
    if (typeof showToast === 'function') showToast('Siswa tidak ditemukan', 'error');
    else alert('Siswa tidak ditemukan');
    return;
  }

  // Tanggal default hari ini (YYYY-MM-DD)
  const tglDefault = new Date().toISOString().split('T')[0];

  // Helper extractor tanggal sinkron dengan Laporan Bimbingan
  const getTanggal = (obj) => {
    if (!obj) return '';
    return obj.tanggal || 
           obj.tgl || 
           obj.tglPenebusan || 
           obj.tgl_penebusan || 
           obj.tanggalPenebusan || 
           obj.tanggalEksekusi || 
           obj.tgl_bimbingan || 
           obj.tanggal_bimbingan || 
           obj.created_at || 
           obj.createdAt || '';
  };

  // 1. Ambil data Pelanggaran Tata Tertib (BERNILAI NEGATIF)
  const pel = (DB.pelanggaran || []).filter(p => p && (String(p.siswaId) === String(sid) || String(p.idSiswa) === String(sid))).map(p => {
    const tt = (DB.tatatertib || []).find(t => t && (String(t.id) === String(p.jenisId) || String(t.kode) === String(p.jenisId)));
    const nilaiPoin = tt ? parseInt(tt.poin) : (parseInt(p.poin) || parseInt(p.skor) || 0);
    return {
      tanggal: getTanggal(p) || tglDefault,
      jenis: tt ? (tt.deskripsi || tt.jenis) : (p.pelanggaran || p.namaPelanggaran || 'Pelanggaran Aturan'),
      ket: 'Tata Tertib',
      type: 'pelanggaran',
      poin: -Math.abs(nilaiPoin)
    };
  });

  // 2. Ambil data Ketidakhadiran (BERNILAI NEGATIF)
  const logAbsen = (DB.kehadiran || []).filter(k => 
    k && (String(k.siswaId || '') === String(sid) || 
          String(k.idSiswa || '') === String(sid) || 
          (s.nisn && String(k.nisn || '') === String(s.nisn)))
  );

  const kh = logAbsen.filter(k => String(k.status || '').toLowerCase() !== 'hadir').map(k => {
    const st = String(k.status || '').toUpperCase().trim();
    let pt = (st === 'A' || st === 'ALFA' || st === 'ALPA') ? 3 : (st === 'I' || st === 'IZIN') ? 1 : 0.5;
    return {
      tanggal: getTanggal(k) || tglDefault,
      jenis: `Ketidakhadiran Kelas (Status: ${st})`,
      ket: 'Absensi',
      type: 'pelanggaran',
      poin: -Math.abs(pt)
    };
  });

  // 3. Ambil Remisi dari DB.penebusan_poin (Keterangan & Tanggal Persis Laporan)
  const remisi1 = (DB.penebusan_poin || []).filter(p => p && (String(p.siswaId) === String(sid) || String(p.idSiswa) === String(sid))).map(p => {
    // Memeriksa nama aturan penebusan dari ATURAN_PENEBUSAN jika kustom/id tersimpan
    let namaAturan = p.instrumen || p.kegiatan || p.tindakan || p.keterangan || p.alasan;
    if (!namaAturan && typeof ATURAN_PENEBUSAN !== 'undefined') {
      const matchAturan = ATURAN_PENEBUSAN.find(a => String(a.id) === String(p.aturanId || p.jenisId));
      if (matchAturan) namaAturan = matchAturan.nama;
    }

    return {
      tanggal: getTanggal(p) || tglDefault,
      jenis: namaAturan || 'Penebusan Poin / Kegiatan Positif',
      ket: 'Remisi Poin',
      type: 'remisi',
      poin: Math.abs(Number(p.poinPemulihan || p.poin || p.jumlahPoin || p.nilaiKredit) || 0)
    };
  });

  // 4. Ambil Remisi dari DB.remisi
  const remisi2 = (DB.remisi || []).filter(r => r && (String(r.siswaId) === String(sid) || String(r.idSiswa) === String(sid))).map(r => ({
    tanggal: getTanggal(r) || tglDefault,
    jenis: r.instrumen || r.kegiatan || r.keterangan || r.alasan || 'Pengurangan Poin / Remisi',
    ket: 'Remisi Poin',
    type: 'remisi',
    poin: Math.abs(Number(r.poin || r.poinPemulihan || r.nilaiKredit) || 0)
  }));

  // 5. Ambil Remisi/Tindakan dari DB.bimbingan / DB.riwayatTindakan
  const remisi3 = (DB.bimbingan || []).concat(DB.riwayatTindakan || []).filter(b => {
    if (!b) return false;
    const matchSiswa = String(b.siswaId) === String(sid) || String(b.idSiswa) === String(sid);
    const hasPoinRemisi = Number(b.poinPemulihan || b.poinRemisi || b.poin) > 0;
    const isJenisRemisi = b.kategori && String(b.kategori).toLowerCase().includes('remisi');
    return matchSiswa && (hasPoinRemisi || isJenisRemisi);
  }).map(b => ({
    tanggal: getTanggal(b) || tglDefault,
    jenis: b.solusi || b.uraian || b.kegiatan || b.keterangan || b.tindakLanjut || 'Pemulihan Poin / Bimbingan Kesiswaan',
    ket: 'Remisi Poin',
    type: 'remisi',
    poin: Math.abs(Number(b.poinPemulihan || b.poinRemisi || b.poin) || 0)
  }));

  const listRemisi = [...remisi1, ...remisi2, ...remisi3];

  // Helper parser tanggal pengurutan
  const parseTanggal = (dStr) => {
    if (!dStr) return new Date(0);
    if (typeof dStr === 'string' && dStr.includes('/')) {
      const parts = dStr.trim().split('/');
      if (parts[0].length === 4) return new Date(dStr);
      return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
    }
    return new Date(dStr);
  };

  // Gabung & Urutkan Kronologis (Lama ke Baru)
  const all = [...pel, ...kh, ...listRemisi].sort((a, b) => parseTanggal(a.tanggal) - parseTanggal(b.tanggal));

  // Kalkulasi Total Poin
  let totalPelanggaran = 0;
  let totalRemisi = 0;

  all.forEach(item => {
    if (item.poin < 0) {
      totalPelanggaran += item.poin;
    } else {
      totalRemisi += item.poin;
    }
  });

  const sisaPoin = totalPelanggaran + totalRemisi;

  const now = new Date();
  const bulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const tglSurat = `${now.getDate()} ${bulan[now.getMonth()]} ${now.getFullYear()}`;

  window.currentSuratData = {
    siswaId: sid, s, pel, kh, listRemisi, all,
    totalPelanggaran, totalRemisi, sisaPoin, tglSurat,
    noSurat: "09. /SMK-MPG/ /2026",
    paragrafPembuka: "Berdasarkan rekaman data objektif yang tersimpan pada Sistem Informasi Kesiswaan (SIK) sekolah, siswa tersebut di atas memiliki akumulasi poin penilaian perilaku dengan rincian riwayat pelanggaran tata tertib, ketidakhadiran, serta perolehan remisi/penebusan poin sebagai berikut:",
    paragrafPenutup: "Demikian surat keterangan catatan kesiswaan ini diterbitkan dengan sebenar-benarnya berdasarkan rekapitulasi real-time guna dipergunakan sebagai bahan evaluasi wali murid maupun pemenuhan syarat administratif yang diperlukan."
  };

  const preview = document.getElementById('suratPreview');
  if (preview) preview.classList.remove('hidden');
  if (typeof renderSuratPreview === 'function') renderSuratPreview();
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function toggleSuratEdit() {
  const form = document.getElementById('suratEditForm');
  form.classList.toggle('hidden');
}

function saveSuratEdit() {
  const d = window.currentSuratData;
  d.noSurat = document.getElementById('editNomor').value;
  d.tglSurat = document.getElementById('editTanggal').value;
  d.paragrafPembuka = document.getElementById('editParagraf').value;
  d.paragrafPenutup = document.getElementById('editPenutup').value;

  document.getElementById('displayNomor').innerText = d.noSurat;
  document.getElementById('displayTanggal').innerText = d.tglSurat;
  document.getElementById('displayPembuka').innerText = d.paragrafPembuka;
  document.getElementById('displayPenutup').innerText = d.paragrafPenutup;

  toggleSuratEdit();
  if (typeof showToast === 'function') showToast('Konten surat berhasil diperbarui!', 'success');
}

function downloadSurat() {
  const content = document.getElementById('suratContent').innerHTML;
  const link = document.createElement('a');
  link.href = 'data:text/html,' + encodeURIComponent(`<html><head><meta charset="UTF-8"><title>Surat Keterangan</title><style>body{font-family:'Times New Roman',serif;padding:20px;line-height:1.6}.kop{display:flex;align-items:center;justify-content:space-between;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:20px}table{border-collapse:collapse;width:100%;margin:15px 0}th,td{border:1px solid #000;padding:8px;text-align:center}td{text-align:left}h1{text-align:center;font-size:14pt;font-weight:bold;margin:20px 0}</style></head><body>${content}</body></html>`);
  link.download = 'Surat_Keterangan_Pelanggaran.html';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  if (typeof showToast === 'function') showToast('Surat berhasil diunduh', 'success');
}

function filterKelasAdmin() {
  document.getElementById('bodyKelas').innerHTML = DB.kelas.map((k, i) => {
    // 1. Cari data Wali Kelas dari DB.users
    const walasObj = (DB.users || []).find(u => 
      u.role === 'walas' && 
      String(u.kelasBinaan || '').toLowerCase().trim() === String(k).toLowerCase().trim()
    );

    const namaWalas = walasObj ? (walasObj.nama || walasObj.username) : '<span class="text-gray-400 italic text-xs">Belum Ditentukan</span>';

    // 2. Filter siswa berdasarkan kelas
    const siswaDiKelas = DB.siswa.filter(s => s.kelas === k);
    const jmlTotal = siswaDiKelas.length;

    // 3. Hitung Laki-laki dan Perempuan
    let jmlL = 0;
    let jmlP = 0;
    siswaDiKelas.forEach(s => {
      const jk = String(s.jenisKelamin || s.jk || s.gender || '').toUpperCase().trim();
      if (jk === 'L' || jk === 'LAKI-LAKI' || jk === 'LAKI LAKI') {
        jmlL++;
      } else if (jk === 'P' || jk === 'PEREMPUAN') {
        jmlP++;
      }
    });

    return `<tr class="border-t dark:border-gray-700/50">
      <td class="py-3 px-4">${i + 1}</td>
      <td class="py-3 px-4 font-semibold text-gray-800 dark:text-gray-100">${k}</td>
      <td class="py-3 px-4">
        <div class="flex items-center gap-1.5 text-xs font-medium text-gray-700 dark:text-gray-300">
          <i data-lucide="user-check" class="w-3.5 h-3.5 text-teal-600 dark:text-teal-400"></i>
          <span>${namaWalas}</span>
        </div>
      </td>
      <td class="py-3 px-4">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="px-2.5 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-full text-xs font-semibold" title="Total Siswa">
            Total: ${jmlTotal}
          </span>
          <span class="px-2 py-0.5 bg-sky-100 dark:bg-sky-900/40 text-sky-800 dark:text-sky-300 rounded-md text-xs font-medium" title="Laki-laki">
            L: ${jmlL}
          </span>
          <span class="px-2 py-0.5 bg-pink-100 dark:bg-pink-900/40 text-pink-800 dark:text-pink-300 rounded-md text-xs font-medium" title="Perempuan">
            P: ${jmlP}
          </span>
        </div>
      </td>
      <td class="py-3 px-4 flex gap-2">
        <button onclick="editKelas('${k}')" class="text-blue-500 hover:text-blue-700"><i data-lucide="edit" class="w-4 h-4"></i></button>
        <button onclick="deleteKelas('${k}')" class="text-red-500 hover:text-red-700"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" class="py-8 text-center text-gray-400">Belum ada kelas</td></tr>';
  
  if (window.lucide) lucide.createIcons();
}

async function saveKelas(oldNama) {
  const newNama = document.getElementById('fkNama').value.trim();
  if (!newNama) { showToast('Masukkan nama kelas', 'error'); return; }

  if (oldNama) {
    // Edit existing
    const idx = DB.kelas.findIndex(k => k === oldNama);
    if (idx > -1) {
      DB.kelas[idx] = newNama;
      // Update siswa yang terkait
      DB.siswa.forEach(s => { if (s.kelas === oldNama) s.kelas = newNama; });
      // Update kelas binaan wali kelas jika nama kelas berubah
      (DB.users || []).forEach(u => {
        if (u.role === 'walas' && String(u.kelasBinaan).toLowerCase() === String(oldNama).toLowerCase()) {
          u.kelasBinaan = newNama;
        }
      });
      addAuditLog('Edit Kelas: ' + oldNama + ' → ' + newNama);
      showToast('Kelas berhasil diubah', 'success');
    }
  } else {
    // Add new
    if (DB.kelas.includes(newNama)) { showToast('Kelas sudah ada', 'error'); return; }
    DB.kelas.push(newNama);
    addAuditLog('Tambah Kelas: ' + newNama);
    showToast('Kelas berhasil ditambahkan', 'success');
  }
  
  // WAJIB
  await simpanDataKeStorage("kelas");
  if (oldNama && typeof simpanDataKeStorage === 'function') {
    await simpanDataKeStorage("users");
  }

  document.getElementById('formKelasContainer').classList.add('hidden');
  filterKelasAdmin();
}

async function deleteKelas(nama) {
  const jmlSiswa = DB.siswa.filter(s => s.kelas === nama).length;
  if (jmlSiswa > 0) { showToast('Tidak bisa menghapus kelas yang masih memiliki siswa', 'error'); return; }
  const idx = DB.kelas.findIndex(k => k === nama);
  if (idx > -1) {
    DB.kelas.splice(idx, 1);
    // WAJIB
    await simpanDataKeStorage("kelas");
    addAuditLog('Hapus Kelas: ' + nama);
    showToast('Kelas berhasil dihapus', 'success');
    filterKelasAdmin();
  }
}

function importKelasExcel(e) {
  const file = e.target.files[0];
  if (!file) { showToast('Pilih file terlebih dahulu', 'error'); return; }
  const reader = new FileReader();
  reader.onload = async event => {
    try {
      const lines = event.target.result.split('\n').filter(l => l.trim());
      if (lines.length < 2) { showToast('Format file tidak valid', 'error'); return; }
      let imported = 0;
      for (let i = 1; i < lines.length; i++) {

  };
  reader.readAsText(file);
  e.target.value = '';
}

function importGuruExcel(e) {
  const file = e.target.files[0];
  if (!file) { if (typeof showToast === 'function') showToast('Pilih file terlebih dahulu', 'error'); return; }
  const reader = new FileReader();
  reader.onload = event => {
    try {
      const lines = event.target.result.split('\n').filter(l => l.trim());

              nip: cols[1], 
              mapel: roleTerpilih === 'guru' ? cols[2] : '', 
              username: cols[3], 
              password: cols[4], 
              role: roleTerpilih,
              kelasBinaan: roleTerpilih === 'walas' ? (cols[6] ? cols[6].toUpperCase() : '') : '',
              noWa: noWaImport,
              hp: noWaImport
            });
            imported++;
          }
        }
      }

      if (typeof simpanKehadiranDanSync === 'function') simpanKehadiranDanSync();

    } catch (err) { if (typeof showToast === 'function') showToast('Error: ' + err.message, 'error'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function filterSiswaAdmin() {
  const searchInput = document.getElementById('searchSiswa');
  const kelasSelect = document.getElementById('filterKelasS');

  const search = (searchInput?.value || '').trim().toLowerCase();
  const kelas = (kelasSelect?.value || '').trim();

  let data = [...(DB.siswa || [])];

  // 1. Filter Kelas (Abaikan jika memilih "Semua Kelas" atau nilainya kosong)
  if (kelas && kelas !== 'Semua Kelas') {
    data = data.filter(s => String(s.kelas || '').trim().toLowerCase() === kelas.toLowerCase());
  }

  // 2. Filter Pencarian (Di-wrap String() agar aman dari Tipe Data Number / Angka)
  if (search) {
    data = data.filter(s => {
      const nama = String(s.nama || '').toLowerCase();
      const nisn = String(s.nisn || '').toLowerCase();
      const asal = String(s.asalSekolah || '').toLowerCase();
      return nama.includes(search) || nisn.includes(search) || asal.includes(search);
    });
  }

  // 3. Sorting Cepat
  data.sort((a, b) => {
    const ka = String(a.kelas || '');
    const kb = String(b.kelas || '');
    if (ka !== kb) return ka < kb ? -1 : 1;
    
    const na = String(a.nama || '');
    const nb = String(b.nama || '');
    return na < nb ? -1 : (na > nb ? 1 : 0);
  });

  const body = document.getElementById('bodySiswaAdmin');
  if (!body) return;

  // 4. Render Menggunakan DocumentFragment
  if (data.length === 0) {
    body.innerHTML = `<tr><td colspan="9" class="py-8 text-center text-gray-400">Tidak ada data siswa yang cocok</td></tr>`;
    return;
  }

  const fragment = document.createDocumentFragment();
  
  data.forEach(s => {
    const tr = document.createElement('tr');
    tr.className = "border-t dark:border-gray-700/50";

    const isPindahan = s.statusSiswa === 'Pindahan' || !!s.tglMasuk;

    tr.innerHTML = `
      <td class="py-3 px-4 text-center">
        <input type="checkbox" class="cekSiswa" value="${s.id}">
      </td>
      <td class="py-3 px-4 font-medium">${s.nama || '-'}</td>
      <td class="py-3 px-4">${s.nisn || '-'}</td>
      <td class="py-3 px-4">${s.kelas || '-'}</td>
      <td class="py-3 px-4">${s.jk || '-'}</td>
      <td class="py-3 px-4">
        ${isPindahan ? `
          <span class="inline-flex items-center gap-1 px-2.5 py-1 bg-amber-100 dark:bg-amber-900/30 text-amber-800 dark:text-amber-300 rounded-full text-xs font-semibold">
            🔄 Pindahan
          </span>
          <div class="text-[11px] text-gray-500 mt-0.5">Masuk: ${s.tglMasuk || '-'}</div>
        ` : `
          <span class="inline-flex items-center px-2.5 py-1 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-full text-xs">
            Reguler
          </span>
        `}
      </td>
      <td class="py-3 px-4 text-gray-600 dark:text-gray-400">${s.asalSekolah || '-'}</td>
      <td class="py-3 px-4">${s.hpOrangTua || '-'}</td>
      <td class="py-3 px-4 flex gap-1.5">
        <button onclick="lihatDetailSiswa('${s.id}')" class="px-2 py-1 bg-emerald-600 text-white rounded text-xs hover:bg-emerald-700 font-medium">
          👁️ Detail
        </button>
        <button onclick="editSiswa('${s.id}')" class="px-2 py-1 bg-blue-500 text-white rounded text-xs hover:bg-blue-600">
          ✏️ Edit
        </button>
        <button onclick="deleteSiswa('${s.id}')" class="text-red-500 hover:text-red-700 p-1">
          🗑️
        </button>
      </td>
    `;
    fragment.appendChild(tr);
  });

  body.innerHTML = '';
  body.appendChild(fragment);

  if (typeof lucide !== 'undefined' && lucide.createIcons) {
    requestAnimationFrame(() => lucide.createIcons());
  }
}

function exportSiswaLengkapToExcel() {
  let dataSiswa = [...(DB.siswa || [])];

  if (dataSiswa.length === 0) {
    showToast('Tidak ada data siswa untuk diekspor', 'error');
    return;
  }

  const search = (document.getElementById('searchSiswa')?.value || '').toLowerCase();
  const kelas = document.getElementById('filterKelasS')?.value || '';

  if (kelas) dataSiswa = dataSiswa.filter(s => s.kelas === kelas);
  if (search) dataSiswa = dataSiswa.filter(s => (s.nama || '').toLowerCase().includes(search));

  dataSiswa.sort((a, b) => {
    const k = (a.kelas || '').localeCompare(b.kelas || '', 'id', { numeric: true });
    if (k !== 0) return k;
    return (a.nama || '').localeCompare(b.nama || '', 'id');
  });

  const rows = dataSiswa.map((s, index) => {
    const k = (DB.kelengkapanData || []).find(x => String(x.siswaId) === String(s.id)) || {};
    return {
      "No": index + 1,
      "Nama Lengkap": s.nama || '',
      "NISN": s.nisn || '',
      "Kelas": s.kelas || '',
      "Jenis Kelamin": s.jk || '',
      "Status Siswa": s.statusSiswa || 'Reguler',
      "Tanggal Masuk": s.tglMasuk || '',
      "Nama Panggilan": k.namaPanggilan || '',
      "Tempat Lahir": k.tempatLahir || s.tempatLahir || '',
      "Tanggal Lahir": k.tanggalLahir || s.tanggalLahir || '',
      "Agama": k.agama || '',
      "Kewarganegaraan": k.kewarganegaraan || 'Indonesia',
      "Anak Ke": k.anakKe || '',
      "Jml Saudara Kandung": k.jmlKandung || 0,
      "Jml Saudara Tiri": k.jmlTiri || 0,
      "Jml Saudara Angkat": k.jmlAngkat || 0,
      "Status Yatim Piatu": k.statusAnak || '',
      "Bahasa Sehari-hari": k.bahasa || '',
      "Alamat Siswa": k.alamat || s.alamat || '',
      "No HP Siswa Ortu": s.hpOrangTua || k.hp || '',
      "Tinggal Dengan": k.tinggalDengan || '',
      "Jarak Sekolah": k.jarakSekolah || '',
      "Golongan Darah": k.golDarah || '',
      "Penyakit Pernah Diderita": k.penyakit || '',
      "Kelainan Jasmani": k.kelainanJasmani || '',
      "Tinggi Badan (cm)": k.tinggiBadan || '',
      "Berat Badan (kg)": k.beratBadan || '',
      "Asal Sekolah (SMP/MTS)": s.asalSekolah || k.smpAsal || '',
      "No STTB Ijazah": k.noSttb || '',
      "Lama Belajar SMP": k.lamaBelajarSmp || '',
      "Nama Ayah": k.namaAyah || '',
      "Agama Ayah": k.agamaAyah || '',
      "Pekerjaan Ayah": k.pekerjaanAyah || '',
      "No HP Ayah": k.hpAyah || '',
      "Alamat Ayah": k.alamatAyah || '',
      "Penghasilan Ayah": k.penghasilanAyah || '',
      "Status Ayah": k.statusAyah || '',
      "Nama Ibu": k.namaIbu || '',
      "Agama Ibu": k.agamaIbu || '',
      "Pekerjaan Ibu": k.pekerjaanIbu || '',
      "No HP Ibu": k.hpIbu || '',
      "Alamat Ibu": k.alamatIbu || '',
      "Penghasilan Ibu": k.penghasilanIbu || '',
      "Status Ibu": k.statusIbu || ''
    };
  });

  try {
    const worksheet = XLSX.utils.json_to_sheet(rows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Data Induk Siswa");

    const labelKelas = kelas ? `_Kelas_${kelas.replace(/\s+/g, '_')}` : '_Semua_Kelas';
    const timestamp = new Date().toISOString().slice(0, 10);
    
    XLSX.writeFile(workbook, `Data_Induk_Siswa_Lengkap${labelKelas}_${timestamp}.xlsx`);
    showToast('Data Induk Siswa berhasil diekspor', 'success');
  } catch (err) {
    console.error(err);
    showToast('Gagal mengunduh Excel: ' + err.message, 'error');
  }
}

async function importSiswaExcelLengkap(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet);

      if (!json || json.length === 0) {
        showToast("File Excel kosong!", "error");
        return;
      }

      if (!DB.kelengkapanData) DB.kelengkapanData = [];

      let importedCount = 0;

      json.forEach(row => {
        const nama = row["Nama Lengkap"] || row["Nama"];
        const nisn = String(row["NISN"] || '').trim();

        if (nama && nisn) {
          // Cari atau buat siswa
          let siswaExist = DB.siswa.find(s => String(s.nisn) === nisn);
          let siswaId = siswaExist ? siswaExist.id : ('SIS-' + Date.now() + '-' + Math.floor(Math.random()*1000));

          const objSiswa = {
            id: siswaId,

async function saveSiswa(id) {
  const statusSiswa = document.getElementById('fsStatusSiswa').value;
  const tglMasukVal = document.getElementById('fsTglMasuk').value;

  const data = {
    nama: document.getElementById('fsNama').value.trim(),
    nisn: document.getElementById('fsNISN').value.trim(),
    kelas: document.getElementById('fsKelas').value,
    jk: document.getElementById('fsJK').value,
    hpOrangTua: document.getElementById('fsHpOrangTua').value.trim(),
    statusSiswa: statusSiswa,
    tglMasuk: statusSiswa === 'Pindahan' ? tglMasukVal : '',
    asalSekolah: statusSiswa === 'Pindahan' ? document.getElementById('fsAsalSekolah').value.trim() : ''
  };

  if (!data.nama || !data.nisn) {
    showToast('Harap lengkapi nama dan NISN', 'error');
    return;
  }

  if (statusSiswa === 'Pindahan' && !data.tglMasuk) {
    showToast('Tentukan tanggal siswa resmi bergabung/masuk', 'error');
    return;
  }

  if (id) {
    const idx = DB.siswa.findIndex(s => String(s.id) === String(id));
    if (idx > -1) Object.assign(DB.siswa[idx], data);
  } else {
    data.id = 'SIS-' + Date.now();
    DB.siswa.push(data);
  }

  DB.siswa.sort((a, b) => {
    const k = (a.kelas || '').localeCompare(b.kelas || '', 'id', { numeric: true });
    if (k !== 0) return k;
    return (a.nama || '').localeCompare(b.nama || '', 'id');
  });

  addAuditLog(id ? 'Edit Data Siswa' : 'Tambah Siswa Baru');
  await simpanDataKeStorage("siswa");
  showToast('Data siswa berhasil disimpan', 'success');
  renderAdminSiswa();
}

async function deleteSiswa(id) {
  if (!confirm("Apakah Anda yakin ingin menghapus siswa ini beserta seluruh riwayatnya?")) return;
  
  const idx = DB.siswa.findIndex(s => String(s.id) === String(id));
  if (idx > -1) {
    DB.siswa.splice(idx, 1);
    
    if (DB.kehadiran && Array.isArray(DB.kehadiran)) {
      DB.kehadiran = DB.kehadiran.filter(k => String(k.siswaId) !== String(id));
    }
    if (DB.pelanggaran && Array.isArray(DB.pelanggaran)) {
      DB.pelanggaran = DB.pelanggaran.filter(p => String(p.siswaId) !== String(id) && String(p.idSiswa) !== String(id));
    }
    if (DB.penebusan_poin && Array.isArray(DB.penebusan_poin)) {
      DB.penebusan_poin = DB.penebusan_poin.filter(p => String(p.siswaId) !== String(id));
    }
    if (DB.kelengkapanData && Array.isArray(DB.kelengkapanData)) {
      DB.kelengkapanData = DB.kelengkapanData.filter(k => String(k.siswaId) !== String(id));
    }

    await simpanDataKeStorage("siswa");
    await simpanDataKeStorage("kehadiran");
    await simpanDataKeStorage("pelanggaran");
    await simpanDataKeStorage("penebusan_poin");
    await simpanDataKeStorage("kelengkapanData");
    
    addAuditLog('Hapus Siswa');
    showToast('Data siswa dan riwayatnya berhasil dihapus', 'success');
    renderAdminSiswa(); 
  }
}

  DB.siswa = DB.siswa.filter(s => !ids.includes(String(s.id)));
  DB.kehadiran = (DB.kehadiran || []).filter(k => !ids.includes(String(k.siswaId)));
  DB.pelanggaran = (DB.pelanggaran || []).filter(p => !ids.includes(String(p.siswaId)) && !ids.includes(String(p.idSiswa)));

  DB.kelengkapanData = (DB.kelengkapanData || []).filter(k => !ids.includes(String(k.siswaId)));

  await simpanDataKeStorage("siswa");
  await simpanDataKeStorage("kehadiran");
  await simpanDataKeStorage("pelanggaran");
  await simpanDataKeStorage("penebusan_poin");
  await simpanDataKeStorage("kelengkapanData");

  addAuditLog("Hapus Massal Siswa (" + ids.length + ")");

    // ====================================================
    // FUNGSI IMPOR DATA SEKRETARIS DARI CSV
    // ====================================================
    function imporSekretarisCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const teks = e.target.result;
        const baris = teks.split("\n");

        if (baris.length <= 1) {
          showToast('File CSV kosong atau tidak valid', 'error');
          return;
        }

        let jumlahBerhasil = 0;
        const waktuSekarang = Date.now();

        for (let i = 1; i < baris.length; i++) {
          const dataBaris = baris[i].trim();
          if (!dataBaris) continue; // Lewati baris kosong

          // Memisahkan kolom dengan aman menggunakan regex koma
          const kolom = dataBaris.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

          if (kolom.length >= 3) {
            const nama_baru = kolom[0] ? kolom[0].replace(/["']/g, "").trim() : "";
            const kelas_baru = kolom[1] ? kolom[1].replace(/["']/g, "").trim() : "";
            const user_baru = kolom[2] ? kolom[2].replace(/["']/g, "").trim() : "";
            const pass_baru = kolom[3] ? kolom[3].replace(/["']/g, "").trim() : "123456"; // default jika kosong

            // Validasi duplikasi username (case-insensitive) agar tidak merusak sistem login
            const adaDuplikat = DB.users.some(x => x.username.trim().toLowerCase() === user_baru.toLowerCase());

            if (!adaDuplikat && nama_baru !== "" && user_baru !== "") {
              DB.users.push({
                id: waktuSekarang + i, // ID berupa angka unik seperti Date.now() di aplikasi Anda
                name: nama_baru,
                kelas: kelas_baru,
                username: user_baru,
                password: pass_baru,
                role: 'sekretaris'
              });
              jumlahBerhasil++;
            }
          }
        }

        if (jumlahBerhasil > 0) {
          // Otomatisasi penyimpanan mengikuti sistem simpan aplikasi Anda
          if (typeof saveDB === 'function') {
            saveDB();

// =========================================================================
// ⚡ FUNGSI PEMBANTU BARU: AUTO-COMPRESS IMAGES (MENJAGA KUOTA STORAGE AMAN)
// =========================================================================
function kompresGambarBase64(dataUrl, maxWidth, maxHeight, callback) {
  const img = new Image();
  img.onload = function() {
    let width = img.width;
    let height = img.height;

    // Hitung proporsi aspek rasio agar logo/ttd tidak gepeng
    if (width > height) {
      if (width > maxWidth) {
        height *= maxWidth / width;
        width = maxWidth;
      }
    } else {
      if (height > maxHeight) {
        width *= maxHeight / height;
        height = maxHeight;
      }
    }

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);

    // Menggunakan format image/png agar background transparan TTD & Cap tetap terjaga
    const compressedDataUrl = canvas.toDataURL('image/png');
    callback(compressedDataUrl);
  };
  img.src = dataUrl;
}

// =========================================================================
// PERBAIKAN FUNGSI: UPLOAD LOGO DENGAN ENGINE KOMPRESI OTOMATIS
// =========================================================================
function uploadLogo(e, type) {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = event => {
    const rawDataUrl = event.target.result;
    
    // Perkecil ukuran ke max 250px (Sangat pas dan tajam untuk space kartu pelajar)
    kompresGambarBase64(rawDataUrl, 250, 250, function(compressedDataUrl) {
      
      if (type === 'sekolah') {
        DB.identitas.logoSekolah = compressedDataUrl;
        document.getElementById('logoSekolah').innerHTML = `<img src="${compressedDataUrl}" alt="Logo Sekolah" class="w-full h-full object-contain p-1">`;
      } else if (type === 'provinsi') {
        DB.identitas.logoProvinsi = compressedDataUrl;
        document.getElementById('logoProvinsi').innerHTML = `<img src="${compressedDataUrl}" alt="Logo Provinsi" class="w-full h-full object-contain p-1">`;
      } else if (type === 'ttd') {
        DB.identitas.ttdKepsek = compressedDataUrl;
        document.getElementById('ttdKepsek').innerHTML = `<img src="${compressedDataUrl}" alt="TTD Kepsek" class="w-full h-full object-contain p-1">`;
      } else if (type === 'cap') {
        DB.identitas.capSekolah = compressedDataUrl;
        document.getElementById('capSekolah').innerHTML = `<img src="${compressedDataUrl}" alt="Cap Sekolah" class="w-full h-full object-contain p-1">`;
      }

      // Kunci data gambar hasil kompresi yang super ringan ke localStorage browser
      try {
        localStorage.setItem('sik_identitas_lokal', JSON.stringify(DB.identitas));
        if (typeof showToast === 'function') {
          showToast('Berkas berhasil diunggah & dikompres otomatis!', 'success');
        }
      } catch (err) {
        console.error("Gagal menulis lokal storage:", err);
        alert("Gagal menyimpan gambar secara lokal. Pastikan gambar tidak terlalu kompleks.");
      }
    });
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

        const aturanTerpilih = DB.tatatertib.find(t => String(t.id) === String(jenisId) || String(t.kode) === String(jenisId));

        if (!aturanTerpilih) {
          showToast('Aturan tata tertib tidak valid atau tidak ditemukan di sistem!', 'error');
          return;
        }

        const namaPelanggaran = aturanTerpilih.nama || aturanTerpilih.deskripsi || aturanTerpilih.jenis || "Pelanggaran Tanpa Nama";
        const bobotPoin = parseInt(aturanTerpilih.poin) || 0;
        const kategoriPelanggaran = aturanTerpilih.kategori || "Ringan";

        // 🌟 2. CARI DATA SISWA UNTUK MENYERTAKAN NAMA DAN KELASNYA AGAR FIREBASE LENGKAP
        const siswaTerpilih = DB.siswa ? DB.siswa.find(s => String(s.id) === String(siswaId)) : null;
        const namaSiswa = siswaTerpilih ? siswaTerpilih.nama : "Siswa Tidak Dikenal";
        const kelasSiswa = siswaTerpilih ? siswaTerpilih.kelas : "-";

        // 🌟 PROTEKSI DOUBLE INPUT: Ambil elemen tombol simpan dan kunci seketika
        const btnSimpan = document.querySelector("button[onclick='simpanPelanggaran()']");
        if (btnSimpan) {
          btnSimpan.disabled = true;
          btnSimpan.innerText = "⏳ Menyimpan...";
          btnSimpan.classList.add("opacity-50", "cursor-not-allowed");
        }

        // 🌟 3. BUAT OBJEK DATA YANG LENGKAP DENGAN NAMA DAN BOBOT POIN ASLI
        const pelanggaranBaru = {
          id: 'P-' + Date.now(),
          siswaId: siswaId,
          namaSiswa: namaSiswa,         
          kelas: kelasSiswa,            
          jenisId: jenisId,
          namaPelanggaran: namaPelanggaran, 
          poin: bobotPoin,                  
          kategori: kategoriPelanggaran,    
          tanggal: tanggal,
          guru: guru.trim()
        };

        if (!DB.pelanggaran) { DB.pelanggaran = []; }
        DB.pelanggaran.push(pelanggaranBaru);
        const key = pelanggaranBaru.id;

        // 🌟 4. UPDATE JUGA AKUMULASI POIN SISWA DI LOKAL STATE AGAR VISUAL LANGSUNG BERUBAH
        if (siswaTerpilih) {
          siswaTerpilih.poinPelanggaranDasar = (siswaTerpilih.poinPelanggaranDasar || 0) + bobotPoin;
          siswaTerpilih.poin = (siswaTerpilih.poin || 0) - bobotPoin; 
        }

        // Fungsi pembantu untuk mengembalikan kondisi tombol jika gagal
        const aktifkanTombolKembali = () => {
          if (btnSimpan) {
            btnSimpan.disabled = false;
            btnSimpan.innerText = "Simpan";
            btnSimpan.classList.remove("opacity-50", "cursor-not-allowed");
          }
        };

        // 🌟 5. REVISI DI SINI: PROSES SIMPAN INSTAN TANPA UPLOAD ULANG SATU STORAGE SISWA
        let targetDb = typeof database !== 'undefined' ? database : (window.firebase?.apps?.[0]?.database());

        if (targetDb) {
          const updates = {};
          
          // Simpan data pelanggaran baru ke jalurnya
          updates["kesiswaan_cloud/pelanggaran/" + key] = pelanggaranBaru;
          
          // Update poin siswa yang bersangkutan ke jalurnya secara spesifik (tidak mengunggah ulang semua siswa)
          if (siswaTerpilih) {
            updates["kesiswaan_cloud/siswa/" + siswaId + "/poinPelanggaranDasar"] = siswaTerpilih.poinPelanggaranDasar;
            updates["kesiswaan_cloud/siswa/" + siswaId + "/poin"] = siswaTerpilih.poin;
          }

          // Kirim perubahan sekaligus ke Firebase Realtime Database
          targetDb.ref().update(updates)
          .then(() => {
            console.log("Data pelanggaran berhasil disimpan.");
            showToast("Data pelanggaran berhasil disimpan!", "success");
            renderInputPelanggaran(); // Reset form otomatis
          })
          .catch(err => {
            console.error(err);
            showToast("Gagal menyimpan ke server.", "error");
            aktifkanTombolKembali();
          });
        } else {
          showToast('Firebase tidak siap. Data hanya tersimpan lokal.', 'warning');
          renderInputPelanggaran();
        }
      }
