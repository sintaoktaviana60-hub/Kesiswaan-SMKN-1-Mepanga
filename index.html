function bukaDropdownKPSiswa() {
  const dropdown = document.getElementById('dropdownKPSiswa');
  if (!dropdown) return;

  dropdown.classList.remove('hidden');

  if (document.getElementById('kpCariSiswa').value.trim() === '') {
    filterKPSiswa();
  }
}

function filterKPSiswa() {
  const kataKunci = document.getElementById('kpCariSiswa').value.toLowerCase().trim();
  const dropdown = document.getElementById('dropdownKPSiswa');
  if (!dropdown) return;

  const user = (typeof currentUser !== 'undefined' && currentUser) ? currentUser : {};

  // Inisialisasi DB jika belum ada
  if (typeof DB === 'undefined') window.DB = { siswa: [], kreditPoinMaster: [] };

  let dataSiswaMentah = DB.siswa || [];

  if (user.role === 'walas') {
    const kelasBinaanSaya = (user.kelasBinaan || '').toUpperCase();
    dataSiswaMentah = dataSiswaMentah.filter(s => (s.kelas || '').toUpperCase() === kelasBinaanSaya);
  }

  const hasilFilter = dataSiswaMentah.filter(s =>
    (s.nama || '').toLowerCase().includes(kataKunci) ||
    (s.kelas || '').toLowerCase().includes(kataKunci)
  );

  if (hasilFilter.length === 0) {
    dropdown.innerHTML = `
      <div class="p-3 text-xs text-gray-400 italic text-center">
        Siswa tidak ditemukan
      </div>
    `;
    return;
  }

  dropdown.innerHTML = hasilFilter.map(s => `
    <div
      onclick="pilihKPSiswa('${s.id}','${s.nama}','${s.kelas || '-'}')"
      class="p-3 text-sm hover:bg-blue-50 dark:hover:bg-blue-900/30 cursor-pointer flex justify-between items-center transition"
    >
      <span class="font-medium text-gray-900 dark:text-white">${s.nama}</span>
      <span class="text-xs px-2 py-0.5 bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400 rounded-md font-mono">
        ${s.kelas || '-'}
      </span>
    </div>
  `).join('');
}

function pilihKPSiswa(id, nama, kelas) {
  document.getElementById('kpCariSiswa').value = `${nama} (${kelas})`;
  document.getElementById('kpSiswa').value = id;
  document.getElementById('dropdownKPSiswa').classList.add('hidden');

  const s = (DB.siswa || []).find(x => String(x.id) === String(id));
  document.getElementById('kpNISN').value = s ? (s.nisn || '-') : '-';
  document.getElementById('kpKelas').value = s ? (s.kelas || '-') : '-';
}

function bukaDropdownKreditPoin() {
  const dropdown = document.getElementById('dropdownKreditPoin');
  if (!dropdown) return;
  dropdown.classList.remove('hidden');

  if (document.getElementById('kpCariJenis').value.trim() === '') {
    filterKreditPoin();
  }
}

function filterKreditPoin() {
  const keyword = document.getElementById('kpCariJenis').value.toLowerCase().trim();
  const dropdown = document.getElementById('dropdownKreditPoin');
  if (!dropdown) return;

  if (typeof DB === 'undefined') window.DB = { siswa: [], kreditPoinMaster: [] };

  const hasil = (DB.kreditPoinMaster || []).filter(k =>
    (k.nama || '').toLowerCase().includes(keyword) ||
    (k.kode || '').toLowerCase().includes(keyword)
  );

  if (hasil.length === 0) {
    dropdown.innerHTML = `
      <div class="p-3 text-center text-xs text-gray-400">
        Kredit poin tidak ditemukan
      </div>
    `;
    return;
  }

  dropdown.innerHTML = hasil.map(k => `
    <div
      onclick="pilihKreditPoin('${k.kode || k.id}','${k.nama}',${k.poin || 0})"
      class="p-3 cursor-pointer hover:bg-blue-50 dark:hover:bg-blue-900/30 flex justify-between items-center"
    >
      <div>
        <div class="font-medium text-gray-900 dark:text-white text-sm">${k.nama}</div>
        <div class="text-xs text-gray-400">${k.kode || '-'}</div>
      </div>
      <span class="px-2 py-1 bg-green-100 text-green-700 dark:bg-green-950 dark:text-green-400 rounded text-xs font-bold">
        +${k.poin || 0}
      </span>
    </div>
  `).join('');
}

function pilihKreditPoin(kode, nama, poin) {
  document.getElementById('kpCariJenis').value = nama;
  document.getElementById('kpJenis').value = kode;
  document.getElementById('kpPoin').value = poin;
  document.getElementById('dropdownKreditPoin').classList.add('hidden');
}

// SIMPAN DATA
async function simpanKreditPoin() {
  const siswaId = document.getElementById('kpSiswa').value;
  const kreditId = document.getElementById('kpJenis').value;
  const poin = parseInt(document.getElementById('kpPoin').value) || 0;
  const tanggal = document.getElementById('kpTanggal').value;
  const deskripsi = document.getElementById('kpDeskripsi').value.trim();
  const checklist = document.getElementById('kpChecklist').checked;

  const user = (typeof currentUser !== 'undefined' && currentUser) ? currentUser : { name: 'Admin', role: 'admin' };

  if (!siswaId) {
    if (typeof showToast === 'function') showToast('Pilih siswa terlebih dahulu', 'error');
    else alert('Pilih siswa terlebih dahulu');
    return;
  }

  if (!kreditId) {
    if (typeof showToast === 'function') showToast('Pilih kredit poin terlebih dahulu', 'error');
    else alert('Pilih kredit poin terlebih dahulu');
    return;
  }

  if (!deskripsi) {
    if (typeof showToast === 'function') showToast('Deskripsi kegiatan wajib diisi', 'error');
    else alert('Deskripsi kegiatan wajib diisi');
    return;
  }

  if (!checklist) {
    if (typeof showToast === 'function') showToast('Centang pernyataan penginput', 'error');
    else alert('Centang pernyataan penginput');
    return;
  }

  const siswa = (DB.siswa || []).find(s => String(s.id) === String(siswaId));
  const kredit = (DB.kreditPoinMaster || []).find(k =>
    String(k.kode) === String(kreditId) || String(k.id) === String(kreditId)
  );

  if (!siswa || !kredit) {
    if (typeof showToast === 'function') showToast('Data siswa atau kredit poin tidak ditemukan', 'error');
    else alert('Data siswa atau kredit poin tidak ditemukan');
    return;
  }

  // Proteksi Akses Walas
  if (user.role === 'walas') {
    const kelasBinaanSaya = (user.kelasBinaan || '').toUpperCase();
    if ((siswa.kelas || '').toUpperCase() !== kelasBinaanSaya) {
      if (typeof showToast === 'function') showToast('Akses Ditolak! Anda tidak diizinkan memberi poin ke siswa kelas lain.', 'error');
      else alert('Akses Ditolak! Anda tidak diizinkan memberi poin ke siswa kelas lain.');
      return;
    }
  }

  const dataBaru = {
    id: 'KP-' + Date.now(),
    siswaId: siswa.id,
    nama: siswa.nama,
    nisn: siswa.nisn,
    kelas: siswa.kelas,
    kreditId: kredit.kode || kredit.id,
    namaKredit: kredit.nama,
    poin: poin,
    deskripsi: deskripsi,
    tanggal: tanggal,
    penginput: user.name,
    rolePenginput: user.role
  };

  if (!DB.kreditPoin) DB.kreditPoin = [];
  DB.kreditPoin.push(dataBaru);

  // Update poin lokal
  siswa.poin = (siswa.poin || 0) + poin;

  // 🔥 PERBAIKAN DENGAN TRY-CATCH UNTUK MENGATASI ERROR FIREBASE
  try {
    if (typeof simpanDataKeStorage === 'function') {
      await simpanDataKeStorage("kreditPoin");
    } else {
      // Fallback simpan ke LocalStorage jika fungsi simpanDataKeStorage tidak ada
      localStorage.setItem('kreditPoin', JSON.stringify(DB.kreditPoin));
    }
    if (typeof showToast === 'function') showToast('Kredit poin berhasil disimpan', 'success');
  } catch (err) {
    console.warn("Peringatan simpan online gagal, menyimpan ke LocalStorage lokal:", err);
    // Simpan ke LocalStorage lokal agar data tidak hilang
    localStorage.setItem('kreditPoin', JSON.stringify(DB.kreditPoin));
    if (typeof showToast === 'function') showToast('Tersimpan di Lokal (Koneksi Firebase Belum Siap)', 'warning');
  }

  // Reset form setelah simpan
  renderInputKreditPoin();
}

function getSelectedKelasKehadiran() {
  if (currentUser && currentUser.role === 'admin') {
    const elKelas = document.getElementById('khKelasSelect');
    if (elKelas) return elKelas.value;
    const daftarKelas = [...new Set((DB.siswa || []).map(s => s.kelas))].sort();
    return daftarKelas[0] || '';
  }
  return currentUser ? currentUser.kelas : '';
}

  const mc = document.getElementById('mainContent');

  if (window.dashboardInterval) clearInterval(window.dashboardInterval);

  const isAdmin = currentUser && currentUser.role === 'admin';
  const daftarKelas = [...new Set((DB.siswa || []).map(s => s.kelas))].sort();
  
  let myKelas = getSelectedKelasKehadiran();
  if (isAdmin && !myKelas && daftarKelas.length > 0) {
    myKelas = daftarKelas[0];
  }

function loadKehadiranFromFirebase() {
  firebase.database().ref("kesiswaan_cloud/kehadiran").on("value", (snapshot) => {
    const data = snapshot.val();

    if (data) {
      if (Array.isArray(data)) {
        DB.kehadiran = data.filter(item => item !== null);
      } else {
        DB.kehadiran = Object.values(data);
      }
    } else {
      DB.kehadiran = [];
    }

    console.log("Kehadiran berhasil dimuat dari Firebase:", DB.kehadiran);

    if (typeof muatUlangStatusAbsenSekre === "function") {
      muatUlangStatusAbsenSekre();
    }

    if (typeof hitungUlangPoinDashboard === "function") {
      hitungUlangPoinDashboard();
    }

    if (typeof currentPage !== 'undefined' && currentPage === 'dashboard') {
      if (typeof renderDashboardKesiswaanBaru === "function") {
        renderDashboardKesiswaanBaru(); 
      } else if (typeof renderPage === "function") {
        renderPage('dashboard');
      }
    }
  });
}

function loadPenebusanPoinFromFirebase() {
  firebase.database().ref("kesiswaan_cloud/penebusan_poin").on("value", (snapshot) => {
    const data = snapshot.val();

    if (data) {
      DB.penebusan_poin = Object.values(data);
    } else {
      DB.penebusan_poin = [];
    }

    console.log("Data Penebusan Khusus berhasil dimuat dari Firebase:", DB.penebusan_poin);

    if (typeof hitungUlangPoinDashboard === "function") {

    if (typeof currentPage !== 'undefined' && typeof renderPage === "function") {
      renderPage(currentPage);
    }
  });
}

// ===== PROSES SIMPAN KEHADIRAN =====
let isSavingKehadiran = false;

function simpanKehadiran() {
  if (isSavingKehadiran) return;

  const tglInput = document.getElementById('khTanggal')?.value;

  if (!tglInput) {
    if (typeof showToast === 'function') showToast('Pilih tanggal terlebih dahulu!', 'danger');
    return;
  }

  // 🔥 PERBAIKAN KRUSIAL: Menggunakan helper agar Admin mengambil kelas dari dropdown, bukan currentUser.kelas
  const myKelas = getSelectedKelasKehadiran();

  if (!myKelas) {
    if (typeof showToast === 'function') showToast('Pilih kelas terlebih dahulu!', 'danger');
    return;
  }

  const siswaKelas = (DB && DB.siswa) ? DB.siswa.filter(s => s.kelas === myKelas) : [];

  if (!Array.isArray(DB.hariAktif)) DB.hariAktif = [];
  const sudahAda = DB.hariAktif.some(h => h.tanggal === tglInput && h.kelas === myKelas);
  if (!sudahAda) {
    DB.hariAktif.push({ tanggal: tglInput, kelas: myKelas });
  }

  if (!Array.isArray(DB.kehadiran)) DB.kehadiran = [];

  // Hapus data tanggal ini untuk kelas bersangkutan agar tidak duplikat
  DB.kehadiran = DB.kehadiran.filter(k => {
    const s = DB.siswa.find(x => String(x.id) === String(k.siswaId));
    return !(s && s.kelas === myKelas && k.tanggal === tglInput);
  });

  // Ambil pilihan dari dropdown
  siswaKelas.forEach(s => {
    const elSelect = document.getElementById(`kh-${s.id}`);
    if (!elSelect) return;

    const statusVal = elSelect.value.toLowerCase();
    if (statusVal !== '-') {
      DB.kehadiran.push({
        id: 'KH_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        siswaId: s.id,
        tanggal: tglInput,
        status: statusVal
      });
    }
  });

  // Jalankan proses simpan langsung
  simpanKehadiranDanSync();
}

function simpanKehadiranDanSync() {
  if (isSavingKehadiran) return;
  isSavingKehadiran = true;

  // Ubah tampilan tombol menjadi loading
  const btnSimpan = document.querySelector("button[onclick='simpanKehadiran()']");
  if (btnSimpan) {
    btnSimpan.disabled = true;
    btnSimpan.innerHTML = '⏳ Menyimpan...';
  }

  // Simpan LANGSUNG ke Firebase Cloud
  const updates = {};
  updates["kesiswaan_cloud/kehadiran"] = DB.kehadiran || [];
  updates["kesiswaan_cloud/hariAktif"] = DB.hariAktif || [];

  firebase.database().ref().update(updates)
    .then(() => {
      isSavingKehadiran = false;
      if (btnSimpan) {
        btnSimpan.disabled = false;
        btnSimpan.innerHTML = '💾 Simpan Kehadiran';
      }

      if (typeof showToast === "function") {
        showToast('Kehadiran berhasil disimpan ke Cloud!', 'success');
      }
    })
    .catch(err => {
      isSavingKehadiran = false;
      if (btnSimpan) {
        btnSimpan.disabled = false;
        btnSimpan.innerHTML = '💾 Simpan Kehadiran';
      }
      console.error("Firebase Error:", err);
      if (typeof showToast === "function") showToast('Gagal menyimpan ke Firebase', 'danger');
    });
}
          
function hitungUlangPoinDashboard() {
  if (!DB.siswa) return;

  DB.siswa.forEach(siswa => {
    let totalPoinTataTertib = 0;
    let totalPoinAbsensi = 0;
    let totalPenebusanKhusus = 0; // 🔥 Variabel baru untuk penampung pemulihan

    // ==========================
    // HITUNG POIN PELANGGARAN
    // ==========================
    if (DB.pelanggaran) {
      const pelanggaranSiswa = DB.pelanggaran.filter(p =>
        String(p.siswaId) === String(siswa.id) ||
        String(p.idSiswa) === String(siswa.id)
      );

      pelanggaranSiswa.forEach(p => {
        const tt = (DB.tatatertib || []).find(x =>
          x.id == p.jenisId ||
          x.kode == p.jenisId
        );
        totalPoinTataTertib += tt ? Number(tt.poin || 0) : Number(p.poin || 0);
      });
    }

    // ==========================
    // HITUNG POIN ABSENSI
    // ==========================
    if (DB.kehadiran) {
      const logSiswa = DB.kehadiran.filter(k =>
        String(k.siswaId).trim() == String(siswa.id).trim()
      );

      logSiswa.forEach(k => {
        const st = String(k.status).toUpperCase().trim();
        if (st === 'A' || st === 'ALFA' || st === 'ALPA') {
          totalPoinAbsensi += 3;
        } else if (st === 'I' || st === 'IZIN') {
          totalPoinAbsensi += 1;
        } else if (st === 'S' || st === 'SAKIT') {
          totalPoinAbsensi += 0.5;
        }
      });
    }

    // ==========================================================
    // 🔥 BARU: HITUNG PENEBUSAN KHUSUS (DARI LACI PENEBUSAN)
    // ==========================================================
    if (DB.penebusan_poin) {
      const penebusanSiswa = DB.penebusan_poin.filter(p => 
        String(p.siswaId) === String(siswa.id)
      );
      
      penebusanSiswa.forEach(p => {
        totalPenebusanKhusus += Number(p.poinPemulihan || 0);
      });
    }

    // ==========================================================
    // SIMPAN HASIL KE STRUKTUR DATA SISWA
    // ==========================================================
    siswa.poinAbsen = totalPoinAbsensi;
    siswa.poinPelanggaranDasar = totalPoinTataTertib;
    siswa.totalPenebusanKhusus = totalPenebusanKhusus; // 🔥 Simpan record penebusan

    // 🧮 RUMUS BARU: Dimulai dari 0, Dosa dikurangi (-), Penebusan ditambah (+)
    siswa.poin = 0 - totalPoinTataTertib - totalPoinAbsensi + totalPenebusanKhusus;
  });

  // Sinkronisasikan ke LocalStorage bawaan aplikasi Anda
  localStorage.setItem('kesiswaan_db', JSON.stringify(DB));

  // Jalankan render dashboard bawaan aplikasi Anda
  if (typeof renderDashboard === "function") {
    renderDashboard();
  }
}

    function exportData(type, format) {
      let content = '', filename = '';

      if (type === 'pelanggaran') {
        content = 'Nama,NISN,Kelas,Tanggal,Pelanggaran,Poin\n';
        DB.pelanggaran.forEach(p => {
          const s = DB.siswa.find(x => x.id === p.siswaId);
          const tt = DB.tatatertib.find(x => x.id === p.jenisId);
          if (s && tt) content += `${s.nama},${s.nisn},${s.kelas},${p.tanggal},${tt.jenis},${tt.poin}\n`;
        });
        filename = 'Rekap_Pelanggaran';
      }
      else if (type === 'kehadiran') {
        content = 'Nama,Kelas,Sakit,Izin,Alpa,Total\n';
        DB.siswa.forEach(s => {
          const kh = DB.kehadiran.filter(k => k.siswaId === s.id);
          const sakit = kh.filter(k => k.status === 'sakit').length;
          const izin = kh.filter(k => k.status === 'izin').length;
          const alpa = kh.filter(k => k.status === 'alpa').length;
          const total = sakit + izin + alpa;
          if (total > 0) content += `${s.nama},${s.kelas},${sakit},${izin},${alpa},${total}\n`;
        });
        filename = 'Rekap_Kehadiran';
      }
      else if (type === 'kehadiran-sekre') {
        const myKelas = currentUser.kelas;
        content = 'Nama,Sakit,Izin,Alpa,Total\n';
        DB.siswa.filter(s => s.kelas === myKelas).forEach(s => {
          const kh = DB.kehadiran.filter(k => k.siswaId === s.id);
          const sakit = kh.filter(k => k.status === 'sakit').length;
          const izin = kh.filter(k => k.status === 'izin').length;
          const alpa = kh.filter(k => k.status === 'alpa').length;
          const total = sakit + izin + alpa;
          if (total > 0) content += `${s.nama},${sakit},${izin},${alpa},${total}\n`;
        });
        filename = 'Rekap_Kehadiran_' + myKelas;
      }

      const blob = new Blob([content], { type: format === 'excel' ? 'text/csv;charset=utf-8;' : 'text/csv' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename + '.' + (format === 'excel' ? 'csv' : 'csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
      showToast(`Export ${format.toUpperCase()} berhasil diunduh`, 'success');
    }

    function dalamPeriodeAktif(tanggal) {

  if (!tanggal) return false;

  const awal = DB.identitas?.tglAwalPembelajaran;
  const akhir = DB.identitas?.tglAkhirPembelajaran;

  if (!awal || !akhir) return true;

  const t = new Date(tanggal);
  const a = new Date(awal);
  const b = new Date(akhir);

  return t >= a && t <= b;
}

function hitungHariAktifSekolah(){

  const awal =
    DB.identitas?.tglAwalPembelajaran;

  const akhir =
    DB.identitas?.tglAkhirPembelajaran;

  if(!awal || !akhir) return 0;

  let total = 0;

  let tgl = new Date(awal);
  const batas = new Date(akhir);

  while(tgl <= batas){

    // Minggu libur
    if(tgl.getDay() !== 0){
      total++;
    }

    tgl.setDate(
      tgl.getDate() + 1
    );
  }

  return total;
}

function getTotalHariAktif(){

  return (DB.hariAktif || []).length;

}

    function hitungPoinSiswa(siswaId){

      const siswa =
        DB.siswa.find(
          s => String(s.id) === String(siswaId)
        );

      if(!siswa){
        return {
          totalKredit:0,
          totalPelanggaran:0,
          sisaPoin:0
        };
      }

      const totalKredit =
        (DB.kreditPoin || [])
          .filter(k =>
            String(k.siswaId) === String(siswaId)
          )
          .reduce(
            (a,b)=>a + Number(b.poin || 0),
            0
          );

      const totalPelanggaran =
        Number(siswa.poinAbsen || 0) +
        Number(siswa.poinPelanggaranDasar || 0);

      const sisaPoin =
        totalKredit - totalPelanggaran;

      return {
        totalKredit,
        totalPelanggaran,
        sisaPoin
      };

    }

// 1. UBAH PROSES KONVERSI: Simpan langsung ke memori DB saat user memilih file
function prosesKonversiBase64(input, elementIdPreview) {
  if (input.files && input.files[0]) {
    const file = input.files[0];
    
    // VALIDASI UKURAN: Jika di atas 500KB, beri peringatan agar Firebase tidak menolak
    if (file.size > 500 * 1024) {
      alert("Ukuran file terlalu besar! Harap gunakan file di bawah 500 KB agar tersimpan permanen di cloud.");
      input.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      // Tampilkan preview di layar
      const prevEl = document.getElementById(elementIdPreview);
      if (prevEl) prevEl.src = e.target.result;
      
      // Masukkan langsung ke objek DB sesuai jenisnya agar aman saat disimpan
      if (!DB.identitas) DB.identitas = {};
      if (elementIdPreview === 'prevLogo') DB.identitas.logoSekolah = e.target.result;
      if (elementIdPreview === 'prevTtd') DB.identitas.ttdKepsek = e.target.result;
      if (elementIdPreview === 'prevCap') DB.identitas.capSekolah = e.target.result;
    }
    reader.readAsDataURL(file);
  }
}

async function simpanIdentitasSekolahLokal() {
  const k = document.getElementById('editKepsekName');
  const nk = document.getElementById('editKepsekNip');
  const w = document.getElementById('editWakasekName');
  const nw = document.getElementById('editWakasekNip');
  const ns = document.getElementById('editNamaSekolah'); 

  if (k && nk && w && nw) {
    if (!DB.identitas) DB.identitas = {};

    // Ambil data teks dari input form
    DB.identitas.kepsek = k.value;
    DB.identitas.nipKepsek = nk.value;
    DB.identitas.wakasek = w.value;
    DB.identitas.nipWakasek = nw.value;
    if (ns) DB.identitas.namaSekolah = ns.value;

    // Double check untuk memastikan data gambar di preview masuk ke objek DB
    const prevLogo = document.getElementById('prevLogo');
    const prevTtd = document.getElementById('prevTtd');
    const prevCap = document.getElementById('prevCap');

    if (prevLogo && prevLogo.src.startsWith('data:image')) DB.identitas.logoSekolah = prevLogo.src;
    if (prevTtd && prevTtd.src.startsWith('data:image')) DB.identitas.ttdKepsek = prevTtd.src;
    if (prevCap && prevCap.src.startsWith('data:image')) DB.identitas.capSekolah = prevCap.src;

    // Simpan ke LocalStorage browser sebagai backup cadangan cepat
    localStorage.setItem('sik_identitas_lokal', JSON.stringify(DB.identitas));
    
    // DETEKSI UTAMA ENGINE FIREBASE SEPERTI DI IDENTITAS LOAD ANDA
    let targetDb = null;
    if (typeof database !== 'undefined') {
      targetDb = database;
    } else if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
      targetDb = window.firebase.apps[0].database();
    }

    if (targetDb) {
      try {
        // Kunci data langsung masuk ke dalam struktur 'kesiswaan_cloud/identitas'
        await targetDb.ref('kesiswaan_cloud/identitas').set(DB.identitas);
        
        alert("Identitas dan berkas gambar sekolah BERHASIL disimpan permanen ke Cloud Database!");
        renderPage('admin-identitas'); 
        
      } catch (error) {
        console.error("Firebase Write Error:", error);
        alert("Gagal mengunggah ke cloud. Pastikan ukuran file gambar Anda kecil (di bawah 500KB).");
      }
    } else {
      alert("Identitas disimpan secara lokal di browser ini (Firebase Offline).");
      renderPage('admin-identitas');
    }

  } else {
    alert("Gagal menyimpan. Kolom input tidak ditemukan.");
  }
}

// --- FUNGSI HELPER SINKRONISASI FIREBASE ---
async function simpanTataTertibKeFirebase() {
  try {
    let dbRef = null;
    if (typeof firebase !== 'undefined' && firebase.database) {
      dbRef = firebase.database().ref('kesiswaan_cloud/tatatertib');
    } else if (window.dbRefTataTertib) {
      dbRef = window.dbRefTataTertib;
    }

    if (dbRef) {
      await dbRef.set(DB.tatatertib);
    } else {
      setTimeout(() => {
        if (typeof firebase !== 'undefined' && firebase.database) {
          firebase.database().ref('kesiswaan_cloud/tatatertib').set(DB.tatatertib);
        }
      }, 1000);
    }
  } catch (err) {
    console.error("Gagal sinkronkan Tata Tertib ke Firebase:", err);
    showToast('Gagal terhubung ke Cloud: ' + err.message, 'error');
  }
}

// --- FUNGSI TAMBAH MANUAL ---
async function tambahTataTertibManual(event) {
  event.preventDefault();

  const inputKode = document.getElementById('ttKode');
  const inputDeskripsi = document.getElementById('ttDeskripsi');
  const inputPoin = document.getElementById('ttPoin');

  const kode = inputKode.value.trim().toUpperCase();
  const deskripsi = inputDeskripsi.value.trim();
  const poin = parseInt(inputPoin.value) || 0;

  if (!kode || !deskripsi) {
    showToast('Kode dan Deskripsi harus diisi!', 'error');
    return;
  }

  // Cek duplikasi kode
  const isDuplicate = DB.tatatertib.some(t => (t.kode || t.id).toUpperCase() === kode);
  if (isDuplicate) {
    showToast(`Kode aturan "${kode}" sudah ada di sistem!`, 'error');
    return;
  }

  let kategori = "Ringan";
  if (poin > 15) kategori = "Sedang";
  if (poin > 40) kategori = "Berat";

  const aturanBaru = {
    id: kode,
    kode: kode,
    nama: deskripsi,
    deskripsi: deskripsi,
    jenis: deskripsi,
    poin: poin,
    kategori: kategori
  };

  DB.tatatertib.push(aturanBaru);
  await simpanTataTertibKeFirebase();

  renderKelolaTataTertib();
  showToast(`Aturan ${kode} berhasil ditambahkan!`, 'success');
}

// --- FUNGSI HAPUS ATURAN ---
async function hapusTataTertib(kode) {
  if (!confirm(`Apakah Anda yakin ingin menghapus aturan "${kode}"?`)) return;

  DB.tatatertib = DB.tatatertib.filter(t => (t.kode || t.id) !== kode);
  await simpanTataTertibKeFirebase();

  renderKelolaTataTertib();
  showToast(`Aturan ${kode} berhasil dihapus!`, 'success');
}

// --- FUNGSI UNGGAH CSV MASSAL ---
function unggahTataTertibMassal(event) {
  const file = event.target.files[0];
  if (!file) return;
  document.getElementById('statusFileTT').textContent = file.name;
  const reader = new FileReader();

  reader.onload = async function (e) {
    const text = e.target.result;
    const rows = text.split(/\r?\n/).filter(row => row.trim() !== '');
    if (rows.length <= 1) { showToast('File kosong atau format salah!', 'error'); return; }

    const dataBaru = [];
    for (let i = 1; i < rows.length; i++) {
      const columns = rows[i].split(',');
      if (columns.length >= 3) {
        const kode = columns[0].replace(/"/g, '').trim();
        const deskripsi = columns[1].replace(/"/g, '').trim();
        const poin = parseInt(columns[2]) || 0;

        let kategori = "Ringan";
        if (poin > 15) kategori = "Sedang";
        if (poin > 40) kategori = "Berat";

        dataBaru.push({
          id: kode,
          kode: kode,
          nama: deskripsi,
          deskripsi: deskripsi,
          jenis: deskripsi,
          poin: poin,
          kategori: kategori
        });
      }
    }

    if (dataBaru.length > 0) {
      DB.tatatertib = dataBaru;
      await simpanTataTertibKeFirebase();
      renderKelolaTataTertib();
      showToast(`Berhasil menyimpan ${dataBaru.length} aturan ke Firebase!`, 'success');
    } else {
      showToast('Gagal memproses file, cek format kolom', 'error');
    }
  };

  reader.readAsText(file);
  event.target.value = '';
}

    function filterAdminPel() {
      const kelas = document.getElementById('fKelasAdmin').value;
      const search = document.getElementById('searchAdmin').value.toLowerCase();

      if (!DB.pelanggaran) DB.pelanggaran = [];

      let data = DB.pelanggaran.map(p => {
        // FIX PENCARIAN GANDA: Cari berdasarkan ID, jika gagal cari berdasarkan Nama
        const s = DB.siswa.find(x =>
          String(x.id) === String(p.siswaId) ||
          String(x.id) === String(p.idSiswa) ||
          (p.namaSiswa || p.nama || "").trim().toLowerCase() === x.nama.trim().toLowerCase()
        );

        const tt = DB.tatatertib.find(x => x.id == p.jenisId || x.kode == p.jenisId || x.id == p.tatatertibId);

        return s && tt ? {
          nama: s.nama,
          nisn: s.nisn,
          kelas: s.kelas,
          tanggal: p.tanggal,
          jenis: tt.deskripsi || tt.jenis || 'Pelanggaran Aturan',
          poin: tt.poin,
          guru: p.guru || 'Guru Piket'
        } : null;
      }).filter(Boolean);

      if (kelas) data = data.filter(d => d.kelas === kelas);
      if (search) data = data.filter(d => d.nama.toLowerCase().includes(search));

      document.getElementById('bodyAdminPel').innerHTML = data.map(d => `

      <td class="py-3 px-4 font-mono">${d.nisn}</td>

    function eksekusiPrintSuratSiswa(siswaId) {
      const s = DB.siswa.find(x => x.id == siswaId);

      // 1. AMBIL DATA PELANGGARAN GURU
      const pelanggaranSiswa = (DB.pelanggaran || []).filter(p => {
        const matchId = String(p.siswaId) === String(siswaId) || String(p.idSiswa) === String(siswaId);
        const matchNama = s && (p.namaSiswa || p.nama || "").trim().toLowerCase() === s.nama.trim().toLowerCase();
        return matchId || matchNama;
      });

      let totalPoinTataTertib = 0;
      let barisTabelCetak = '';
      let barisTabelPreview = '';

      pelanggaranSiswa.forEach((p, index) => {
        const tt = DB.tatatertib.find(x => x.id == p.jenisId || x.kode == p.jenisId || x.id == p.tatatertibId);
        const poinInputGuru = parseInt(p.poin) || parseInt(p.skor) || 0;
        const poinFinal = tt ? (parseInt(tt.poin) || 0) : poinInputGuru;
        const deskripsiFinal = tt ? (tt.deskripsi || tt.jenis) : (p.keterangan || p.jenisPelanggaran || "Pelanggaran Tata Tertib");

        totalPoinTataTertib += poinFinal;

        // Baris khusus untuk Dokumen Cetak (Garis Hitam Tegas)
        barisTabelCetak += `
      <tr style="font-size: 12px;">
        <td style="padding: 8px; text-align: center; border: 1px solid #000000;">${index + 1}</td>
        <td style="padding: 8px; text-align: center; border: 1px solid #000000;">${p.tanggal}</td>

        <td style="padding: 8px; text-align: center; font-weight: bold; border: 1px solid #000000;">${poinFinal}</td>
      </tr>

        // Baris khusus untuk Preview Dashboard (Styling Lembut Tailwind)
        barisTabelPreview += `

      });

      // 2. HITUNG LOG ABSENSI SEKRETARIS
      let totalPoinAbsensi = 0;
      let detailAbsenString = "0 Alpa, 0 Izin, 0 Sakit";

      if (s) {
        const logAbsenSiswa = (DB.kehadiran || []).filter(k => {

function eksekusiHapusTanggalFiktif(tanggal) {
  const tglBersih = String(tanggal).trim();

  if (!confirm(`⚠️ KONFIRMASI PERMANEN\n\nYakin ingin menghapus seluruh data absensi tanggal ${tglBersih} dari Database Cloud?`)) {
    return;
  }

  try {
    let targetDb = null;
    if (typeof database !== 'undefined') {
      targetDb = database;
    } else if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
      targetDb = window.firebase.apps[0].database();
    }

    if (!targetDb) {
      showToast("Database Firebase tidak terhubung!", "danger");
      return;
    }

    // 1. Dapatkan referensi data kehadiran dari Firebase Realtime Database
    const kehadiranRef = targetDb.ref('kesiswaan_cloud/kehadiran');

    kehadiranRef.once('value').then((snapshot) => {
      const cloudKehadiran = snapshot.val();

      if (!cloudKehadiran) {
        showToast("Data kehadiran di Cloud kosong.", "warning");
        return;
      }

      // SKENARIO A: Jika data berbentuk ARRAY di Firebase (0, 1, 2, dst.)
      if (Array.isArray(cloudKehadiran)) {
        const dataBersih = cloudKehadiran.filter(item => {
          if (!item) return false;
          return String(item.tanggal).trim() !== tglBersih;
        });

        // Timpa array di Firebase dengan data yang sudah difilter
        kehadiranRef.set(dataBersih);
      } 
      // SKENARIO B: Jika data berbentuk OBJEK / KEY STRING di Firebase (2026-07-20_XII_AKL)
      else if (typeof cloudKehadiran === 'object') {
        let updates = {};

        Object.keys(cloudKehadiran).forEach(key => {
          const item = cloudKehadiran[key];

          // Cek jika Key diawali tanggal (misal "2026-07-20_...")
          // ATAU jika properti 'tanggal' di dalam item cocok
          if (key.startsWith(tglBersih) || (item && String(item.tanggal).trim() === tglBersih)) {
            updates[key] = null; // Menandakan perintah HAPUS di Firebase
          } 
          // Jika di dalam key bertingkat terdapat sub-array/sub-objek
          else if (typeof item === 'object' && item !== null) {
            Object.keys(item).forEach(subKey => {
              const subItem = item[subKey];
              if (subItem && String(subItem.tanggal).trim() === tglBersih) {
                updates[`${key}/${subKey}`] = null;
              }
            });
          }
        });

        // Eksekusi penghapusan serentak di Firebase
        if (Object.keys(updates).length > 0) {
          kehadiranRef.update(updates);
        }
      }

      // 2. Hapus tanggal dari node hariAktif jika ada
      targetDb.ref('kesiswaan_cloud/hariAktif').once('value').then((hSnapshot) => {
        const cloudHariAktif = hSnapshot.val();
        if (cloudHariAktif) {
          if (Array.isArray(cloudHariAktif)) {
            const hariAktifBersih = cloudHariAktif.filter(h => String(h.tanggal || h).trim() !== tglBersih);
            targetDb.ref('kesiswaan_cloud/hariAktif').set(hariAktifBersih);
          } else if (typeof cloudHariAktif === 'object') {
            Object.keys(cloudHariAktif).forEach(hk => {
              if (String(cloudHariAktif[hk].tanggal || cloudHariAktif[hk]).trim() === tglBersih) {
                targetDb.ref(`kesiswaan_cloud/hariAktif/${hk}`).remove();
              }
            });
          }
        }
      });

      // 3. Update Variabel Lokal DB
      if (Array.isArray(DB.kehadiran)) {
        DB.kehadiran = DB.kehadiran.filter(k => String(k.tanggal).trim() !== tglBersih);
      }
      if (Array.isArray(DB.hariAktif)) {
        DB.hariAktif = DB.hariAktif.filter(h => String(h.tanggal).trim() !== tglBersih);
      }

      // Jalankan fungsi simpan lokal pendukung (opsional)
      if (typeof simpanDataKeStorage === 'function') simpanDataKeStorage();

      showToast(`Jurnal absensi tanggal ${tglBersih} berhasil dihapus permanen!`, "success");

      // Refresh Tampilan Halaman
      bukaSubMenuRiwayatJurnal();

    }).catch((err) => {
      console.error("Gagal menghapus jurnal dari Firebase:", err);
      showToast("Gagal menghapus data dari server Firebase.", "danger");
    });

  } catch (err) {
    console.error(err);
    showToast("Terjadi kesalahan sistem saat menghapus.", "danger");
  }
}

function unduhRekapBulananAdmin() {
  const kelasTerpilih = document.getElementById('filterKelasAdminKH')?.value || '';
  const bulanTerpilih = document.getElementById('filterBulanAdminKH')?.value || '';

  const namaBulanArr = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  const labelBulan = bulanTerpilih ? namaBulanArr[parseInt(bulanTerpilih) - 1] : "Semua Bulan";
  const labelKelas = kelasTerpilih ? kelasTerpilih : "Semua Kelas";

  let daftarSiswa = [...(DB.siswa || [])];
  if (kelasTerpilih) {
    daftarSiswa = daftarSiswa.filter(s => String(s.kelas).trim() === kelasTerpilih);
  }

  daftarSiswa.sort((a, b) => {
    const kCmp = String(a.kelas || '').localeCompare(String(b.kelas || ''), 'id', { numeric: true });
    if (kCmp !== 0) return kCmp;
    return String(a.nama || a.name || '').localeCompare(String(b.nama || b.name || ''), 'id');
  });

  if (daftarSiswa.length === 0) {
    if (typeof showToast === 'function') showToast('Tidak ada data siswa untuk dicetak', 'error');
    else alert('Tidak ada data siswa untuk dicetak');
    return;
  }

  let seluruhLogKehadiran = DB.kehadiran || [];
  let logBulanIni = seluruhLogKehadiran;
  if (bulanTerpilih) {
    const formatBulan = String(bulanTerpilih).padStart(2, '0');
    logBulanIni = seluruhLogKehadiran.filter(k => k.tanggal && k.tanggal.split('-')[1] === formatBulan);
  }

  const daftarTanggalUnikGlobal = [...new Set(logBulanIni.map(k => k.tanggal).filter(Boolean))];

  if (daftarTanggalUnikGlobal.length === 0) {
    if (typeof showToast === 'function') showToast(`Belum ada data absensi pada periode ${labelBulan}!`, 'error');
    else alert(`Belum ada data absensi pada periode ${labelBulan}!`);
    return;
  }

  const hariEfektifGlobal = daftarTanggalUnikGlobal.length;
  let barisTabelHTML = "";

  daftarSiswa.forEach((s, index) => {
    let logAbsenSiswa = logBulanIni.filter(k => String(k.siswaId) === String(s.id));

    const skt = logAbsenSiswa.filter(k => ['sakit', 's'].includes(String(k.status || '').toLowerCase().trim())).length;
    const izn = logAbsenSiswa.filter(k => ['izin', 'i'].includes(String(k.status || '').toLowerCase().trim())).length;
    let alp = logAbsenSiswa.filter(k => ['alpa', 'a'].includes(String(k.status || '').toLowerCase().trim())).length;

    const tanggalTerrecordSiswa = logAbsenSiswa.map(k => k.tanggal).filter(Boolean);
    daftarTanggalUnikGlobal.forEach(tgl => {
      if (!tanggalTerrecordSiswa.includes(tgl)) alp += 1;
    });

    const totalTidakHadir = skt + izn + alp;
    const hadir = Math.max(0, hariEfektifGlobal - totalTidakHadir);
    const persentase = hariEfektifGlobal > 0 ? ((hadir / hariEfektifGlobal) * 100).toFixed(1) : "0.0";
    const poin = (alp * 3) + (izn * 1) + (skt * 0.5);
    const warnaPersen = parseFloat(persentase) < 90.0 ? '#dc2626' : '#059669';

    barisTabelHTML += `
      <tr>
        <td class="text-center">${index + 1}</td>
        <td class="text-left font-semibold">${s.nama || s.name || '-'}</td>
        <td class="text-center">${s.kelas || '-'}</td>
        <td class="text-center font-medium" style="background-color: #fafafa;">${hariEfektifGlobal} Hari</td>
        <td class="text-center font-semibold" style="color: #059669; background-color: #f0fdf4;">${hadir} Hari</td>
        <td class="text-center">${skt || '-'}</td>
        <td class="text-center">${izn || '-'}</td>
        <td class="text-center ${alp > 0 ? 'text-red' : ''}">${alp || '-'}</td>
        <td class="text-center font-bold" style="color: ${warnaPersen}; background-color: #f0fdf4;">${persentase}%</td>
        <td class="text-center font-bold" style="color: ${poin > 0 ? '#b91c1c' : '#4b5563'};">${poin} Poin</td>
      </tr>
    `;
  });

  bukaJendelaCetak(`Rekap Bulanan Absensi - ${labelKelas}`, labelKelas, labelBulan, barisTabelHTML);
}

      const tbody = document.getElementById('bodyAdminKH');
      if (!tbody) return;

      const kelasTerpilih = document.getElementById('filterKelasAdminKH')?.value || '';
      const bulanTerpilih = document.getElementById('filterBulanAdminKH')?.value || '';

      if ((!DB.kehadiran || DB.kehadiran.length === 0) && localStorage.getItem('kesiswaan_backup_absen')) {
        DB.kehadiran = JSON.parse(localStorage.getItem('kesiswaan_backup_absen'));
      }

      let daftarSiswaTerfilter = DB.siswa || [];
      if (kelasTerpilih) {
        daftarSiswaTerfilter = daftarSiswaTerfilter.filter(s => s.kelas === kelasTerpilih);
      }

      if (daftarSiswaTerfilter.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="py-8 text-center text-gray-400 italic">Tidak ada data siswa yang cocok dengan filter.</td></tr>`;
        return;
      }

      const hasilRekap = daftarSiswaTerfilter.map(s => {
        let logAbsenSiswa = (DB.kehadiran || []).filter(k => String(k.siswaId) == String(s.id));

        if (bulanTerpilih) {
          logAbsenSiswa = logAbsenSiswa.filter(k => k.tanggal && k.tanggal.split('-')[1] === bulanTerpilih);
        }

        const hdr = logAbsenSiswa.filter(k => {
          const st = String(k.status || '').toLowerCase().trim();
          return st === '' || ['hadir', 'h'].includes(st);
        }).length;
        const skt = logAbsenSiswa.filter(k => ['sakit', 's'].includes(String(k.status || '').toLowerCase().trim())).length;
        const izn = logAbsenSiswa.filter(k => ['izin', 'i'].includes(String(k.status || '').toLowerCase().trim())).length;
        const alp = logAbsenSiswa.filter(k => ['alpa', 'a'].includes(String(k.status || '').toLowerCase().trim())).length;

        const totalPoinAbsen = (alp * 3) + (izn * 1) + (skt * 0.5);

        return {
          nama: s.nama,
          kelas: s.kelas || '-',
          hadir: hdr,
          sakit: skt,
          izin: izn,
          alpa: alp,
          totalPoin: totalPoinAbsen
        };
      });

      // Urutkan berdasarkan poin pelanggaran tertinggi
      hasilRekap.sort((a, b) => b.totalPoin - a.totalPoin);

      <td class="text-center py-3 px-4 font-medium text-red-600 dark:text-red-400">${r.alpa}</td>

function generateMatrixAbsenBulanan() {
  const kelas = document.getElementById('filterKelasAbsenBulanan')?.value || '';
  const bulan = parseInt(document.getElementById('filterBulanAbsen')?.value || (new Date().getMonth() + 1));
  const tahun = parseInt(document.getElementById('filterTahunAbsen')?.value || new Date().getFullYear());

  const head = document.getElementById('headTabelAbsenBulanan');
  const body = document.getElementById('bodyTabelAbsenBulanan');

  if (!head || !body) return;

  const jumlahHari = new Date(tahun, bulan, 0).getDate();

  // 1. GENERATE HEADER TABEL
  let htmlHead = `
    <tr>
      <th class="p-2 border border-gray-300 dark:border-gray-600 min-w-[30px] text-center" rowspan="2">No</th>
      <th class="p-2 border border-gray-300 dark:border-gray-600 min-w-[180px] text-left" rowspan="2">Nama Siswa</th>
      <th class="p-2 border border-gray-300 dark:border-gray-600 text-center" colspan="${jumlahHari}">Tanggal Bulan ${bulan} - ${tahun}</th>
      <th class="p-2 border border-gray-300 dark:border-gray-600 text-center" colspan="4">Total</th>
    </tr>
    <tr>
  `;

  // Normalisasi data libur
  const daftarLibur = (DB.libur || []).map(l => {
    let tglStr = String(l.tanggal || l.tgl || '').trim();
    if (tglStr.includes('-')) {
      const p = tglStr.split('-');
      if (p.length === 3) {
        tglStr = `${p[0]}-${p[1].padStart(2, '0')}-${p[2].padStart(2, '0')}`;
      }
    }
    return {
      tanggal: tglStr,
      keterangan: l.keterangan || l.ket || l.nama || 'Libur'
    };
  });

  const mapTanggalInfo = {}; 
  for (let d = 1; d <= jumlahHari; d++) {
    const padDay = String(d).padStart(2, '0');
    const padMon = String(bulan).padStart(2, '0');
    const formatTgl = `${tahun}-${padMon}-${padDay}`;

    const isMinggu = new Date(tahun, bulan - 1, d).getDay() === 0;
    const itemLibur = daftarLibur.find(l => l.tanggal === formatTgl);

    if (isMinggu) {
      mapTanggalInfo[d] = { tipe: 'minggu', ket: '' };
      htmlHead += `<th class="p-1 border border-gray-300 dark:border-gray-600 w-6 text-center bg-black text-white">${d}</th>`;
    } else if (itemLibur) {
      const ketText = itemLibur.keterangan;
      mapTanggalInfo[d] = { tipe: 'libur', ket: ketText };
      htmlHead += `<th class="p-1 border border-gray-300 dark:border-gray-600 w-6 text-center font-bold" style="background-color: #38bdf8 !important; color: #000000 !important;" title="${ketText}">${d}</th>`;
    } else {
      mapTanggalInfo[d] = { tipe: 'efektif', ket: '' };
      htmlHead += `<th class="p-1 border border-gray-300 dark:border-gray-600 w-6 text-center">${d}</th>`;
    }
  }

  htmlHead += `
      <th class="p-1 border border-gray-300 dark:border-gray-600 bg-green-100 text-green-800 text-center">H</th>
      <th class="p-1 border border-gray-300 dark:border-gray-600 bg-amber-100 text-amber-800 text-center">S</th>
      <th class="p-1 border border-gray-300 dark:border-gray-600 bg-blue-100 text-blue-800 text-center">I</th>
      <th class="p-1 border border-gray-300 dark:border-gray-600 bg-red-100 text-red-800 text-center">A</th>
    </tr>
  `;
  head.innerHTML = htmlHead;

  // 2. LOOKUP MAP KEHADIRAN
  const mapAbsen = {};
  const padMon = String(bulan).padStart(2, '0');
  const prefixTgl = `${tahun}-${padMon}-`;

  (DB.kehadiran || []).forEach(k => {
    if (k && k.tanggal && k.tanggal.startsWith(prefixTgl)) {
      const keyMap = `${String(k.siswaId).trim()}_${k.tanggal}`;
      mapAbsen[keyMap] = String(k.status || '').toLowerCase().trim();
    }
  });

  // 3. FILTER SISWA
  let listSiswa = [...(DB.siswa || [])];
  if (kelas) {
    listSiswa = listSiswa.filter(s => s.kelas === kelas);
  }

  listSiswa.sort((a, b) => {
    const kls = (a.kelas || '').localeCompare(b.kelas || '', 'id', { numeric: true });
    if (kls !== 0) return kls;
    return (a.nama || '').localeCompare(b.nama || '', 'id');
  });

  if (listSiswa.length === 0) {
    body.innerHTML = `<tr><td colspan="${jumlahHari + 6}" class="p-4 text-center text-gray-400 italic">Tidak ada data siswa terpilih.</td></tr>`;
    return;
  }

  // 4. RENDER ROWS SISWA
  let htmlBody = '';
  listSiswa.forEach((siswa, index) => {
    let totH = 0, totS = 0, totI = 0, totA = 0;
    const siswaIdStr = String(siswa.id).trim();

    // Tanggal masuk resmi siswa
    const tglMasuk = siswa.tglMasuk || null;

    let cellHTML = '';
    for (let d = 1; d <= jumlahHari; d++) {
      const padDay = String(d).padStart(2, '0');
      const formatTgl = `${prefixTgl}${padDay}`;
      const keyFormat = `${siswaIdStr}_${formatTgl}`;
      const statusAbsen = mapAbsen[keyFormat];
      const tglInfo = mapTanggalInfo[d];

      let cellStyle = '';
      let cellClass = '';
      let statusChar = '';

      const isSebelumMasuk = tglMasuk && (formatTgl < tglMasuk);

      // prioritaskan pengecekan hari non-efektif (Minggu & Libur)
      if (tglInfo.tipe === 'minggu') {
        cellClass = 'bg-black text-black select-none';
      } else if (tglInfo.tipe === 'libur') {
        cellStyle = 'style="background-color: #38bdf8 !important; color: #000000 !important;"';
        cellClass = 'font-bold text-[9px] leading-none select-none';
        statusChar = tglInfo.ket || 'L'; 
      } else if (isSebelumMasuk) {
        // Hanya di-blok HITAM jika berada pada HARI EFEKTIF sebelum tanggal resmi masuk
        cellClass = 'bg-black text-black select-none';
        statusChar = '';
      } else if (statusAbsen) {
        if (['h', 'hadir'].includes(statusAbsen)) {
          cellClass = 'bg-green-500 text-white font-bold';
          statusChar = 'H';
          totH++;
        } else if (['s', 'sakit'].includes(statusAbsen)) {
          cellClass = 'bg-amber-400 text-white font-bold';
          statusChar = 'S';
          totS++;
        } else if (['i', 'izin'].includes(statusAbsen)) {
          cellClass = 'bg-blue-500 text-white font-bold';
          statusChar = 'I';
          totI++;
        } else if (['a', 'alpa', 'alfa'].includes(statusAbsen)) {
          cellClass = 'bg-red-600 text-white font-bold';
          statusChar = 'A';
          totA++;
        }
      }

      cellHTML += `<td class="p-0.5 border border-gray-300 dark:border-gray-600 text-center ${cellClass}" ${cellStyle} title="${isSebelumMasuk ? 'Belum Resmi Bergabung' : tglInfo.ket}">${statusChar}</td>`;
    }

    htmlBody += `
      <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/30">
        <td class="p-1.5 border border-gray-300 dark:border-gray-600 text-center font-mono">${index + 1}</td>
        <td class="p-1.5 border border-gray-300 dark:border-gray-600 font-semibold text-gray-800 dark:text-gray-100 whitespace-nowrap">${siswa.nama}</td>
        ${cellHTML}
        <td class="p-1 border border-gray-300 dark:border-gray-600 text-center font-bold text-green-600 bg-green-50/50">${totH}</td>
        <td class="p-1 border border-gray-300 dark:border-gray-600 text-center font-bold text-amber-600 bg-amber-50/50">${totS}</td>
        <td class="p-1 border border-gray-300 dark:border-gray-600 text-center font-bold text-blue-600 bg-blue-50/50">${totI}</td>
        <td class="p-1 border border-gray-300 dark:border-gray-600 text-center font-bold text-red-600 bg-red-50/50">${totA}</td>
      </tr>
    `;
  });

  body.innerHTML = htmlBody;
}

async function simpanHariLibur() {
  const tglInput = document.getElementById('inputTglLibur');
  const ketInput = document.getElementById('inputKetLibur');
  const tgl = (tglInput?.value || '').trim();
  const ket = (ketInput?.value || '').trim() || 'Hari Non-Efektif';

  if (!tgl) {
    if (typeof showToast === 'function') showToast('⚠️ Pilih tanggal terlebih dahulu!', 'error');
    else alert("Pilih tanggal terlebih dahulu!");
    return;
  }

  DB.libur = Array.isArray(DB.libur) ? DB.libur : [];

  if (DB.libur.some(x => x && String(x.tanggal).trim() === tgl)) {
    if (typeof showToast === 'function') showToast('⚠️ Tanggal ini sudah terdaftar sebagai hari libur!', 'error');
    else alert("Tanggal ini sudah terdaftar sebagai hari libur!");
    return;
  }

  // Push data baru
  DB.libur.push({ 
    id: 'LIB_' + Date.now(), 
    tanggal: tgl, 
    keterangan: ket 
  });

  // 1. SIMPAN KE LOCALSTORAGE (Instan)
  try {
    localStorage.setItem('DB_KESISWAAN', JSON.stringify(DB));
    localStorage.setItem('sik_libur', JSON.stringify(DB.libur));
  } catch (e) {
    console.error("Gagal simpan ke LocalStorage:", e);
  }

  // 2. RESET INPUT & REFRESH TAMPILAN SAKAN ITU JUGA
  if (tglInput) tglInput.value = '';
  if (ketInput) ketInput.value = '';

  renderIsiModalLibur();
  if (typeof generateMatrixAbsenBulanan === 'function') generateMatrixAbsenBulanan();
  if (typeof renderRekapKetidakhadiran === 'function') renderRekapKetidakhadiran();

  // Toast Notifikasi
  if (typeof showToast === 'function') {
    showToast('✅ Hari non-efektif berhasil disimpan!', 'success');
  }

  // 3. SIMPAN KE FIREBASE (Background Process / Non-blocking)
  try {
    if (typeof simpanDataKeStorage === 'function') {
      simpanDataKeStorage('libur').catch(err => console.warn("Firebase sync err:", err));
    }
    if (typeof simpanDataKeCloud === 'function') {
      simpanDataKeCloud('libur', DB.libur);
    }
    if (typeof firebase !== 'undefined' && firebase.database) {
      firebase.database().ref('kesiswaan_cloud/libur').set(DB.libur);
    }
  } catch (error) {
    console.error("Gagal menginisiasi sinkronisasi ke Firebase:", error);
  }
}

function hapusHariLibur(index) {
  if (confirm("Hapus hari non-efektif ini?")) {
    DB.libur.splice(index, 1);

    // 1. SIMPAN PERUBAHAN KE LOCALSTORAGE
    try {
      localStorage.setItem('DB_KESISWAAN', JSON.stringify(DB));
      localStorage.setItem('sik_libur', JSON.stringify(DB.libur));
    } catch (e) {
      console.error("Gagal simpan ke LocalStorage:", e);
    }

    // 2. REFRESH UI
    renderIsiModalLibur();
    if (typeof generateMatrixAbsenBulanan === 'function') generateMatrixAbsenBulanan();
    if (typeof renderRekapKetidakhadiran === 'function') renderRekapKetidakhadiran();

    // 3. SIMPAN KE FIREBASE / CLOUD (Background process)
    try {
      if (typeof simpanDB === 'function') simpanDB();
      if (typeof simpanDataKeStorage === 'function') simpanDataKeStorage('libur');
      if (typeof simpanDataKeCloud === 'function') simpanDataKeCloud('libur', DB.libur);
      if (typeof firebase !== 'undefined' && firebase.database) {
        firebase.database().ref('kesiswaan_cloud/libur').set(DB.libur);
      }
    } catch (err) {
      console.warn("Gagal sinkronisasi hapus libur:", err);
    }
  }
}

// Fungsi Helper: Cek apakah suatu tanggal adalah Hari Libur / Non-Efektif
function cekKeteranganLibur(tanggalString) {
  if (!tanggalString) return null;

  const tglClean = String(tanggalString).trim();

  // Ubah YYYY-MM-DD menjadi YYYY/MM/DD agar dibaca sebagai waktu lokal
  const dateObj = new Date(tglClean.replace(/-/g, '/'));
  const dayOfWeek = dateObj.getDay(); // 0 = Minggu, 6 = Sabtu

  if (dayOfWeek === 0 || dayOfWeek === 6) {
    return { isLibur: true, ket: "Akhir Pekan (Non-Efektif)" };
  }

  if (Array.isArray(DB.libur) && DB.libur.length > 0) {
    const itemLibur = DB.libur.find(l => l && String(l.tanggal).trim() === tglClean);
    if (itemLibur) {
      return { isLibur: true, ket: itemLibur.keterangan || "Hari Libur Sekolah" };
    }
  }

  return null;
}

function renderBimbinganKesiswaan(filterKelasWakasis = 'SEMUA'){
  const mc = document.getElementById('mainContent');
  if(!mc) return;
  
  const userRole = typeof currentUser !== 'undefined' && currentUser.role ? currentUser.role.toLowerCase() : '';
  const namaGuruLogin = typeof currentUser !== 'undefined' && currentUser.name ? currentUser.name : '';
  const kelasBinaanWalas = typeof currentUser !== 'undefined' && currentUser.kelasBinaan ? currentUser.kelasBinaan : '';

  let listBimbingan = (DB.siswa || []).map(s => {
    let totalPelanggaran = 0;
    let totalAbsen = 0;
    let totalPenebusanKhusus = 0; 
    
    // 1. HITUNG POIN TATA TERTIB
    if (DB.pelanggaran) {
      DB.pelanggaran.forEach(p => {
        if (String(p.siswaId || p.idSiswa) === String(s.id)) {
          const tt = DB.tatatertib && DB.tatatertib.length > 0 ? DB.tatatertib.find(x => x.id == p.jenisId || x.kode == p.jenisId) : null;
          totalPelanggaran += tt ? parseInt(tt.poin) : (parseInt(p.poin) || 0);
        }
      });
    }
    
    // 2. HITUNG POIN KETIDAKHADIRAN
    if (DB.kehadiran) {
      const logSiswa = DB.kehadiran.filter(k => 
        String(k.siswaId || k.idSiswa || '') === String(s.id) ||
        (s.nisn && String(k.nisn || '') === String(s.nisn))
      );
      
      let alpa = 0, izin = 0, sakit = 0;

      logSiswa.forEach(k => {
        const st = String(k.status || "").toUpperCase().trim();
        if (st === 'A' || st === 'ALFA' || st === 'ALPA') alpa++;
        else if (st === 'I' || st === 'IZIN') izin++;
        else if (st === 'S' || st === 'SAKIT') sakit++;
      });
      
      totalAbsen = (alpa * 3) + (izin * 1) + (sakit * 0.5);
    }

    // 3. HITUNG POIN PENEBUSAN/REMISI
    const sourcePenebusan = DB.penebusanPoin || DB.penebusan_poin || [];
    const listPenebusanArray = Array.isArray(sourcePenebusan) 
      ? sourcePenebusan 
      : Object.keys(sourcePenebusan).map(k => ({ idPenebusan: k, ...sourcePenebusan[k] }));

    listPenebusanArray.forEach(p => {
      if (String(p.siswaId || p.idSiswa) === String(s.id)) {
        totalPenebusanKhusus += (Number(p.poinPemulihan || p.poin) || 0);
      }
    });
    
    // 4. FORMULA SINKRON POIN AKTIF
    let poinAktifMutlak = (totalPelanggaran + totalAbsen) - totalPenebusanKhusus;
    if (poinAktifMutlak < 0) poinAktifMutlak = 0; 
    
    let statusInfo = typeof dapatkanStatusBimbingan === 'function' ? dapatkanStatusBimbingan(poinAktifMutlak) : null;
    const originalStatusInfo = typeof dapatkanStatusBimbingan === 'function' ? dapatkanStatusBimbingan(totalPelanggaran + totalAbsen) : null;
    
    if (!statusInfo && originalStatusInfo && totalPenebusanKhusus > 0) {
      statusInfo = {
        teks: poinAktifMutlak === 0 ? "Pemulihan Total (Poin Bersih)" : "Pemulihan Parsial (Poin Berkurang)",

    return {

function bukaModalPenebusan(idSiswa, nama) {
  document.getElementById('mpSiswaId').value = idSiswa;
  document.getElementById('mpNama').value = nama;
  document.getElementById('mpSelectAturan').value = "";
  document.getElementById('mpPoin').value = "";
  document.getElementById('mpCatatan').value = "";
  document.getElementById('mpKonfirmasi').checked = false;
  document.getElementById('mpWrapperKustom').classList.add('hidden');
  document.getElementById('mpTindakanKustom').value = "";
  
  const inputTgl = document.getElementById('mpTanggal');
  if (inputTgl) inputTgl.value = new Date().toISOString().split('T')[0];

  renderRiwayatModalPenebusan(idSiswa);
  document.getElementById('modalPenebusanPoinKesiswaan').classList.remove('hidden');
}

function renderRiwayatModalPenebusan(idSiswa) {
  const container = document.getElementById('mpListRiwayat');
  if (!container) return;

  const userRole = typeof currentUser !== 'undefined' && currentUser.role ? currentUser.role.toLowerCase() : '';

  let rawData = [];
  if (typeof DB !== 'undefined') {
    rawData = DB.penebusanPoin || DB.penebusan_poin || [];
  }

  let dataPenebusan = [];
  if (Array.isArray(rawData)) {
    dataPenebusan = rawData;
  } else if (typeof rawData === 'object' && rawData !== null) {
    dataPenebusan = Object.keys(rawData).map(key => ({
      idPenebusan: key,
      ...rawData[key]
    }));
  }

  const listData = dataPenebusan.filter(p => {
    const targetId = p.idSiswa || p.siswaId;
    return String(targetId) === String(idSiswa);
  });

  if (listData.length === 0) {
    container.innerHTML = `<p class="text-gray-400 italic text-[11px]">Belum ada riwayat pemulihan poin sebelumnya.</p>`;
    return;
  }

  container.innerHTML = listData.map(p => {
    const keyPenebusan = p.idPenebusan || p.id || '';
    const namaTindakan = p.tindakanMendidik || p.tindakan || p.namaTindakan || 'Pemulihan Poin';
    const poin = p.poinPemulihan || p.poin || 0;
    const tanggal = p.tanggalPemulihan || p.tanggal || '-';

    return `
      <div class="flex items-center justify-between p-2 bg-gray-50 dark:bg-gray-700/50 rounded-xl border border-gray-100 dark:border-gray-600">
        <div>
          <div class="font-semibold text-gray-800 dark:text-gray-200 text-xs">${namaTindakan}</div>
          <div class="text-[10px] text-gray-400">📅 ${tanggal} | <span class="text-green-600 font-bold">+${poin} Poin</span></div>
        </div>
        ${userRole === 'admin' ? `
          <button type="button" onclick="hapusPenebusanPoin('${keyPenebusan}', '${idSiswa}')" class="px-2 py-1 bg-red-600 hover:bg-red-700 text-white rounded-lg text-[10px] font-bold transition cursor-pointer">
            🗑️ Hapus
          </button>
        ` : ''}
      </div>
    `;
  }).join('');
}

// FUNGSI HAPUS TUNGGAL & AMAN
async function hapusPenebusanPoin(idPenebusan, idSiswa = null) {
  const userRole = typeof currentUser !== 'undefined' && currentUser.role ? currentUser.role.toLowerCase() : '';
  if (userRole !== 'admin') {
    alert('⚠️ Akses Ditolak! Hanya Admin yang berhak menghapus riwayat penebusan poin.');
    return;
  }

  if (!idPenebusan) {
    alert('ID data penebusan tidak ditemukan!');
    return;
  }

  if (!confirm('Apakah Anda yakin ingin menghapus data pemulihan poin ini? Poin siswa akan disesuaikan kembali.')) return;

  try {
    if (typeof firebase !== 'undefined' && firebase.database) {
      await firebase.database().ref(`kesiswaan_cloud/penebusan_poin/${idPenebusan}`).remove();
    }

    if (typeof DB !== 'undefined') {
      if (Array.isArray(DB.penebusanPoin)) {
        DB.penebusanPoin = DB.penebusanPoin.filter(p => (p.idPenebusan || p.id) !== idPenebusan);
        localStorage.setItem('sik_penebusan_poin', JSON.stringify(DB.penebusanPoin));
      } else if (typeof DB.penebusanPoin === 'object' && DB.penebusanPoin !== null) {
        delete DB.penebusanPoin[idPenebusan];
      }

      if (Array.isArray(DB.penebusan_poin)) {
        DB.penebusan_poin = DB.penebusan_poin.filter(p => (p.idPenebusan || p.id) !== idPenebusan);
      } else if (typeof DB.penebusan_poin === 'object' && DB.penebusan_poin !== null) {
        delete DB.penebusan_poin[idPenebusan];
      }
    }

    if (typeof showToast === 'function') {
      showToast('Data penebusan poin berhasil dihapus oleh Admin!', 'success');
    } else {
      alert('Data penebusan poin berhasil dihapus!');
    }

    if (idSiswa) renderRiwayatModalPenebusan(idSiswa);
    if (typeof renderPenebusanPoin === 'function') renderPenebusanPoin();

}

function updatePoinOtomatis(idAturan) {
  const inputPoin = document.getElementById('mpPoin');
  const wrapperKustom = document.getElementById('mpWrapperKustom');
  
  const daftarAturan = typeof ATURAN_PENEBUSAN !== 'undefined' ? ATURAN_PENEBUSAN : [];

  if (idAturan === "KUSTOM") {
    wrapperKustom.classList.remove('hidden');
    inputPoin.readOnly = false; 
    inputPoin.value = "";
  } else if (idAturan !== "") {
    wrapperKustom.classList.add('hidden');
    inputPoin.readOnly = true; 
    const aturan = daftarAturan.find(x => x.id === idAturan);
    inputPoin.value = aturan ? aturan.poin : 0;
  } else {
    wrapperKustom.classList.add('hidden');
    inputPoin.value = "";
  }
}

function eksekusiSimpanPenebusanBaru() {
  const siswaId = document.getElementById('mpSiswaId').value;
  const namaSiswa = document.getElementById('mpNama').value;
  const idAturan = document.getElementById('mpSelectAturan').value;
  const poinPemulihan = Number(document.getElementById('mpPoin').value);
  const tanggal = document.getElementById('mpTanggal').value;
  const catatan = document.getElementById('mpCatatan').value;
  const konfirmasiChecked = document.getElementById('mpKonfirmasi').checked;

  if (!idAturan || !poinPemulihan || !tanggal) { alert("Data belum lengkap!"); return; }
  if (!konfirmasiChecked) { alert("Centang kotak konfirmasi!"); return; }

  const daftarAturan = typeof ATURAN_PENEBUSAN !== 'undefined' ? ATURAN_PENEBUSAN : [];
  let teksTindakan = "";

  if (idAturan === "KUSTOM") {
    teksTindakan = document.getElementById('mpTindakanKustom').value.trim();
    if (!teksTindakan) { alert("Masukkan jenis tindakan kustom!"); return; }
  } else {
    const aturan = daftarAturan.find(x => x.id === idAturan);
    teksTindakan = aturan ? aturan.nama : "Pemulihan Poin";
  }

  if (typeof firebase !== 'undefined' && firebase.database) {
    const refPenebusan = firebase.database().ref("kesiswaan_cloud/penebusan_poin").push();
    refPenebusan.set({
      idPenebusan: refPenebusan.key, 
      siswaId: siswaId, 
      namaSiswa: namaSiswa,
      poinPemulihan: poinPemulihan, 
      tindakanMendidik: teksTindakan,
      catatan: catatan,
      tanggalPemulihan: tanggal, 
      waktuPencatatan: new Date().toLocaleString('id-ID')
    }, (error) => {
      if (error) {
        alert("Gagal menyimpan data!");
      } else {
        alert("Sukses!"); 
        tutupModalPenebusan();
        if (typeof renderBimbinganKesiswaan === 'function') renderBimbinganKesiswaan();
      }
    });
  } else {
    alert("Koneksi Database tidak tersedia!");
  }
}

}

// 1. Fungsi Membuka Modal Tangani
function bukaModalTindakan(idSiswa, nama, statusTeks, petugasTarget) {

function tutupModalTindakan() {

// 3. Fungsi Eksekusi Simpan Solusi Tindakan
function simpanSolusiTindakan() {
  const siswaId = document.getElementById('mtSiswaId')?.value;
  const levelTeks = document.getElementById('mtLevelTeks')?.value;
  const petugas = document.getElementById('mtPetugas')?.value;
  const namaGuru = document.getElementById('mtGuru')?.value;
  const tglEksekusi = document.getElementById('mtTanggalTindakan')?.value;
  const solusi = document.getElementById('mtSolusi')?.value.trim();

  if (!solusi) {
    if (typeof tampilkanNotifikasi === 'function') {
      tampilkanNotifikasi('⚠️ Mohon isi hasil bimbingan & solusi penanganan terlebih dahulu!', 'error');
    }
    return;
  }

  // 1. Objek data tindakan baru
  const newTindakan = {
    id: 'TDK_' + Date.now(),
    siswaId: siswaId,
    levelTeks: levelTeks,
    petugas: petugas,
    eksekutor: namaGuru,
    tanggalEksekusi: tglEksekusi || new Date().toISOString().split('T')[0],
    solusi: solusi,
    createdAt: new Date().toISOString()
  };

  if (!Array.isArray(DB.riwayatTindakan)) {
    DB.riwayatTindakan = [];
  }

  DB.riwayatTindakan.push(newTindakan);

  // 2. Simpan ke LocalStorage (Sangat Cepat)
  try {
    localStorage.setItem('sik_riwayat_tindakan', JSON.stringify(DB.riwayatTindakan));
  } catch (e) {
    console.error("Gagal simpan ke LocalStorage:", e);
  }

  // 3. Tutup Modal & Refresh UI Seketika (Tanpa menunggu internet)
  tutupModalTindakan();
  if (typeof renderBimbinganKesiswaan === 'function') {
    renderBimbinganKesiswaan();
  }

  // 4. Munculkan Toast Hijau Langsung
  if (typeof tampilkanNotifikasi === 'function') {
    tampilkanNotifikasi('Penanganan telah berhasil disimpan', 'success');
  } else {
    let container = document.getElementById('custom-toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'custom-toast-container';
      container.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;';
      document.body.appendChild(container);
    }

    const toast = document.createElement('div');
    toast.style.cssText = `
      background-color: #10b981;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      font-weight: 600;
      font-size: 13px;
      font-family: sans-serif;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: auto;
    `;
    toast.innerText = 'Penanganan telah berhasil disimpan';
    container.appendChild(toast);

    requestAnimationFrame(() => {
      toast.style.opacity = '1';
      toast.style.transform = 'translateY(0)';
    });

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(-10px)';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  // 5. Kirim ke Firebase di Latar Belakang (Non-blocking / Tanpa await)
  if (typeof firebase !== 'undefined' && firebase.database) {
    firebase.database().ref(`kesiswaan_cloud/riwayatTindakan/${newTindakan.id}`).set(newTindakan).catch(err => {
      console.warn("Gagal sinkronisasi background Firebase:", err.message);
    });
  } else if (typeof FirebaseService !== 'undefined' && typeof FirebaseService.saveNode === 'function') {
    FirebaseService.saveNode('riwayatTindakan', DB.riwayatTindakan).catch(err => {
      console.warn("Gagal sinkronisasi background FirebaseService:", err.message);
    });
  }
}

    // PERBAIKAN: LAPORAN DENGAN TANDA TANGAN NAMA GURU OTOMATIS
    // ====================================================
function cetakLaporanBimbinganSiswa(idSiswa) {
  const s = DB.siswa.find(x => String(x.id) === String(idSiswa));
  if (!s) {
    alert("Data siswa tidak ditemukan.");
    return;
  }

  const userRole = typeof currentUser !== 'undefined' && currentUser.role ? currentUser.role.toLowerCase() : '';

  // --------------------------------------------------
  // LOGIKA PENCARIAN NAMA GURU SECARA OTOMATIS
  // --------------------------------------------------
  const daftarUser = DB.users || [];
  
  // 1. Cari Nama Wali Kelas berdasarkan kelas siswa
  const dataWalas = daftarUser.find(u => u.role === 'walas' && String(u.kelasBinaan).toUpperCase() === String(s.kelas).toUpperCase());
  const namaWaliKelas = dataWalas ? dataWalas.name : ".......................................";

  // 2. Cari Nama Guru BK (jika BK yang login pakai nama yang login, jika bukan ambil dari DB)
  const dataBK = daftarUser.find(u => u.role === 'bk');
  const namaGuruBK = (userRole === 'bk' && typeof currentUser !== 'undefined') ? currentUser.name : (dataBK ? dataBK.name : ".......................................");

  // 3. Cari Nama Wakasis (jika Wakasis yang login pakai nama yang login, jika bukan ambil dari DB)
  const dataWakasis = daftarUser.find(u => u.role === 'wakasis');
  const namaWakasis = (userRole === 'wakasis' && typeof currentUser !== 'undefined') ? currentUser.name : (dataWakasis ? dataWakasis.name : ".......................................");
  // --------------------------------------------------

  // Kumpulkan riwayat tindakan untuk siswa ini
  let semuaRiwayat = (DB.riwayatTindakan || []).filter(r => String(r.siswaId) === String(idSiswa));

  // Jika yang mencetak adalah Guru BK, batasi HANYA menampilkan riwayat dari Wali Kelas
  if (userRole === 'bk') {
    semuaRiwayat = semuaRiwayat.filter(r => r.otoritasPetugas === 'Wali Kelas');
  }

  // Urutkan kronologis
  semuaRiwayat.sort((a, b) => new Date(a.tanggalEksekusi) - new Date(b.tanggalEksekusi));

  // Format riwayat tindakan ke dalam baris tabel HTML
  let barisRiwayatHtml = "";
  if (semuaRiwayat.length === 0) {
    barisRiwayatHtml = `<tr><td colspan="5" style="text-align:center; padding: 15px; color: #777; font-style: italic;">Belum ada catatan pembinaan/intervensi resmi dari Wali Kelas di dalam sistem.</td></tr>`;
  } else {
    semuaRiwayat.forEach((r, index) => {
      const tgl = r.tanggalEksekusi ? new Date(r.tanggalEksekusi).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'}) : '-';
      barisRiwayatHtml += `
        <tr>
          <td style="text-align:center; border: 1px solid black; padding: 6px;">${index + 1}</td>
          <td style="border: 1px solid black; padding: 6px; font-weight: bold; font-family: monospace;">${tgl}</td>
          <td style="border: 1px solid black; padding: 6px;">${r.levelTeks || '-'}</td>
          <td style="border: 1px solid black; padding: 6px;"><strong>${r.otoritasPetugas}</strong><br><span style="font-size: 9pt; color:#444;">(Pendidik: ${r.namaGuru})</span></td>
          <td style="border: 1px solid black; padding: 6px; font-style: italic;">"${r.solusi}"</td>
        </tr>
      `;
    });
  }

  // =========================================================================
  // HITUNG AKURASI POIN PELANGGARAAN & KETIDAKHADIRAN & PENEBUSAN DOSA
  // =========================================================================
  let poinPelanggaranMurni = 0;
  let poinAbsensiMurni = 0;
  let totalPoinPenebusan = 0;

  // 1. Hitung akumulasi kotor pelanggaran tata tertib
  if (DB.pelanggaran) {
    DB.pelanggaran.forEach(p => {
      if (String(p.siswaId || '') === String(s.id) || String(p.idSiswa || '') === String(s.id)) {
        const tt = DB.tatatertib.find(x => x.id == p.jenisId || x.kode == p.jenisId);
        poinPelanggaranMurni += tt ? parseInt(tt.poin) : (parseInt(p.poin) || 0);
      }
    });
  }
  
  // 2. Hitung akumulasi poin ketidakhadiran
  if (DB.kehadiran) {
    const logSiswa = DB.kehadiran.filter(k => 
      String(k.siswaId || '') === String(s.id) || 
      String(k.idSiswa || '') === String(s.id) ||
      (s.nisn && String(k.nisn || '') === String(s.nisn))
    );
    
    const alpa = logSiswa.filter(k => {
      const st = k.status ? String(k.status).toUpperCase().trim() : '';
      return st === 'A' || st === 'ALFA' || st === 'ALPA';
    }).length;
    
    const izin = logSiswa.filter(k => {
      const st = k.status ? String(k.status).toUpperCase().trim() : '';
      return st === 'I' || st === 'IZIN';
    }).length;
    
    const sakit = logSiswa.filter(k => {
      const st = k.status ? String(k.status).toUpperCase().trim() : '';
      return st === 'S' || st === 'SAKIT';
    }).length;
    
    poinAbsensiMurni = (alpa * 3) + (izin * 1) + (sakit * 0.5);
  }

  // Total akumulasi kotor sebelum remisi/penebusan
  let totalPoinKotor = poinPelanggaranMurni + poinAbsensiMurni;

  // 3. Hitung akumulasi pengurangan dari menu Penebusan Poin
  let logPenebusanSiswa = [];
  if (DB.penebusan_poin) {
    logPenebusanSiswa = DB.penebusan_poin.filter(p => String(p.siswaId) === String(s.id));
    logPenebusanSiswa.forEach(p => {
      totalPoinPenebusan += (Number(p.poinPemulihan) || 0);
    });
  }

  // Hitung sisa bersih poin aktif siswa
  let sisaPoinAktif = totalPoinKotor - totalPoinPenebusan;
  if (sisaPoinAktif < 0) sisaPoinAktif = 0;

  // Format baris tabel riwayat penebusan dosa
  let barisPenebusanHtml = "";
  if (logPenebusanSiswa.length === 0) {
    barisPenebusanHtml = `<tr><td colspan="4" style="text-align:center; padding: 12px; color: #777; font-style: italic;">Siswa belum pernah melakukan instrumen penebusan poin/pemulihan perilaku.</td></tr>`;

function getBestStudent() {

  const ranking = [];

  (DB.siswa || []).forEach(siswa => {

    const hasil = hitungPoinSiswa(siswa.id);

    const totalKredit = hasil.totalKredit || 0;
    const totalPelanggaran = hasil.totalPelanggaran || 0;
    const sisaPoin = hasil.sisaPoin || 0;

    // hitung kehadiran
    const logAbsen = (DB.kehadiran || []).filter(
      k => String(k.siswaId) === String(siswa.id)
    );

    const tidakHadir = logAbsen.length;

    const hariAktif =
      getTotalHariAktif();

    const hadir =
      Math.max(0, hariAktif - tidakHadir);

    const persenHadir =
      hariAktif > 0
        ? (hadir / hariAktif) * 100
        : 100;

    ranking.push({
      siswa,
      totalKredit,
      totalPelanggaran,
      sisaPoin,
      persenHadir
    });

  });

  // filter syarat minimal
  const kandidat = ranking.filter(r =>
    r.persenHadir >= 95
  );

  kandidat.sort((a,b)=>
    b.sisaPoin - a.sisaPoin
  );

  return kandidat[0] || null;
}

          const logAbsen =

              );

          const hariAktif =
            getTotalHariAktif();

          const tidakHadir =
            logAbsen.length;

          const hadir =
            Math.max(0, hariAktif - tidakHadir);

          const persenHadir =
            hariAktif > 0
              ? (hadir / hariAktif) * 100
              : 100;

          totalKehadiran += persenHadir;

        });

        ranking.push({

          kelas,

          rataSisaPoin:
            totalSisaPoin /
            siswaKelas.length,

          rataKehadiran:
            totalKehadiran /
            siswaKelas.length

      ranking.sort((a,b)=>{

        if(
          b.rataSisaPoin !==
          a.rataSisaPoin
        ){
          return (
            b.rataSisaPoin -
            a.rataSisaPoin
          );
        }

        return (
          b.rataKehadiran -
          a.rataKehadiran
        );

      });

function getStatistikKehadiran(){
  // 1. Ambil jumlah siswa terdaftar secara aman
  const totalSiswa = Array.isArray(DB.siswa) ? DB.siswa.length : 0;

  // 2. KUNCI UTAMA: Paksa hari aktif ke 4 hari (24-27 Juni) jika fungsi global mengembalikan angka 0
  let hariAktif = 0;
  if (typeof getTotalHariAktif === 'function') hariAktif = getTotalHariAktif();
  if (hariAktif <= 0 && typeof hitungHariAktifSekolah === 'function') hariAktif = hitungHariAktifSekolah();
  
  // JIKA SEMUA FUNGSI PEMBANTU ANDA MENGEMBALIKAN 0, PAKSA KE 4 HARI (SESUAI PERIODE)
  if (hariAktif <= 0) {
    hariAktif = 4; 
  }

  // Jika tidak ada siswa atau hari aktif, kunci di angka 0 agar tidak terjadi error pembagian (NaN)
  if (totalSiswa === 0 || hariAktif === 0) {
    return {
      hadir: 0, sakit: 0, izin: 0, alpa: 0,
      persenHadir: 100, persenSakit: 0, persenIzin: 0, persenAlpa: 0
    };
  }

  // 3. Total slot absensi seharusnya (Contoh: 10 siswa x 4 hari = 40 slot)
  const totalKesempatan = totalSiswa * hariAktif;

  let sakit = 0;
  let izin = 0;
  let alpa = 0;

  // 4. Hitung log ketidakhadiran secara mutlak tanpa memedulikan siapa ID siswanya
  // Karena ini statistik global sekolah, kita cukup hitung total baris yang memuat status negatif
  (DB.kehadiran || []).forEach(k => {
    if (!k.status) return;
    const st = String(k.status).toLowerCase().trim();
    
    if (st === 'sakit' || st === 's') sakit++;
    else if (st === 'izin' || st === 'i') izin++;
    else if (st === 'alpa' || st === 'a') alpa++;
  });

  // 5. RUMUS DEWA: Hadir adalah sisa slot dari total kesempatan dikurangi yang absen
  // Cara ini menjamin meskipun sekretaris TIDAK menginput status "Hadir" ke database, 
  // angka Hadir di dashboard Anda akan tetap terbaca sempurna dan logis!
  const hadir = Math.max(0, totalKesempatan - sakit - izin - alpa);

  return {
    hadir, sakit, izin, alpa,
    persenHadir: (hadir / totalKesempatan) * 100,
    persenSakit: (sakit / totalKesempatan) * 100,
    persenIzin: (izin / totalKesempatan) * 100,
    persenAlpa: (alpa / totalKesempatan) * 100
  };
}
